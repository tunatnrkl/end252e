V.s7 = {
k:{konu:"Kesikli rastgele değişkenler, PMF ve CDF", on:"Olay, olasılık, sayma; geri koymadan çekiliş (1–4. videolar)."},
h:["Rastgele değişkeni “sonuca sayı veren fonksiyon” olarak tanımlayıp örnek uzayından türetebilmek",
   "Kesikli bir değişkenin PMF'sini yazıp iki koşulunu (p(x) ≥ 0, Σp = 1) kontrol edebilmek",
   "PMF'den CDF'yi kurup merdiven grafiğini çizebilmek",
   "CDF'den aralık olasılıklarını (P(a < X ≤ b), P(X ≥ a)) doğru sınırlarla hesaplayabilmek",
   "Geri koymadan çekilişte PMF'yi sayma ile bulabilmek"],
sc:[
{h:"Giriş", t:"Açılış", v:{type:"title",h:"Kesikli rastgele değişkenler",sub:"Sonuçlara sayı ver: PMF ve CDF",tags:["Random variable","PMF p(x)","CDF F(x)","Discrete"]}, d:"Başlık ve etiketler.",
 b:["Bu videoda olasılığı sayılara taşıyoruz. Artık sonuç yazı tura değil, yazı sayısı; sonuç sağlam kusurlu değil, kusurlu parça sayısı.","Rastgele değişkeni, olasılık kütle fonksiyonunu ve birikimli dağılım fonksiyonunu adım adım kuracağız."]},
{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"Sonuçları sayıya çevirince hesap kolaylaşır",items:["“Kusurlu parça sayısı en fazla 2 olsun” → sayılarla konuşuyoruz, kümelerle değil.","Ortalama, varyans, beklenen maliyet: hepsi sayı gerektirir.","Aynı soru tipleri (kaç başarı? kaç arıza?) için **hazır dağılımlar** kurulabilir: binom, Poisson…","Rastgele değişken, deneyin sonucu ile bu sayılar arasındaki köprüdür."]}, d:"Dört madde.",
 b:["Mühendislik soruları sayılarla gelir: kusurlu parça sayısı en fazla iki olsun. Kümelerle değil sayılarla konuşuyoruz.","Ortalama, varyans, beklenen maliyet gibi her şey sayı gerektirir.","Ve sonuçları sayıya çevirince kaç başarı, kaç arıza gibi soru tipleri için hazır dağılımlar kurabiliriz; binom ve Poisson gibi.","Rastgele değişken, deneyin sonucu ile bu sayılar arasındaki köprüdür."]},
{h:"Kavram 1 · Rastgele değişken", t:"Tanım", v:{type:"formula",h:"Rastgele değişken (random variable)",lines:[["X : S → ℝ","Her sonuca bir gerçek sayı veren fonksiyon"],["Büyük harf X: değişken;  küçük harf x: aldığı bir değer","P(X = x) : “X'in x değerini alma olasılığı”"],["Kesikli (discrete): değerler sayılabilir {x₁, x₂, …}","Sürekli (continuous): bir aralıktaki her değer (ileriki video)"]]}, d:"Üç kart; 5 saniye.", hold:5,
 b:["Tanım: rastgele değişken, örnek uzayındaki her sonuca bir gerçek sayı veren fonksiyondur. Rastgelelik sayıdan değil, deneyden gelir.","Gösterim: büyük harf X değişkenin kendisi, küçük harf x aldığı belirli bir değer. P X eşittir x, X'in x değerini alma olasılığı.","Değerler sayılabilirse, yani sıfır, bir, iki diye listelenebiliyorsa değişken kesiklidir. Sürekli değişkenleri daha sonra göreceğiz."]},
{t:"Görsel: sonuçtan sayıya", v:{type:"table",h:"İki para atışı, X = yazı sayısı",head:["Sonuç","Olasılık","X değeri"],rows:[["TT","1/4","0"],["YT","1/4","1"],["TY","1/4","1"],["YY","1/4","2"]],note:"X = 1 iki sonuçtan gelir → P(X = 1) = 1/4 + 1/4 = 1/2"}, d:"Dört satırlı tablo: sonuç, olasılık, X değeri; altta toplama notu.",
 b:["Somut örnek: iki para atışı, X yazı sayısı. Tura tura sonucunda X sıfır.","Yazı tura: X bir.","Tura yazı: yine X bir. İki farklı sonuç aynı sayıya gidiyor.","Yazı yazı: X iki.","X'in bir olma olasılığı, bire giden iki sonucun olasılıklarının toplamı: bir bölü iki. Değişkenin olasılıkları, örnek uzayından toplanarak gelir."]},
{h:"Kavram 2 · PMF", t:"Tanım ve koşullar", v:{type:"formula",h:"Olasılık kütle fonksiyonu (probability mass function, PMF)",lines:[["p(x) = P(X = x)","X'in tam olarak x olma olasılığı"],["Koşul 1:  p(x) ≥ 0  her x için","negatif olasılık yok"],["Koşul 2:  Σₓ p(x) = 1","tüm değerler üzerinden toplam 1"],["Olay olasılığı: P(X ∈ A) = Σ_{x∈A} p(x)","ilgili değerlerin kütlelerini topla"]]}, d:"Dört kart; 5 saniye.", hold:5,
 b:["Olasılık kütle fonksiyonu, PMF. Küçük p x, X'in tam olarak x olma olasılığı.","İki koşul: hiçbir değer negatif olasılık alamaz.","Ve bütün değerlerin olasılıkları toplanınca bir eder. Bir PMF verildiğinde ilk iş bu iki koşulu kontrol etmektir.","Bir olayın olasılığı, olaya giren değerlerin kütlelerini toplamaktır."]},
{t:"Görsel: PMF çubukları", v:{type:"bar",h:"X = yazı sayısı (2 para): PMF",x:["0","1","2"],y:[0.25,0.5,0.25],dec:2,ylabel:"p(x)",xlabel:"x"}, d:"Üç çubuk sırayla büyür: 0.25, 0.50, 0.25.",
 b:["PMF'yi çubuklarla çizeriz. X sıfır için çeyrek.","X bir için yarım; en yüksek çubuk.","X iki için çeyrek. Çubukların toplamı bir. Kütle kelimesi buradan gelir: olasılık, noktalarda yığılmış kütleler gibidir."]},
{h:"Kavram 3 · CDF", t:"Tanım", v:{type:"formula",h:"Birikimli dağılım fonksiyonu (cumulative distribution function, CDF)",lines:[["F(x) = P(X ≤ x) = Σ_{t ≤ x} p(t)","x'e kadar (x dahil) biriken olasılık"],["F artmayan değildir: azalmaz, 0'dan 1'e çıkar","lim F = 0 (x→−∞), lim F = 1 (x→+∞)"],["Kesiklide F merdiven (step) şeklindedir","Her değerde p(x) kadar sıçrar; sağdan süreklidir"]]}, d:"Üç kart; 5 saniye.", hold:5,
 b:["Birikimli dağılım fonksiyonu, CDF. Büyük F x, X'in x veya daha küçük olma olasılığı; x'e kadar biriken olasılık.","F hiç azalmaz; eksi sonsuzda sıfır, artı sonsuzda bir.","Kesikli değişkende F bir merdivendir: her değerde o değerin kütlesi kadar sıçrar ve sıçramanın değeri sağdaki basamağa aittir; sağdan sürekli deriz."]},
{t:"Görsel: merdiven grafiği", v:{type:"stair",x:[0,1,2],F:[0.25,0.75,1]}, d:"CDF merdiveni: x=0'da 0.25'e sıçrar, x=1'de 0.75'e, x=2'de 1'e; dolu/boş noktalarla hangi uçun dahil olduğu gösterilir.",
 b:["Merdiveni çizelim. Sıfırdan önce F sıfır. X sıfırda çeyrek kadar sıçrar: F sıfır eşittir sıfır nokta yirmi beş.","X birde yarım kadar daha sıçrar: F bir eşittir sıfır nokta yetmiş beş.","X ikide son çeyrek: F iki eşittir bir. Dolu nokta değerin dahil olduğunu, boş nokta dahil olmadığını gösterir. Sıçrama yükseklikleri PMF'nin kendisidir; CDF'den PMF'ye böyle dönülür."]},
{h:"Kavram 4 · CDF ile aralık olasılıkları", t:"Sınırlara dikkat", v:{type:"formula",h:"CDF'den olasılık okumak (tam sayı değerli X için)",lines:[["P(a < X ≤ b) = F(b) − F(a)","üst sınır dahil, alt sınır hariç: CDF'nin doğal şekli"],["P(X ≥ a) = 1 − F(a − 1)","“a veya daha fazla” = 1 − “a'dan küçük”"],["P(X < a) = F(a − 1),   P(X = a) = F(a) − F(a − 1)","< ile ≤ farkı: kesiklide bir değer fark eder"]]}, d:"Üç kart; sınır notları vurgulu; 5 saniye.", hold:5,
 b:["CDF'den olasılık okurken sınırlara çok dikkat. a'dan büyük, b'den küçük veya eşit: F b eksi F a. CDF'nin doğal biçimi üst sınır dahil, alt sınır hariçtir.","X büyük eşit a: bir eksi F a eksi bir. Çünkü a'dan küçük olmak, a eksi bire kadar olmak demektir.","Küçük ile küçük eşit farkı kesiklide bir değer fark ettirir. Tek bir değerin olasılığı iki ardışık F değerinin farkıdır."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["P(X < 2) yerine F(2) yazmak","P(X ≥ 2) = 1 − F(2) yazmak","PMF toplamını kontrol etmeden ilerlemek","Geri koymadan çekilişte bağımsız gibi çarpmak"]},r:{h:"Doğru",items:["P(X < 2) = F(1) (tam sayılı X)","P(X ≥ 2) = 1 − F(1)","Önce Σ p(x) = 1 ve p(x) ≥ 0 kontrolü","PMF'yi sayma (kombinasyon) ile kur"]},verdict:"Kesiklide “<” ve “≤” farklıdır; sınırı yazmadan geçme."}, d:"Yanlış/doğru karşılaştırması.",
 b:["Hatalar. X küçük ikiyi F iki sanmak; doğrusu F bir.","X büyük eşit ikiyi bir eksi F iki sanmak; doğrusu bir eksi F bir.","PMF'nin toplamını kontrol etmeden ilerlemek.","Ve geri koymadan çekilişte denemeleri bağımsız gibi çarpmak. Kesiklide küçük ile küçük eşit farklıdır; sınırı açıkça yaz."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Kesikli RV",items:["X: sonuca sayı veren fonksiyon; P(X = x) sonuçlardan toplanır.","PMF: p(x) ≥ 0, Σ p(x) = 1.","CDF: F(x) = P(X ≤ x), merdiven; sıçrama = p(x).","P(a < X ≤ b) = F(b) − F(a);  P(X ≥ a) = 1 − F(a−1).","“<” ve “≤” farklı; sınırı her zaman yaz."]}, d:"Özet kartı; 5 saniye.", hold:5,
 b:["Özet. Rastgele değişken sonuca sayı verir; olasılıkları sonuçlardan toplanır.","PMF iki koşul: negatif değil, toplam bir.","CDF biriktirir; kesiklide merdiven, sıçramalar PMF'dir.","Aralık olasılıkları CDF farklarıyla.","Küçük ve küçük eşit farkını unutma."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"X = 2 para atışında yazı sayısı",lines:["PMF: p(0) = 1/4,  p(1) = 1/2,  p(2) = 1/4;  toplam = 1 ✓","CDF: F(0) = 1/4,  F(1) = 3/4,  F(2) = 1","P(X ≤ 1) = F(1) = **3/4**","P(X ≥ 1) = 1 − F(0) = **3/4**","P(0 < X ≤ 2) = F(2) − F(0) = **3/4** (= p(1) + p(2))"]}, d:"Beş adım.",
 b:["Basit örnek, aynı iki para. PMF: çeyrek, yarım, çeyrek; toplam bir.","CDF: çeyrek, dörtte üç, bir.","X küçük eşit bir: F bir, dörtte üç.","X büyük eşit bir: bir eksi F sıfır, yine dörtte üç.","Sıfırdan büyük, ikiden küçük eşit: F iki eksi F sıfır, dörtte üç; p bir artı p iki ile aynı."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir kutuda 3 sağlam, 2 kusurlu parça var. Geri koymadan 2 parça çekiliyor. X = çekilen kusurlu parça sayısı.",parts:["(a) X'in PMF'sini bul.","(b) CDF'yi yaz ve P(X ≥ 1)'i CDF'den hesapla."],secs:10}, d:"Soru ve iki şık; geri sayım.",
 b:["Zor örnek. Kutuda üç sağlam, iki kusurlu parça; geri koymadan iki parça çekiliyor. X kusurlu sayısı. a: PMF. b: CDF ve X büyük eşit bir. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: bağımsız gibi çarpmak",lines:["“p(2) = (2/5)·(2/5) = 0.16” ✗ → geri koymadan çekilişte 2. çekiliş bağımlıdır","Doğrusu: (2/5)·(1/4) = 0.10  ya da  C(2,2)/C(5,2) = 1/10","Kontrol: yanlış PMF'nin toplamı 1 etmez"]}, d:"Kırmızı yanlış yol.",
 b:["Yaygın yanlış: iki kusurluyu iki bölü beş çarpı iki bölü beş diye hesaplamak. Geri koymadan çekilişte ikinci çekiliş birinciye bağlıdır.","Doğrusu iki bölü beş çarpı bir bölü dört, ya da kombinasyonla ikinin ikilisi bölü beşin ikilisi, onda bir.","Pratik kontrol: yanlış PMF'nin toplamı bir etmez."]},
{t:"Zor örnek: çözüm", v:{type:"steps",h:"Sayma ile PMF, sonra CDF",lines:["Toplam seçim: C(5,2) = 10 (eşit olasılıklı)","p(0) = C(3,2)/10 = 3/10;  p(1) = C(2,1)·C(3,1)/10 = 6/10;  p(2) = C(2,2)/10 = 1/10","Kontrol: 0.3 + 0.6 + 0.1 = 1 ✓","CDF: F(0) = 0.3,  F(1) = 0.9,  F(2) = 1","P(X ≥ 1) = 1 − F(0) = **0.7**   (= p(1) + p(2) ✓)","Not: bu bir hipergeometrik dağılımdır (ileride)"]}, d:"Altı adım; PMF, kontrol, CDF, sonuç.",
 b:["Çözüm. Beş parçadan ikisini seçmenin on yolu var, hepsi eşit olasılıklı.","Sıfır kusurlu: üç sağlamdan iki, üç yol; onda üç. Bir kusurlu: iki kusurludan bir, üç sağlamdan bir, altı yol; onda altı. İki kusurlu: tek yol; onda bir.","Toplam bir; PMF geçerli.","CDF: sıfır nokta üç, sıfır nokta dokuz, bir.","X büyük eşit bir: bir eksi F sıfır, sıfır nokta yedi.","Bu dağılımın bir adı var: hipergeometrik. İleriki videoda genel formülünü göreceğiz."]},
{t:"Zor örnek: PMF ve CDF görseli", v:{type:"bar",h:"X = kusurlu sayısı: PMF",x:["0","1","2"],y:[0.3,0.6,0.1],dec:2,ylabel:"p(x)",xlabel:"x"}, d:"Üç çubuk: 0.3, 0.6, 0.1.",
 b:["PMF'nin çubukları: sıfırda sıfır nokta üç.","Birde sıfır nokta altı.","İkide sıfır nokta bir. CDF'yi çizmek istersen bu çubukları soldan sağa biriktir: sıfır nokta üç, sıfır nokta dokuz, bir."]},
{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["Rastgele değişken = sonuca sayı; olasılıkları örnek uzayından topla.","PMF koşullarını her zaman kontrol et.","CDF biriktirir; sıçramalar PMF'dir.","Sınırlar: P(X ≥ a) = 1 − F(a−1); “<” ≠ “≤”.","Geri koymadan çekiliş → PMF'yi kombinasyonla kur."]}, d:"Sonuç kartı; 4 saniye.", hold:4,

V.s8 = {
k:{konu:"Beklenen değer, varyans ve standart sapma", on:"Kesikli rastgele değişken ve PMF (7. video)."},
h:["E[X] = Σ x p(x) ile beklenen değeri hesaplayıp “uzun vadeli ortalama” olarak yorumlayabilmek",
   "E[g(X)] kuralı ile fonksiyonların beklenen değerini bulabilmek",
   "Var(X) = E[X²] − (E[X])² pratik formülünü türetip uygulayabilmek",
   "E[aX+b] = aE[X]+b ve Var(aX+b) = a²Var(X) doğrusal dönüşüm kurallarını kullanabilmek",
   "Varyans ile standart sapmayı birimleriyle doğru yorumlayabilmek"],
sc:[
{h:"Giriş", t:"Açılış", v:{type:"title",h:"Beklenen değer ve varyans",sub:"Bir dağılımı iki sayıyla özetlemek",tags:["Expected value E[X]","Variance Var(X)","Standard deviation σ","Linearity"]}, d:"Başlık ve etiketler.",
 b:["PMF bir dağılımın tamamını anlatır ama bazen iki sayı yeter: merkez nerede, dağınıklık ne kadar? Bu videoda beklenen değeri ve varyansı tanımlıyor, pratik formüllerini türetiyor ve karar problemlerinde kullanıyoruz."]},
{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"Karar vermek için özet sayılar",items:["İki yatırım: hangisinin **ortalama** getirisi yüksek? → E[X]","Hangisi daha **riskli**? → Var(X), σ","Üretimde beklenen kusur sayısı, beklenen maliyet, beklenen bekleme süresi…","Dağılımın tamamını taşımak yerine merkez + dağınıklık ile karşılaştırma yaparız."]}, d:"Dört madde.",
 b:["İki yatırım seçeneği var. Hangisinin ortalama getirisi daha yüksek? Beklenen değer cevaplar.","Hangisi daha riskli? Varyans ve standart sapma cevaplar.","Üretimde beklenen kusur sayısı, beklenen maliyet, beklenen bekleme süresi hep aynı araçla hesaplanır.","Dağılımın tamamını taşımak yerine merkezi ve dağınıklığı taşırız."]},
{h:"Kavram 1 · Beklenen değer", t:"Tanım", v:{type:"formula",h:"Beklenen değer (expected value, mean)",lines:[["E[X] = μ = Σₓ x · p(x)","Her değer, olasılığıyla ağırlıklandırılıp toplanır"],["Yorum: deneyi çok kez tekrarlarsan gözlenen ortalama μ'ye yaklaşır","(büyük sayılar yasası)"],["E[X], X'in alabileceği bir değer olmak zorunda değildir","Zar: E[X] = 3.5"]]}, d:"Üç kart; 5 saniye.", hold:5,
 b:["Beklenen değer, expected value; mü harfiyle de gösterilir. Her değeri olasılığıyla çarp, topla: ağırlıklı ortalama.","Yorumu: deneyi çok kez tekrarlarsan gözlediğin ortalama bu sayıya yaklaşır. Buna büyük sayılar yasası denir.","Dikkat: beklenen değer, X'in alabileceği bir değer olmak zorunda değil. Zarın beklenen değeri üç buçuktur; hiçbir zar üç buçuk gelmez."]},
{t:"Görsel: denge noktası", v:{type:"bar",h:"Zar: PMF ve denge noktası",x:["1","2","3","4","5","6"],y:[0.167,0.167,0.167,0.167,0.167,0.167],dec:3,ylabel:"p(x)",marker:{x:2.5,label:"E[X] = 3.5",s:6}}, d:"Altı eşit çubuk; sonra 3.5 konumunda sarı üçgen “denge noktası” belirir.",
 b:["Fiziksel bir yorum: çubukları birer kütle gibi düşün. Beklenen değer, bu kütlelerin dengelendiği noktadır; ağırlık merkezi.","Zar için altı eşit kütle, üç ile dördün tam ortasında dengelenir: üç buçuk. Hesapla da aynı: bir artı iki artı üç artı dört artı beş artı altı, bölü altı."]},
{h:"Kavram 2 · Fonksiyonun beklenen değeri", t:"E[g(X)]", v:{type:"formula",h:"Bir fonksiyonun beklenen değeri",lines:[["E[g(X)] = Σₓ g(x) · p(x)","g(X)'in PMF'sini bulmana gerek yok; değerleri dönüştür, aynı olasılıklarla topla"],["Örnek: E[X²] = Σ x² p(x)","varyans için gerekli"],["Doğrusallık: E[aX + b] = a·E[X] + b","toplamın beklenen değeri beklenen değerlerin toplamı"]]}, d:"Üç kart; 4 saniye.", hold:4,
 b:["X'in bir fonksiyonunun beklenen değeri: her x değerini g ile dönüştür, aynı olasılıklarla topla. Yeni bir PMF kurmana gerek yok.","En sık kullandığımız: X karenin beklenen değeri.","Ve doğrusallık: a X artı b'nin beklenen değeri a çarpı E X artı b. Sabitler dışarı çıkar."]},
{h:"Kavram 3 · Varyans", t:"Tanım", v:{type:"formula",h:"Varyans (variance) ve standart sapma (standard deviation)",lines:[["Var(X) = σ² = E[(X − μ)²] = Σ (x − μ)² p(x)","ortalamadan sapmaların karelerinin ortalaması"],["σ = √Var(X)","X ile aynı birimde dağınıklık ölçüsü"],["Var(X) ≥ 0;  Var(X) = 0 ⟺ X sabittir","dağınıklık yoksa varyans sıfır"]]}, d:"Üç kart; 5 saniye.", hold:5,
 b:["Varyans: ortalamadan sapmaların karelerinin beklenen değeri. Kare alıyoruz ki negatif ve pozitif sapmalar birbirini götürmesin.","Varyansın birimi X'in biriminin karesidir; o yüzden karekökünü alırız: standart sapma, sigma. X ile aynı birimde dağınıklık.","Varyans hiç negatif olmaz; sıfırsa X sabittir."]},
{t:"Pratik formül: türetme", v:{type:"steps",h:"Var(X) = E[X²] − (E[X])²",lines:["(X − μ)² = X² − 2μX + μ²","E[(X − μ)²] = E[X²] − 2μ·E[X] + μ²   (doğrusallık; μ sabit)","E[X] = μ olduğundan: = E[X²] − 2μ² + μ²","**Var(X) = E[X²] − μ²**","Hesap sırası: önce E[X], sonra E[X²], sonra çıkar, sonra karekök → σ"]}, d:"Türetme adımları; sonuç kalın; hesap sırası.",
 b:["Pratik formülü türetelim. Kareyi aç: X kare eksi iki mü X artı mü kare.","Beklenen değerin doğrusallığıyla terimlere dağıt; mü sabit olduğu için dışarı çıkar.","E X eşittir mü koy: eksi iki mü kare artı mü kare.","Sonuç: varyans, X karenin beklenen değeri eksi beklenen değerin karesi.","Sınavdaki hesap sırası hep aynı: önce E X, sonra E X kare, çıkar, karekök al."]},
{t:"Görsel: aynı ortalama, farklı dağınıklık", v:{type:"bar",x:["−2","−1","0","1","2"],frames:[[0.05,0.2,0.5,0.2,0.05],[0.3,0.15,0.1,0.15,0.3]],flabels:["μ = 0, Var = 0.6  (toplanmış)","μ = 0, Var = 2.7  (dağınık)"],dec:2,ylabel:"p(x)"}, d:"Beş çubuk: önce ortada toplanmış dağılım, sonra kenarlara dağılmış dağılım; etiketler varyansları gösterir.",
 b:["İki dağılım. İlkinde kütle ortada toplanmış; ortalama sıfır, varyans sıfır nokta altı.","İkincisinde kütle kenarlara dağılmış; ortalama yine sıfır, ama varyans iki nokta yedi. Ortalama aynı, risk çok farklı. Varyans bu farkı ölçer."]},
{h:"Kavram 4 · Doğrusal dönüşüm", t:"Birim değiştirme, vergi, komisyon", v:{type:"steps",h:"Y = aX + b için E[Y] ve Var(Y)",lines:["E[Y] = a·E[X] + b   (doğrusallık)","Y − E[Y] = aX + b − aμ − b = a(X − μ)","Var(Y) = E[a²(X − μ)²] = a²·Var(X)","**Var(aX + b) = a² Var(X),   σ_Y = |a| σ_X**","b (sabit kaydırma) dağınıklığı değiştirmez; a ölçekler"]}, d:"Beş adım; sonuç kalın.",
 b:["Sık gereken bir kural: X'i doğrusal dönüştürürsek, mesela vergi ya da birim değişimi.","Beklenen değer doğrusal: a E X artı b.","Sapmaya bakalım: Y eksi ortalaması, a çarpı X eksi mü. b yok oldu.","Kare alıp beklenen değer: a kare çarpı varyans.","Sabit kaydırma dağınıklığı değiştirmez; çarpan karesiyle etkiler. Standart sapma ise a'nın mutlak değeriyle çarpılır."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["Var(X) = E[X²] − E[X]  (kare unutuldu)","Var(aX) = a·Var(X)","Var(X + b) = Var(X) + b","σ ile σ² karıştırmak; birim hatası","E[X²] = (E[X])² sanmak"]},r:{h:"Doğru",items:["Var(X) = E[X²] − (E[X])²","Var(aX) = a²·Var(X)","Var(X + b) = Var(X)","σ = √Var, X'in biriminde; Var birimin karesinde","E[X²] ≥ (E[X])²; fark = Var(X) ≥ 0"]},verdict:"Kontrol: varyans negatif çıktıysa kesin bir hata var."}, d:"Yanlış/doğru karşılaştırması.",
 b:["Hatalar. Pratik formülde beklenen değerin karesini unutmak.","Çarpanı kare almadan varyansa uygulamak.","Sabit eklemenin varyansı değiştirdiğini sanmak.","Sigma ile sigma kareyi karıştırmak; birim hatası.","Ve X karenin beklenen değerini beklenen değerin karesi sanmak; aralarındaki fark tam olarak varyanstır. Varyans negatif çıktıysa kesin hata var."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · E[X] ve Var(X)",items:["E[X] = Σ x p(x): ağırlıklı ortalama, denge noktası.","E[g(X)] = Σ g(x) p(x);  E[aX+b] = aE[X]+b.","Var(X) = E[(X−μ)²] = E[X²] − μ²;  σ = √Var.","Var(aX+b) = a² Var(X);  σ_{aX+b} = |a| σ.","Hesap sırası: E[X] → E[X²] → Var → σ."]}, d:"Özet kartı; 5 saniye.", hold:5,
 b:["Özet. Beklenen değer ağırlıklı ortalama, denge noktası.","Fonksiyonların beklenen değeri ve doğrusallık.","Varyans pratik formülle; standart sapma karekök.","Doğrusal dönüşümde çarpanın karesi.","Hesap sırası: E X, E X kare, varyans, sigma."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"X = 2 para atışında yazı sayısı: p(0)=¼, p(1)=½, p(2)=¼",lines:["E[X] = 0·¼ + 1·½ + 2·¼ = **1**","E[X²] = 0²·¼ + 1²·½ + 2²·¼ = 0 + 0.5 + 1 = **1.5**","Var(X) = 1.5 − 1² = **0.5**;  σ = √0.5 ≈ **0.707**","Y = 10X − 3 (TL kazanç): E[Y] = 10·1 − 3 = **7**;  Var(Y) = 100·0.5 = **50**;  σ_Y ≈ 7.07"]}, d:"Dört adım; sonuçlar kalın.",
 b:["Basit örnek. İki para, X yazı sayısı.","Beklenen değer: sıfır çarpı çeyrek artı bir çarpı yarım artı iki çarpı çeyrek, bir.","X karenin beklenen değeri: sıfır artı yarım artı bir, bir buçuk.","Varyans bir buçuk eksi bir, sıfır nokta beş; sigma yaklaşık sıfır nokta yedi.","Bir dönüşüm: her yazı on lira kazandırıyor, üç lira giriş ücreti var. Beklenen kazanç yedi; varyans yüz çarpı sıfır nokta beş, elli."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir girişim: %60 ihtimalle 50 bin TL kazanç, %30 ihtimalle 10 bin TL kazanç, %10 ihtimalle 80 bin TL kayıp. X = kazanç (bin TL).",parts:["(a) E[X] ve Var(X), σ_X?","(b) Vergi ve sabit gider sonrası net kazanç Y = 0.8X − 2 için E[Y] ve σ_Y?"],secs:10}, d:"Soru ve iki şık; geri sayım.",
 b:["Zor örnek. Bir girişim yüzde altmış ihtimalle elli bin kazandırıyor, yüzde otuz ihtimalle on bin, yüzde on ihtimalle seksen bin kaybettiriyor. X bin lira cinsinden kazanç. a: beklenen değer, varyans ve sigma. b: net kazanç sıfır nokta sekiz X eksi iki için beklenen değer ve sigma. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: dönüşümde çarpanı kare almamak",lines:["“Var(Y) = 0.8 · Var(X)” ✗  → doğrusu 0.8² = 0.64 ile çarp","“Var(Y) = 0.64·Var(X) − 2” ✗  → sabit gider varyansı değiştirmez","Kaybı pozitif almak: X = +80 ✗  → kayıp negatif değerdir"]}, d:"Kırmızı yanlış yol; üç tipik hata.",
 b:["Yaygın yanlışlar: varyansı sıfır nokta sekizle çarpmak; doğrusu sıfır nokta altmış dörtle.","Sabit gideri varyanstan çıkarmak; sabit, dağınıklığı değiştirmez.","Ve kaybı pozitif sayı olarak almak; kayıp eksi seksendir."]},
{t:"Zor örnek: çözüm", v:{type:"steps",h:"Doğru çözüm (bin TL)",lines:["E[X] = 0.6·50 + 0.3·10 + 0.1·(−80) = 30 + 3 − 8 = **25**","E[X²] = 0.6·2500 + 0.3·100 + 0.1·6400 = 1500 + 30 + 640 = 2170","Var(X) = 2170 − 25² = 2170 − 625 = **1545**;  σ_X = √1545 ≈ **39.3**","(b) E[Y] = 0.8·25 − 2 = **18**","Var(Y) = 0.8²·1545 = 0.64·1545 = 988.8;  σ_Y = 0.8·39.3 ≈ **31.4**","Yorum: beklenen net kazanç 18 bin, ama σ ≈ 31 bin: yüksek riskli girişim"]}, d:"Altı adım; sonuçlar kalın; yorum.",
 b:["Çözüm. Beklenen kazanç: otuz artı üç eksi sekiz, yirmi beş bin lira.","X karenin beklenen değeri: bin beş yüz artı otuz artı altı yüz kırk, iki bin yüz yetmiş.","Varyans: iki bin yüz yetmiş eksi altı yüz yirmi beş, bin beş yüz kırk beş. Sigma yaklaşık otuz dokuz bin.","b: beklenen net kazanç sıfır nokta sekiz çarpı yirmi beş eksi iki, on sekiz bin.","Varyans sıfır nokta altmış dört çarpı bin beş yüz kırk beş; sigma sıfır nokta sekiz çarpı otuz dokuz, yaklaşık otuz bir bin.","Yorum: beklenen net kazanç on sekiz bin, ama standart sapma otuz bir bin. Beklenen değer pozitif olsa da risk çok yüksek; iki sayı birlikte okunmalı."]},
{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["E[X]: merkez, uzun vadeli ortalama; X'in aldığı bir değer olmayabilir.","Var ve σ: dağınıklık, risk; σ X ile aynı birimde.","Pratik formül: E[X²] − μ²; sıra E[X] → E[X²] → Var → σ.","Doğrusal dönüşüm: E ölçek+kayma, Var sadece ölçeğin karesi.","Karar için iki sayıyı birlikte oku: getiri ve risk."]}, d:"Sonuç kartı; 4 saniye.", hold:4,
 b:["Tekrar. Beklenen değer merkezdir.","Varyans ve sigma dağınıklık ve risktir.","Pratik formül ve hesap sırası.","Doğrusal dönüşümde varyans sadece ölçekten etkilenir.","Karar için iki sayıyı birlikte oku."]},
{h:"Kapanış", t:"Sonraki adım", v:{type:"text",h:"Sıradaki video: Bernoulli ve Binom dağılımı",items:["İlk hazır dağılımlarımız: tek deneme (Bernoulli) ve n bağımsız deneme (Binom); E ve Var formülleriyle.","Tekrar: zar için E[X] = 3.5 ve Var(X) = 35/12 ≈ 2.92 olduğunu kendin hesapla.","Ders notu şablonunu doldur."]}, d:"Kapanış maddeleri.",

{t:"Kaç dizilim var?", v:{type:"steps",h:"Binom PMF'si",lines:["k başarılı, n−k başarısız her dizilimin olasılığı: pᵏ (1−p)ⁿ⁻ᵏ","Kaç dizilim? n konumdan k tanesini başarı için seç: C(n,k)","Dizilimler ayrık olaylar → topla (hepsi aynı olasılık):","**P(X = k) = C(n,k) · pᵏ · (1−p)ⁿ⁻ᵏ,   k = 0, 1, …, n**","Kontrol: Σ P(X=k) = (p + (1−p))ⁿ = 1  (binom açılımı)"]}, d:"Türetme adımları; PMF kalın; binom açılımı ile kontrol.",

 b:["Formül kartı. PMF: ilk k eksi bir deneme başarısız, k'ıncı deneme başarılı.","Çok kullanışlı bir kısayol: X'in k'dan büyük olması, ilk k denemenin hepsinin başarısız olması demek. Bir eksi p üssü k.","Beklenen değer bir bölü p. Sezgisel: her denemede beşte bir şans varsa ortalama beş deneme gerekir.","Varyans bir eksi p bölü p kare; p küçükken belirsizlik çok büyür."]},
{t:"Görsel: PMF'nin şekli", v:{type:"bar",h:"Geometrik(0.2): her adımda 0.8 ile çarpılır",x:["1","2","3","4","5","6","7"],y:[0.2,0.16,0.128,0.102,0.082,0.066,0.052],dec:3,ylabel:"p(k)",xlabel:"k"}, d:"Yedi çubuk sırayla; her biri öncekinin 0.8 katı: geometrik azalış.",
 b:["PMF'nin şekli: en yüksek çubuk her zaman birinci denemede, p.","Sonra her adımda bir eksi p ile çarpılır: sıfır nokta on altı, sıfır nokta yüz yirmi sekiz, ve azalarak devam eder.","Çubuklar bir geometrik dizi oluşturur; adı buradan gelir. Toplamları p bölü bir eksi bir eksi p, yani bir."]},
{h:"Kavram 2 · Beklenen değer", t:"E[X] = 1/p neden?", v:{type:"steps",h:"E[X] = 1/p (koşullama ile kısa ispat)",lines:["İlk deneme başarılıysa (olasılık p): X = 1","İlk deneme başarısızsa (olasılık 1−p): bir deneme harcandı ve süreç **baştan başlar** → E[X | F] = 1 + E[X]","Toplam beklenen değer: E[X] = p·1 + (1−p)·(1 + E[X])","E[X] = 1 + (1−p)E[X]  ⟹  p·E[X] = 1","**E[X] = 1/p**"]}, d:"Beş adım; koşullama ile ispat.",

{h:"Kavram 3 · Hafızasızlık", t:"Tanım", v:{type:"formula",h:"Hafızasızlık (memoryless / lack of memory)",lines:[["P(X > m + n | X > m) = P(X > n)","m deneme başarısız geçtiyse, “n deneme daha” beklemenin olasılığı, baştan n deneme beklemekle aynı"],["Geçmiş başarısızlıklar geleceği değiştirmez","“Artık sırası geldi” diye bir şey yoktur (kumarbaz yanılgısı)"]]}, d:"İki kart; 5 saniye.", hold:5,
 b:["Geometrik dağılımın en özel özelliği hafızasızlık, memoryless. m deneme başarısız geçtiyse, en az n deneme daha beklemenin olasılığı, baştan en az n deneme beklemekle aynıdır.","Geçmiş başarısızlıklar geleceği değiştirmez. Beş kez tura geldi, artık yazının sırası geldi düşüncesi yanlıştır; buna kumarbaz yanılgısı denir."]},
{t:"Hafızasızlık: ispat", v:{type:"steps",h:"P(X > m + n | X > m) = P(X > n)",lines:["Tanım: P(X > m+n | X > m) = P(X > m+n ∩ X > m) / P(X > m)","X > m+n zaten X > m'yi içerir → pay = P(X > m+n) = (1−p)ᵐ⁺ⁿ","Payda: P(X > m) = (1−p)ᵐ","Oran: (1−p)ᵐ⁺ⁿ / (1−p)ᵐ = (1−p)ⁿ = **P(X > n)**  ✓"]}, d:"Dört ispat adımı.",
 b:["İspat kısa. Koşullu olasılık tanımıyla başla.","X m artı n'den büyükse zaten m'den de büyüktür; kesişim sadece büyük olan olaydır. Pay bir eksi p üssü m artı n.","Payda bir eksi p üssü m.","Böl: bir eksi p üssü n. Bu da baştan X'in n'den büyük olma olasılığı. İspat tamam."]},
{h:"Kavram 4 · Binom ile karşılaştırma", t:"Ne sabit, ne rastgele?", v:{type:"table",h:"Binom mu, geometrik mi?",head:["","Binom(n, p)","Geometrik(p)"],rows:[["Sabit olan","Deneme sayısı n","Başarı sayısı (1 başarı)"],["Rastgele olan","Başarı sayısı X","Deneme sayısı X"],["Soru","“n denemede kaç başarı?”","“İlk başarı kaçıncı denemede?”"],["Değerler","0, 1, …, n","1, 2, 3, …"],["E[X]","np","1/p"]],note:"Ortak nokta: bağımsız, sabit p'li Bernoulli denemeleri."}, d:"Beş satırlı karşılaştırma tablosu.",
 b:["Binom ile geometriği karşılaştıralım. Binomda deneme sayısı sabittir.","Rastgele olan başarı sayısıdır. Geometrikte ise tam tersi: başarı sayısı bir, deneme sayısı rastgele.","Soru cümlesi ayırt ettirir: kaç başarı, binom; kaçıncı denemede, geometrik.","Binom sıfırdan n'e; geometrik birden sonsuza.","Beklenen değerler n p ve bir bölü p. Ortak nokta: ikisi de bağımsız, sabit p'li Bernoulli denemelerine dayanır."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["P(X = k) = (1−p)ᵏ p yazmak (üs hatası)","P(X > k) için PMF'leri sonsuza kadar toplamaya çalışmak","“5 kez başarısız oldu, şimdi başarı daha olası” demek","X'i başarısızlık sayısı olarak tanımlayan kitapla karıştırmak"]},r:{h:"Doğru",items:["Üs k−1: ilk k−1 deneme başarısız","P(X > k) = (1−p)ᵏ kısayolu","Hafızasızlık: olasılık değişmez","Tanımı kontrol et: bu derste X = deneme numarası (1'den başlar)"]},verdict:"Önce X'in neyi saydığını yaz: deneme numarası mı, başarısızlık sayısı mı?"}, d:"Yanlış/doğru karşılaştırması.",
 b:["Hatalar. Üssü k yazmak; doğrusu k eksi bir.","X büyük k için sonsuz toplam yapmak; kısayol var.","Başarısızlıklar birikti, başarı yakın demek; hafızasızlık bunu reddeder.","Ve bazı kitaplar X'i başarısızlık sayısı olarak tanımlar, sıfırdan başlar. Bu derste X deneme numarasıdır, birden başlar. Soruda tanımı kontrol et."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Geometrik",items:["X = ilk başarının deneme numarası; k = 1, 2, 3, …","P(X = k) = (1−p)ᵏ⁻¹ p;  P(X > k) = (1−p)ᵏ.","E[X] = 1/p,  Var(X) = (1−p)/p².","Hafızasız: P(X > m+n | X > m) = P(X > n).","Binom: sabit n, rastgele başarı. Geometrik: sabit 1 başarı, rastgele n."]}, d:"Özet kartı; 5 saniye.", hold:5,

{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"Satış: her aramada p = 0.2",lines:["P(ilk satış 3. aramada) = 0.8² · 0.2 = **0.128**","P(ilk 3 aramada satış yok) = P(X > 3) = 0.8³ = **0.512**","P(en geç 3. aramada satış) = 1 − 0.512 = **0.488**","E[X] = 1/0.2 = **5 arama**;  Var(X) = 0.8/0.04 = 20, σ ≈ 4.5"]}, d:"Dört adım.",

{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: (c) için koşulu unutmak ya da yanlış yorumlamak",lines:["“(c) = P(X > 8) = 0.9⁸ = 0.430” ✗ → 5 parçanın geçtiği bilgisi kullanılmadı","“5 parça geçti, hata artık yakın; olasılık düşer” ✗ → kumarbaz yanılgısı","Doğrusu: hafızasızlık → P(X > 8 | X > 5) = P(X > 3)"]}, d:"Kırmızı yanlış yol.",

{t:"Zor örnek: çözüm", v:{type:"steps",h:"Doğru çözüm: “başarı” = hata, p = 0.1",lines:["X ~ Geometrik(0.1): her parça 0.9 doğru, 0.1 hata","(a) P(X = 4) = 0.9³ · 0.1 = 0.729 · 0.1 = **0.0729**","(b) P(X > 5) = 0.9⁵ = **0.590**","(c) P(X > 8 | X > 5) = P(X > 3) = 0.9³ = **0.729**  (hafızasızlık)","Kontrol (tanımla): P(X > 8)/P(X > 5) = 0.9⁸/0.9⁵ = 0.9³ ✓","E[X] = 1/0.1 = 10: ortalama 10. parçada ilk hata"]}, d:"Altı adım; sonuçlar kalın; hafızasızlık sağlaması.",

{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["Geometrik: ilk başarıya kadar deneme sayısı; PMF (1−p)ᵏ⁻¹p.","Kuyruk kısayolu: P(X > k) = (1−p)ᵏ.","E[X] = 1/p: sezgisel ve koşullama ile ispatlanabilir.","Hafızasızlık: geçmiş başarısızlıklar geleceği etkilemez.","Soru “kaçıncı denemede?” ise geometrik, “kaç başarı?” ise binom."]}, d:"Sonuç kartı; 4 saniye.", hold:4,

/* Browser speech fallback (GitHub Pages, Safari, etc.): Turkish voice via speechSynthesis */
function makeBrowserTTS(){
  const ss = window.speechSynthesis; if(!ss || typeof SpeechSynthesisUtterance==="undefined") return null;
  let lineCb=null, stateCb=null, rate=1, token=0;
  const pickVoice=()=>{ const vs=ss.getVoices(); return vs.find(v=>/^tr(-|_|$)/i.test(v.lang)) || null; };
  return {
    onLine(f){ lineCb=f; }, onState(f){ stateCb=f; },
    setRate(r){ rate=r; },
    stop(){ token++; try{ ss.cancel(); }catch(e){} stateCb&&stateCb({state:"idle",reason:"viewer_stopped"}); },
    speak(lines,opts){
      const my=++token; try{ ss.cancel(); }catch(e){}
      if(opts&&opts.rate) rate=opts.rate;
      return new Promise((resolve,reject)=>{
        let i=0;
        const next=()=>{
          if(my!==token) return reject({code:"viewer_stopped"});
          if(i>=lines.length){ stateCb&&stateCb({state:"idle",reason:"completed"}); return resolve(); }
          const ln=lines[i++]; const u=new SpeechSynthesisUtterance(ln.text);
          u.lang="tr-TR"; const v=pickVoice(); if(v) u.voice=v; u.rate=rate;
          u.onstart=()=>{ lineCb&&lineCb({line:ln,id:ln.id}); };
          u.onend=()=>next();
          u.onerror=ev=>{ if(my!==token) return reject({code:"viewer_stopped"}); reject({code:(ev&&ev.error==="not-allowed")?"not_granted":"error"}); };
          stateCb&&stateCb({state:"speaking"});
          try{ ss.speak(u); }catch(e){ reject({code:"error"}); }
        };
        next();
      });
    }
  };
}
(async()=>{

  } else { note("Bu tarayıcıda sesli anlatım yok; video altyazılı ve zamanlı olarak oynar."); }
  updateControls();
})();
