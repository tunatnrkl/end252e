};

const TS = { sel:new Set(T.map(t=>t.id)), diff:"all", n:10, qs:[], i:0, ans:[], started:false, done:false };
const DIFF_EN = {easy:["easy","done"],medium:["medium","en"],hard:["hard","fut"]};

function wrapWords(s){
  return esc(s).replace(/[A-Za-z][A-Za-z'’\-]*[A-Za-z]|[A-Za-z]/g, w=>{ const k=w.toLowerCase().replace(/[’']/g,"'"); return (w.length>1 && DICT[k]!=null) ? `<span class="w" data-w="${esc(k)}">${w}</span>` : w; });
}
function renderTest(){
  const L=$("#lesson");
  if(!TS.started){
    L.innerHTML = `<div class="meta"><span class="pill en">Self-test · in English</span></div><h2>Kendini test et</h2>
    <p class="prose" style="color:var(--muted);margin:0 0 14px">Sorular ve cevaplar sınavdaki gibi <b>İngilizce</b>. Anlamadığın kelimeye <b>tıkla</b>, kelime Türkçesiyle değişir; tekrar tıklarsan İngilizcesine döner. Hangi konulardan soru geleceğini seç.</p>
    <h3 style="margin-top:0">Konular</h3>
    <div class="trow"><button class="icon-btn" type="button" data-ts="all">Tümünü seç</button><button class="icon-btn" type="button" data-ts="none">Hiçbirini seçme</button>
      <label class="tl">Şu konuya kadar: <select id="tsUpto"><option value="">—</option>${T.map((t,i)=>`<option value="${i}">${i+1}. ${esc(t.title)}</option>`).join("")}</select></label></div>
    <div class="tgrid">${T.map((t,i)=>`<label class="tchk ${TS.sel.has(t.id)?"on":""}"><input type="checkbox" data-tid="${t.id}" ${TS.sel.has(t.id)?"checked":""}> <span class="n">${String(i+1).padStart(2,"0")}</span><span><b>${esc(t.en)}</b><br><small>${esc(t.title)}</small></span></label>`).join("")}</div>
    <div class="trow" style="margin-top:14px">
      <label class="tl">Zorluk: <select id="tsDiff"><option value="all" ${TS.diff==="all"?"selected":""}>hepsi</option><option value="easy" ${TS.diff==="easy"?"selected":""}>easy</option><option value="medium" ${TS.diff==="medium"?"selected":""}>medium</option><option value="hard" ${TS.diff==="hard"?"selected":""}>hard</option></select></label>
      <label class="tl">Soru sayısı: <select id="tsN"><option value="5" ${TS.n===5?"selected":""}>5</option><option value="10" ${TS.n===10?"selected":""}>10</option><option value="20" ${TS.n===20?"selected":""}>20</option><option value="999" ${TS.n===999?"selected":""}>hepsi</option></select></label>
      <span class="scinfo" id="tsCount"></span>
    </div>
    <div style="margin-top:14px"><button class="btn" type="button" id="tsStart">Testi başlat →</button></div>
    <h3>Seçili konuların anahtar terimleri</h3>
    <div class="terms" id="tsTerms"></div>`;
    updateTestSetup();
    return;
  }
  if(TS.done){ renderTestResult(); return; }
  const q=TS.qs[TS.i], a=TS.ans[TS.i], t=T.find(x=>x.id===q.t), ti=T.indexOf(t);
  L.innerHTML = `<div class="meta"><span class="pill en">Question ${TS.i+1} / ${TS.qs.length}</span><span class="pill ${DIFF_EN[q.d][1]}">${DIFF_EN[q.d][0]}</span><span class="pill fut">${ti+1}. ${esc(t.en)}</span></div>
  <div class="tq"><p class="tq-q">${wrapWords(q.q)}</p>
  <div class="topts">${q.o.map((o,i)=>`<button type="button" class="topt ${a==null?"":(i===q.c?"right":(i===a?"wrong":""))}" data-o="${i}" ${a!=null?"disabled":""}><span class="n">${"ABCD"[i]}</span><span>${wrapWords(o)}</span></button>`).join("")}</div>
  ${a!=null?`<div class="texp ${a===q.c?"ok":"no"}"><b>${a===q.c?"Correct.":"Incorrect."}</b> ${wrapWords(q.e)}</div>`:""}
  <div class="trow" style="margin-top:14px">${a!=null?`<button class="btn" type="button" id="tsNext">${TS.i<TS.qs.length-1?"Next question →":"See results →"}</button>`:""}<button class="btn ghost" type="button" id="tsAsk">Bu soruyu asistana sor</button><button class="icon-btn" type="button" id="tsQuit">Testi bitir</button></div>
  <p class="scinfo" style="margin:10px 0 0">İpucu: kelimeye tıkla → Türkçesiyle değişir; tekrar tıkla → İngilizcesi.</p></div>`;
}
function updateTestSetup(){
  const pool = QB.filter(q=>TS.sel.has(q.t) && (TS.diff==="all"||q.d===TS.diff));
  const c=$("#tsCount"); if(c) c.textContent = `${pool.length} uygun soru`;
  const tm=$("#tsTerms"); if(tm) tm.innerHTML = T.filter(t=>TS.sel.has(t.id)).map(t=>`<div class="tgroup"><b>${esc(t.en)}</b>${(KEYTERMS[t.id]||[]).map(([e,tr])=>`<span class="term"><span>${esc(e)}</span><span class="tr">${esc(tr)}</span></span>`).join("")}</div>`).join("") || `<p class="scinfo">Konu seç.</p>`;
  document.querySelectorAll(".tchk").forEach(l=>l.classList.toggle("on", l.querySelector("input").checked));
}
function startTest(){
  let pool = QB.filter(q=>TS.sel.has(q.t) && (TS.diff==="all"||q.d===TS.diff));
  if(!pool.length) return;
  pool = pool.map(q=>({q,r:Math.random()})).sort((a,b)=>a.r-b.r).map(x=>x.q);
  pool.sort((a,b)=>T.findIndex(t=>t.id===a.t)-T.findIndex(t=>t.id===b.t));

 b:["Küçük bir örnek. Bir parayı iki kez atıyoruz. Y yazı, T tura olsun. Örnek uzayı dört sonuçtan oluşur: yazı yazı, yazı tura, tura yazı ve tura tura.","Sık yapılan bir hata: yazı tura ile tura yazı aynı sonuç değildir. İlk atış ve ikinci atış ayrıdır; sıra bilgisi kayboluyorsa örnek uzayı yanlış yazılmış demektir."]},
{t:"Kesikli ve sürekli örnek uzayları", v:{type:"table",h:"Örnek uzayı her zaman küçük bir liste değildir",head:["Deney","Örnek uzayı","Türü"],rows:[["Bir zar atmak","{1, 2, 3, 4, 5, 6}","Sonlu (finite)"],["İlk kusurlu parça kaçıncı?","{1, 2, 3, …}","Sayılabilir sonsuz (countably infinite)"],["Bir ampulün ömrü (saat)","[0, ∞) aralığı","Sürekli (continuous)"]],note:"Sonlu ve sayılabilir sonsuz uzaylara birlikte **kesikli (discrete)** denir."}, d:"Üç satırlı karşılaştırma tablosu satır satır belirir; en altta kesikli/sürekli notu.",
 b:["Örnek uzayı her zaman dört elemanlı bir liste değildir. Bir zar için altı elemanlı, sonlu bir kümedir.","İlk kusurlu parçanın kaçıncı olduğunu sorarsak cevap bir, iki, üç diye sonsuza kadar gider; buna sayılabilir sonsuz, countably infinite, deriz.","Bir ampulün ömrünü saat olarak ölçersek sıfırdan sonsuza bir aralıktaki her gerçek sayı mümkündür. Bu sürekli, continuous, bir örnek uzayıdır.","Sonlu ve sayılabilir sonsuz uzaylara birlikte kesikli, discrete, denir. Bu ayrım rastgele değişkenler haftasında çok önemli olacak."]},
{h:"Kavram 2 · Olay", t:"Olay nedir?", v:{type:"formula",h:"Olay (event)",lines:[["A ⊆ S","Olay, örnek uzayının bir **alt kümesidir**."],["A = {2, 4, 6}","Zar için “çift gelmesi” olayı."],["A gerçekleşti  ⟺  sonuç s ∈ A","Deneyin sonucu kümenin içine düşerse olay gerçekleşmiştir."],["{4}  →  basit olay (simple event)","Tek sonuçlu olaylara basit olay denir."]]}, d:"Dört formül kartı sırayla belirir: olay tanımı, örnek, gerçekleşme koşulu, basit olay. 4 saniye sabit kalır.", hold:4,
 b:["Olay, İngilizcesi event, örnek uzayının bir alt kümesidir. Yani olası sonuçlardan ilgilendiğimiz bir kısmını seçmektir.","Zar örneğinde çift gelmesi olayı A, iki, dört ve altı elemanlarından oluşan kümedir.","Deneyin sonucu bu kümenin içine düşerse olay gerçekleşti deriz. Dört geldiyse A gerçekleşti; üç geldiyse gerçekleşmedi.","Tek bir sonuçtan oluşan olaylara basit olay, simple event, denir. Örneğin sadece dört gelmesi."]},
{t:"İki zar: 36 sonuçluk örnek uzayı", v:{type:"grid",rows:6,cols:6,rlabel:"1. zar",clabel:"2. zar",steps:[{rule:"all",col:"mut",label:"S: 36 sıralı çift",sub:"(1. zar, 2. zar) — her hücre bir sonuç"},{rule:"sum:7",col:"acc",label:"A = “toplam 7”",sub:"6 sonuç: (1,6) (2,5) (3,4) (4,3) (5,2) (6,1)"},{rule:"r:3",col:"warm",label:"B = “1. zar 3”",sub:"6 sonuç: üçüncü satırın tamamı"},{rule:"sum:7&r:3",col:"good",label:"A ∩ B = {(3,4)}",sub:"Tek sonuç: hem toplam 7 hem 1. zar 3"}]}, d:"6×6 ızgara; her hücre (1. zar, 2. zar) çifti. Önce tüm hücreler gri; sonra toplamı 7 olan köşegen mavi; 3. satır sarı; son olarak (3,4) hücresi yeşil yanar. Sağda her adımın etiketi.",
 b:["Şimdi daha büyük bir örnek uzayı. İki zar atıyoruz. Her hücre bir sıralı çift: birinci zar, ikinci zar. Toplam otuz altı sonuç.","Toplamın yedi olması olayına A diyelim. Izgarada bir köşegen üzerindeki altı hücre: bir altı, iki beş, üç dört, dört üç, beş iki, altı bir.","Birinci zarın üç gelmesi olayına B diyelim. Bu da bir satırın tamamı, yine altı hücre.","İki olayın ortak kısmı, yani hem toplam yedi hem birinci zar üç: sadece üç dört hücresi. Olayları kümeler, ortak kısımları kesişimler olarak görmeye alış."]},
{h:"Kavram 3 · Küme işlemleri", t:"Birleşim, kesişim, tümleyen", v:{type:"venn",a:"A",b:"B",steps:[{mode:"none",label:"S içinde iki olay: A ve B"},{mode:"union",label:"A ∪ B : A veya B (en az biri)"},{mode:"inter",label:"A ∩ B : A ve B (ikisi birden)"},{mode:"comp",label:"Aᶜ : A olmaz (A'nın dışı)"},{mode:"aonly",label:"A ∩ Bᶜ : sadece A"}]}, d:"Venn diyagramı: S dikdörtgeni içinde kesişen A ve B daireleri. Her adımda farklı bölge boyanır: birleşim (mavi), kesişim, A'nın tümleyeni (sarı), sadece A.",
 b:["Olayları birleştirmek için küme işlemlerini kullanırız. Venn diyagramında S dikdörtgen, A ve B iki daire.","A birleşim B: A veya B. En az birinin gerçekleşmesi. Dikkat, matematikte veya kelimesi ikisinin birden olmasını da kapsar.","A kesişim B: A ve B. İkisinin aynı anda gerçekleşmesi. Dairelerin üst üste bindiği bölge.","A'nın tümleyeni, complement, A üssü c ile gösterilir: A'nın gerçekleşmemesi. Dairenin dışındaki her şey.","Bunları birleştirebiliriz: A kesişim B tümleyen, sadece A'nın gerçekleşmesi demektir. B'nin içine giren parça dışarıda kalır."]},
{t:"Ayrık olaylar", v:{type:"venn",layout:"disjoint",a:"A",b:"B",steps:[{mode:"union",label:"A ∩ B = ∅  →  ayrık (mutually exclusive)"},{mode:"none",label:"İki zar: “toplam 7” ile “iki zar aynı” ayrıktır"}]}, d:"Birbirine değmeyen iki daire; önce ikisi boyanır ve ∅ etiketi, sonra zar örneği etiketi gelir.",
 b:["Bazen iki olayın ortak hiçbir sonucu yoktur; kesişimleri boş kümedir. Böyle olaylara ayrık, İngilizcesi mutually exclusive, denir. İkisi aynı anda gerçekleşemez.","Örnek: iki zarda toplamın yedi olması ile iki zarın aynı gelmesi. Toplam yedi için zarlar farklı olmak zorunda; o yüzden bu iki olay ayrıktır."]},
{h:"Kavram 4 · De Morgan kuralları", t:"“Değil” ile “veya / ve” yer değiştirince", v:{type:"formula",h:"De Morgan kuralları",lines:[["(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ","“En az biri” olmadı  =  “ikisi de” olmadı"],["(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ","“İkisi birden” olmadı  =  “en az biri” olmadı"]]}, d:"İki formül kartı; her kartın altında kuralın Türkçe okunuşu. 5 saniye sabit kalır.", hold:5,
 b:["Tümleyen alırken birleşim ve kesişim yer değiştirir. Birinci kural: A birleşim B'nin tümleyeni, A tümleyen kesişim B tümleyene eşittir. Sözle: ikisinden en az biri gerçekleşmediyse, ikisi de gerçekleşmemiştir.","İkinci kural: A kesişim B'nin tümleyeni, A tümleyen birleşim B tümleyene eşittir. İkisi birden gerçekleşmediyse, en az biri gerçekleşmemiştir."]},
{t:"De Morgan'ı görmek", v:{type:"venn",a:"A",b:"B",steps:[{mode:"union",label:"Önce A ∪ B"},{mode:"compUnion",label:"(A ∪ B)ᶜ : birleşimin dışı"},{mode:"compUnion",label:"Aynı bölge = Aᶜ ∩ Bᶜ : hem A'nın hem B'nin dışı"}]}, d:"Venn: önce birleşim mavi; sonra dışı sarı boyanır; etiket değişerek aynı bölgenin Aᶜ ∩ Bᶜ olduğunu gösterir.",
 b:["Birinci kuralı diyagramda izleyelim. Önce A birleşim B'yi boyadık.","Şimdi tümleyenini, yani bu bölgenin dışını boyuyoruz: dikdörtgenin iki dairenin dışında kalan kısmı.","Bu bölge aynı zamanda hem A'nın dışında hem B'nin dışında olan noktalardır; yani A tümleyen kesişim B tümleyen. İki ifade aynı bölgeyi tarif ediyor."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["“A veya B” deyince ikisinin birden olmasını dışarıda bırakmak","(A ∪ B)ᶜ ile Aᶜ ∪ Bᶜ'yi aynı sanmak","İki para için S = {2 yazı, 1 yazı, 0 yazı} yazıp hepsini eşit olasılıklı saymak"]},r:{h:"Doğru",items:["∪ kapsayıcıdır: A ∩ B de birleşimin içindedir","Tümleyen alınca ∪ ↔ ∩ yer değiştirir (De Morgan)","S = {YY, YT, TY, TT}: dört sonuç; “1 yazı” iki sonuçtan oluşur"]},verdict:"Kural: örnek uzayını en ince (ayırt edilebilir) sonuçlarla yaz."}, d:"İki sütun: solda kırmızı çerçeveli yanlışlar, sağda yeşil başlıklı doğrular; altta sarı kural cümlesi.",
 b:["Üç sık hata. Birincisi: günlük dilde veya bazen ya biri ya diğeri anlamına gelir. Matematikte değil; birleşim, ikisinin birden olmasını da içerir.","İkincisi: tümleyeni dağıtırken işareti değiştirmemek. A birleşim B'nin tümleyeni, A tümleyen birleşim B tümleyen değildir; kesişimdir.","Üçüncüsü: örnek uzayını kaba yazmak. İki parada sıfır, bir, iki yazı diye üç sonuç yazarsan, bir yazı aslında iki farklı sonucu içerdiği için olasılıklar yanlış çıkar. Kural: örnek uzayını en ince, ayırt edilebilir sonuçlarla yaz."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Örnek uzayı ve olaylar",items:["Örnek uzayı S: deneyin **bütün** olası sonuçları. En ince ayrımla yaz.","Olay A ⊆ S: ilgilendiğimiz sonuçların kümesi. Sonuç A'ya düşerse “A gerçekleşti”.","∪ veya (kapsayıcı), ∩ ve, Aᶜ değil.","A ∩ B = ∅ ise olaylar ayrıktır.","De Morgan: (A ∪ B)ᶜ = Aᶜ ∩ Bᶜ,  (A ∩ B)ᶜ = Aᶜ ∪ Bᶜ."]}, d:"Sarı çerçeveli özet kartı; beş madde sırayla belirir ve 5 saniye sabit kalır.", hold:5,
 b:["Buraya kadar olanı toparlayalım. Örnek uzayı, deneyin bütün olası sonuçlarıdır ve en ince ayrımla yazılır.","Olay, örnek uzayının bir alt kümesidir; sonuç o kümeye düşerse olay gerçekleşmiştir.","Birleşim veya demektir ve kapsayıcıdır; kesişim ve; tümleyen değil.","Kesişimi boş olan olaylar ayrıktır.","Ve De Morgan: tümleyen alırken birleşim ile kesişim yer değiştirir."]},
{h:"Örnekler", t:"Basit örnek: üç parça", v:{type:"steps",h:"Kutudan 3 parça çekiliyor; her biri sağlam (S) veya kusurlu (K)",lines:["Her parça için 2 seçenek → 2·2·2 = **8 sonuç**","S = {SSS, SSK, SKS, KSS, SKK, KSK, KKS, KKK}","A = “tam 1 kusurlu” = {SSK, SKS, KSS}","B = “en az 2 kusurlu” = {SKK, KSK, KKS, KKK}","A ∩ B = ∅ → A ve B **ayrık**","A ∪ B = “en az 1 kusurlu” = S − {SSS} → 7 sonuç","Aᶜ = {SSS, SKK, KSK, KKS, KKK} → 5 sonuç"]}, d:"Numaralı çözüm satırları tek tek belirir; sonuçlar kalın.",
 b:["Basit bir örnek. Kutudan üç parça çekiyoruz, her biri sağlam ya da kusurlu. Her parça için iki seçenek olduğundan örnek uzayında iki çarpı iki çarpı iki, yani sekiz sonuç var.","Hepsini yazalım: SSS, SSK, SKS, KSS, SKK, KSK, KKS ve KKK.","A olayı tam bir kusurlu: K harfinin tam bir kez geçtiği üç sonuç.","B olayı en az iki kusurlu: K'nin iki veya üç kez geçtiği dört sonuç.","A ile B'nin ortak elemanı yok; demek ki ayrık olaylar.","Birleşimleri en az bir kusurlu olması demek: SSS dışındaki yedi sonuç.","A'nın tümleyeni ise A'da olmayan beş sonuç. Kontrol: üç artı beş, sekiz eder."]},
{t:"Zor örnek: soru", v:{type:"think",q:"İki zar atılıyor. A = “toplam 8”, B = “en az bir zar 6”, C = “iki zar aynı”.",parts:["(a) A ∩ B kaç elemanlı?","(b) A ∩ C kaç elemanlı?","(c) (A ∪ C)ᶜ ∩ B kaç elemanlı?"],secs:10}, d:"Soru metni ve üç şık ekranda; sağ altta 10 saniyelik geri sayım halkası.",
 b:["Şimdi zor örnek. İki zar atılıyor. A toplamın sekiz olması, B en az bir zarın altı gelmesi, C iki zarın aynı gelmesi. Üç soru var. On saniye düşün, sonra birlikte çözelim."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: zarları ayırt etmemek",lines:["“Toplam 8 için 2+6, 3+5, 4+4 var → A'da 3 sonuç” ✗","(2,6) ile (6,2) **farklı** sonuçlardır; zarlar ayırt edilebilir.","Bu hata hem eleman sayılarını hem (ileride) olasılıkları bozar."]}, d:"Kırmızı başlıklı adımlar: yanlış sayım ve nedeni.",
 b:["Önce sık görülen yanlış yola bakalım. Toplam sekiz için iki artı altı, üç artı beş, dört artı dört deyip A'da üç sonuç var demek.","Sorun şu: iki altı ile altı iki farklı sonuçlardır, çünkü birinci ve ikinci zar ayırt edilebilir. Otuz altı sonuçluk uzayda bunlar ayrı hücreler.","Bu hata eleman sayılarını ve dolayısıyla ileride olasılıkları bozar."]},
{t:"Zor örnek: çözüm (a) ve (b)", v:{type:"grid",rows:6,cols:6,rlabel:"1. zar",clabel:"2. zar",steps:[{rule:"sum:8",col:"acc",label:"A = “toplam 8”",sub:"5 sonuç: (2,6) (3,5) (4,4) (5,3) (6,2)"},{rule:"any:6",col:"warm",label:"B = “en az bir 6”",sub:"11 sonuç: son satır + son sütun, (6,6) bir kez"},{rule:"sum:8&any:6",col:"good",label:"(a) A ∩ B = {(2,6), (6,2)} → 2 eleman"},{rule:"same",col:"warm",label:"C = “iki zar aynı”",sub:"6 sonuç: ana köşegen"},{rule:"sum:8&same",col:"good",label:"(b) A ∩ C = {(4,4)} → 1 eleman"}]}, d:"6×6 ızgarada sırayla A (mavi köşegen), B (sarı L şekli), A∩B (yeşil 2 hücre), C (ana köşegen) ve A∩C (tek hücre) vurgulanır.",
 b:["Doğru yol: ızgarayı kullan. Toplam sekiz olan hücreler beş tane: iki altı, üç beş, dört dört, beş üç, altı iki.","En az bir altı: son satır ve son sütun. Altı artı altı on iki, ama altı altı hücresini iki kez saymamak için on bir sonuç.","A kesişim B: hem toplam sekiz hem içinde altı olanlar. İki altı ve altı iki. Cevap a: iki eleman.","C, iki zarın aynı gelmesi: ana köşegendeki altı hücre.","A kesişim C: toplamı sekiz olan tek çift dört dört. Cevap b: bir eleman."]},
{t:"Zor örnek: çözüm (c)", v:{type:"steps",h:"(c) (A ∪ C)ᶜ ∩ B = “B'de olup A ∪ C'de olmayanlar”",lines:["|A ∪ C| = |A| + |C| − |A ∩ C| = 5 + 6 − 1 = 10","B'nin 11 elemanından A ∪ C'ye düşenleri çıkar","B ∩ A = {(2,6), (6,2)},  B ∩ C = {(6,6)} → 3 eleman (çakışma yok)","Cevap: 11 − 3 = **8 eleman**","Kontrol: De Morgan ile B ∩ Aᶜ ∩ Cᶜ, aynı küme."]}, d:"Çözüm adımları tek tek belirir; sonuç kalın; son satır De Morgan kontrolü.",
 b:["Son şık: A birleşim C'nin tümleyeni kesişim B. Yani B'de olup A birleşim C'de olmayan sonuçlar.","Önce A birleşim C'nin eleman sayısı: beş artı altı eksi ortak olan bir, on.","B'nin on bir elemanından A birleşim C'ye düşenleri çıkaracağız.","B ile A'nın ortak elemanları iki altı ve altı iki; B ile C'nin ortak elemanı altı altı. Toplam üç eleman ve birbirinden farklılar.","On bir eksi üç: sekiz eleman.","Kontrol için De Morgan: aradığımız küme B kesişim A tümleyen kesişim C tümleyen; aynı sekiz hücre."]},
{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["Önce **S**'yi yaz: bütün sonuçlar, en ince ayrımla, sıra önemliyse sıralı.","Olay = alt küme. Soruyu “hangi sonuçlar bu kümeye düşer?” diye çevir.","∪, ∩, tümleyen ile karmaşık olayları basit olaylardan kur.","Ayrık: ortak sonuç yok. De Morgan: tümleyen alınca ∪ ↔ ∩.","Izgara ve Venn diyagramı: sayım hatalarını önleyen iki araç."]}, d:"Sonuç kartı; beş madde sırayla belirir, 4 saniye sabit kalır.", hold:4,
 b:["Tekrar edelim. Her problemde önce örnek uzayını yaz; sıra önemliyse sıralı sonuçlarla.","Olayları alt küme olarak düşün: hangi sonuçlar bu kümeye düşüyor?","Karmaşık olayları birleşim, kesişim ve tümleyenle basit olaylardan kur.","Ayrık olaylar ortak sonuç içermez; De Morgan tümleyeni dağıtmanın kuralıdır.","Ve iki araç: ızgara ile Venn diyagramı. Çizmek, sayım hatalarını önler."]},
{h:"Kapanış", t:"Sonraki adım", v:{type:"text",h:"Sıradaki video: Olasılık aksiyomları",items:["Olaylara sayı vermeyi öğreneceğiz: P(A) nedir, hangi kurallara uyar?","Tekrar: iki zar ızgarasını kendin çiz; “toplam ≥ 10” ve “en az bir 1” olaylarını boya, kesişim ve birleşimlerini say.","Ders notu şablonunu doldur, Senaryo sekmesinden cevaplarla karşılaştır."]}, d:"Kapanış maddeleri sırayla belirir.",
 b:["Bir sonraki videoda olaylara sayı vermeyi, yani olasılık aksiyomlarını öğreneceğiz.","Tekrar için iki zar ızgarasını kendin çiz; toplamın on ve üzeri olması ile en az bir zarın bir gelmesi olaylarını boya, kesişim ve birleşimlerini say.","Ders notu şablonunu doldur ve senaryo sekmesindeki cevaplarla karşılaştır. Görüşmek üzere."]}
],

k:{konu:"Olasılık aksiyomları ve temel kurallar", on:"Örnek uzayı, olay, ∪ ∩ ve tümleyen (1. video)."},
h:["Kolmogorov'un üç aksiyomunu yazabilmek ve her birinin ne anlama geldiğini söyleyebilmek",
   "Tümleyen kuralını ve toplama kuralını aksiyomlardan türetebilmek",
   "Eşit olasılıklı örnek uzayında olasılığı sayma ile hesaplayabilmek",

 b:["Bu videoda olaylara sayı vermeyi öğreniyoruz. Olasılık dediğimiz sayı keyfi değil; üç basit kurala, yani aksiyoma uymak zorunda.","Bu üç kuraldan sınavda kullandığın bütün formüller türetiliyor. Hepsini adım adım çıkaracağız."]},
{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"Sayılar tutarlı olmalı",items:["Bir sigorta şirketi “kaza olasılığı 0.03” diyorsa bu sayı diğer olasılıklarla **çelişmemeli**.","“Kusurlu %5, sağlam %97” dersen toplam %102 olur; bir yerde hata var.","Aksiyomlar, olasılık atamalarının tutarlı olmasını garanti eden asgari kurallardır.","Bu kurallardan tümleyen, toplama ve sayma formülleri **ispatla** çıkar; ezber gerekmez."]}, d:"Dört madde sırayla belirir.",
 b:["Bir sigorta şirketi kaza olasılığı yüzde üç diyorsa, bu sayı şirketin diğer olasılık atamalarıyla çelişmemeli.","Küçük bir örnek: kusurlu yüzde beş, sağlam yüzde doksan yedi dersen toplam yüzde yüz iki eder. Bir yerde hata var demektir.","Aksiyomlar, olasılık atamalarının tutarlı olmasını garanti eden en küçük kural setidir.","Ve güzel tarafı: tümleyen, toplama, sayma formülleri bu kurallardan ispatla çıkar. Ezberlemek yerine türetebilirsin."]},
{h:"Kavram 1 · Üç aksiyom", t:"Tanım: olasılık fonksiyonu", v:{type:"formula",h:"Olasılık (probability) P: her olaya bir sayı",lines:[["Aksiyom 1:   P(A) ≥ 0","Olasılık negatif olamaz."],["Aksiyom 2:   P(S) = 1","Deney yapıldığında S'deki sonuçlardan biri kesin olur."],["Aksiyom 3:   A ∩ B = ∅  ⟹  P(A ∪ B) = P(A) + P(B)","Ayrık olayların olasılıkları toplanır (sayılabilir çoklukta ayrık olay için de geçerli)."]]}, d:"Üç aksiyom kartı sırayla belirir; 5 saniye sabit kalır.", hold:5,
 b:["Olasılık, her olaya bir sayı veren bir fonksiyondur ve büyük P ile gösterilir. Birinci aksiyom: her olayın olasılığı sıfır veya daha büyüktür.","İkinci aksiyom: örnek uzayının olasılığı birdir. Deney yapıldığında S'deki sonuçlardan biri kesinlikle gerçekleşir.","Üçüncü aksiyom: A ve B ayrıksa, birleşimlerinin olasılığı olasılıklarının toplamıdır. Bu kural sayılabilir çoklukta ayrık olay için de geçerlidir. Toplama sadece ayrık olaylarda serbesttir, bunu unutma."]},
{t:"Görsel: olasılık bir bütünü paylaştırır", v:{type:"bar",h:"Bir zarın PMF'si: toplam 1",x:["1","2","3","4","5","6"],y:[0.167,0.167,0.167,0.167,0.167,0.167],dec:3,ylabel:"P",xlabel:"sonuç"}, d:"Altı eşit çubuk sırayla büyür; hepsi 1/6 ≈ 0.167 yüksekliğinde.",
 b:["Aksiyomları bir resimle düşün: toplamda bir birimlik olasılığımız var ve bunu sonuçlara paylaştırıyoruz. Adil bir zarda her sonuç altıda bir alır.","Altı çubuğun toplamı tam olarak bir. İkinci aksiyom budur. Hiçbir çubuk negatif olamaz; birinci aksiyom budur.","Bir olayın olasılığı, içerdiği sonuçların çubuklarını toplamaktır. Çift gelme olayı için üç çubuk, yani bir bölü iki. Üçüncü aksiyom budur."]},
{h:"Kavram 2 · Tümleyen kuralı", t:"İspat", v:{type:"steps",h:"Tümleyen kuralı: P(Aᶜ) = 1 − P(A)",lines:["A ve Aᶜ ayrıktır: A ∩ Aᶜ = ∅","Birleşimleri her şeydir: A ∪ Aᶜ = S","Aksiyom 3 → P(A ∪ Aᶜ) = P(A) + P(Aᶜ)","Aksiyom 2 → P(S) = 1, yani P(A) + P(Aᶜ) = 1","Sonuç: **P(Aᶜ) = 1 − P(A)**.  Özel hal: P(∅) = 1 − P(S) = 0"]}, d:"Beş ispat adımı sırayla belirir; sonuç kalın.",
 b:["İlk türetme: tümleyen kuralı. A ile A'nın tümleyeni ayrıktır; bir sonuç ya A'dadır ya değildir.","Birleşimleri de bütün örnek uzayıdır.","Üçüncü aksiyoma göre bu birleşimin olasılığı ikisinin toplamıdır.","İkinci aksiyoma göre S'nin olasılığı bir. Demek ki P A artı P A tümleyen bire eşit.","Sonuç: A'nın olmama olasılığı bir eksi A'nın olasılığı. Özel bir hal: boş kümenin olasılığı sıfırdır."]},
{h:"Kavram 3 · Toplama kuralı", t:"Genel toplama kuralı: fikir", v:{type:"venn",a:"A",b:"B",steps:[{mode:"union",label:"Hedef: P(A ∪ B)"},{mode:"inter",label:"P(A) + P(B) kesişimi iki kez sayar"},{mode:"union",label:"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)"}]}, d:"Venn: önce birleşim boyanır; sonra kesişim vurgulanıp “iki kez sayıldı” etiketi; son adımda formül.",
 b:["Şimdi A ve B ayrık değilse ne olur? Hedefimiz birleşimin olasılığı.","A'nın olasılığı ile B'nin olasılığını toplarsan ortadaki kesişim iki kez sayılır: bir kez A'nın içinde, bir kez B'nin içinde.","Bu yüzden kesişimi bir kez geri çıkarırız. P A birleşim B eşittir P A artı P B eksi P A kesişim B. Buna toplama kuralı, addition rule, denir."]},
{t:"Toplama kuralı: ispat", v:{type:"steps",h:"P(A ∪ B) = P(A) + P(B) − P(A ∩ B)",lines:["A ∪ B'yi ayrık parçalara böl: A ∪ B = A ∪ (B ∩ Aᶜ)","Aksiyom 3 → P(A ∪ B) = P(A) + P(B ∩ Aᶜ)","B'yi de ayrık parçalara böl: B = (A ∩ B) ∪ (B ∩ Aᶜ)","Aksiyom 3 → P(B) = P(A ∩ B) + P(B ∩ Aᶜ)  ⟹  P(B ∩ Aᶜ) = P(B) − P(A ∩ B)","Yerine koy: **P(A ∪ B) = P(A) + P(B) − P(A ∩ B)**"]}, d:"İspat adımları sırayla; her adım hangi aksiyomu kullandığını söyler.",
 b:["İspatı aksiyomlardan yapalım. A birleşim B'yi iki ayrık parçaya bölüyoruz: A, ve B'nin A dışındaki kısmı.","Ayrık oldukları için olasılıkları toplanır.","B'yi de ayrık iki parçaya bölelim: A ile kesişimi ve A'nın dışındaki kısmı.","Yine toplama: P B eşittir P A kesişim B artı P B kesişim A tümleyen. Buradan B'nin A dışındaki kısmını çekebiliriz.","Yerine koyunca toplama kuralı çıkar. Üç olay için de benzer bir formül var: ikili kesişimleri çıkar, üçlü kesişimi geri ekle."]},
{t:"Formül kartı", v:{type:"formula",h:"Aksiyomlardan çıkan kurallar",lines:[["P(Aᶜ) = 1 − P(A)","tümleyen kuralı"],["P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","toplama kuralı"],["A ⊆ B  ⟹  P(A) ≤ P(B)","alt kümenin olasılığı daha büyük olamaz"],["0 ≤ P(A) ≤ 1","her olasılık 0 ile 1 arasındadır"]]}, d:"Dört formül kartı; 5 saniye sabit.", hold:5,
 b:["Formül kartı. Tümleyen kuralı: bir eksi.","Toplama kuralı: topla, kesişimi çıkar.","A, B'nin alt kümesiyse A'nın olasılığı B'ninkini geçemez; bu da aksiyomlardan çıkar.","Ve sonuç olarak her olasılık sıfır ile bir arasındadır. Hesabın bir'i geçiyorsa bir yerde hata vardır."]},
{h:"Kavram 4 · Eşit olasılıklı sonuçlar", t:"Olasılık = sayma", v:{type:"grid",rows:6,cols:6,cell:"sum",rlabel:"1. zar",clabel:"2. zar",steps:[{rule:"all",col:"mut",label:"36 sonuç, her biri 1/36",sub:"Eşit olasılıklı (equally likely) sonuçlar"},{rule:"sum:7",col:"acc",label:"P(toplam 7) = 6/36 = 1/6",sub:"İstenen sonuç sayısı / toplam sonuç sayısı"},{rule:"sum>=10",col:"warm",label:"P(toplam ≥ 10) = 6/36 = 1/6",sub:"(4,6) (5,5) (6,4) (5,6) (6,5) (6,6)"}]}, d:"Izgara hücrelerinde toplamlar yazılı. Önce tüm hücreler; sonra toplamı 7 olanlar; sonra toplamı 10 ve üzeri olanlar vurgulanır.",
 b:["Bütün sonuçlar eşit olasılıklıysa, equally likely, iş çok kolaylaşır. Otuz altı sonucun her biri otuz altıda bir.","Bir olayın olasılığı, o olaydaki sonuç sayısının toplam sonuç sayısına oranıdır. Toplam yedi için altı sonuç: altı bölü otuz altı, yani altıda bir.","Toplamın on veya daha fazla olması: altı hücre, yine altıda bir. Bu formül sadece eşit olasılıklı sonuçlarda geçerlidir; hileli bir zarda kullanamazsın."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["Ayrık olmayan olaylarda P(A ∪ B) = P(A) + P(B) yazmak","“Ya A ya B” için P(A) + P(B) deyip kesişimi iki kez saymak","|A| / |S| formülünü eşit olasılıklı olmayan uzayda kullanmak","Sonuç 1'den büyük çıkınca devam etmek"]},r:{h:"Doğru",items:["Önce sor: A ∩ B = ∅ mı? Değilse kesişimi çıkar","“Tam olarak biri” = P(A) + P(B) − 2·P(A ∩ B)","Sayma formülü için önce “sonuçlar eşit olasılıklı mı?” kontrolü","Olasılık ≤ 1: aksi halde hesabı baştan kontrol et"]},verdict:"Her toplama işleminden önce kesişimi düşün."}, d:"Yanlış/doğru karşılaştırma sütunları ve alt kural.",
 b:["En sık hata: ayrık olmayan olaylarda olasılıkları doğrudan toplamak. Önce kesişim boş mu diye sor; değilse kesişimi çıkar.","İkinci hata: tam olarak biri olsun sorusunda. İkisinin birden olduğu kısım iki olayda da sayılır; bu yüzden kesişimi iki kez çıkarmak gerekir.","Üçüncüsü: istenen bölü toplam formülünü, sonuçlar eşit olasılıklı değilken kullanmak.","Ve pratik bir kontrol: olasılık birden büyük çıktıysa durup hesabı baştan al."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Aksiyomlar",items:["Aksiyom 1: P(A) ≥ 0. Aksiyom 2: P(S) = 1. Aksiyom 3: ayrıksa topla.","Tümleyen: P(Aᶜ) = 1 − P(A). Boş küme: P(∅) = 0.","Toplama: P(A ∪ B) = P(A) + P(B) − P(A ∩ B).","Eşit olasılıklı sonuçlarda: P(A) = |A| / |S|.","“Hiçbiri” = 1 − P(A ∪ B);  “sadece A” = P(A) − P(A ∩ B)."]}, d:"Özet kartı; beş madde; 5 saniye sabit.", hold:5,
 b:["Özet. Üç aksiyom: negatif olmaz, S'nin olasılığı bir, ayrık olaylar toplanır.","Tümleyen kuralı bir eksi; boş kümenin olasılığı sıfır.","Toplama kuralı: topla, kesişimi çıkar.","Eşit olasılıklı sonuçlarda olasılık bir sayma işidir.","İki pratik ifade: hiçbiri, birleşimin tümleyeni; sadece A, A'dan kesişimi çıkar."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"P(A) = 0.5,  P(B) = 0.4,  P(A ∩ B) = 0.2",lines:["P(A ∪ B) = 0.5 + 0.4 − 0.2 = **0.7**","P(hiçbiri) = P((A ∪ B)ᶜ) = 1 − 0.7 = **0.3**","P(sadece A) = P(A) − P(A ∩ B) = 0.5 − 0.2 = **0.3**","P(tam olarak biri) = 0.7 − 0.2 = **0.5**  (ya da 0.3 + 0.2)","Kontrol: sadece A 0.3 + sadece B 0.2 + ikisi 0.2 + hiçbiri 0.3 = 1 ✓"]}, d:"Beş çözüm satırı; sonuçlar kalın; son satır sağlama.",
 b:["Basit örnek. A'nın olasılığı sıfır nokta beş, B'nin sıfır nokta dört, kesişim sıfır nokta iki.","Birleşim: sıfır nokta beş artı sıfır nokta dört eksi sıfır nokta iki, sıfır nokta yedi.","Hiçbirinin olmaması, birleşimin tümleyeni: bir eksi sıfır nokta yedi, sıfır nokta üç.","Sadece A: A'dan kesişimi çıkar, sıfır nokta üç.","Tam olarak biri: birleşimden kesişimi çıkar, sıfır nokta beş.","Sağlama: dört parçanın toplamı bir ediyor. Venn diyagramının dört bölgesini böyle doldurursan hiçbir soru seni zorlamaz."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir fabrikada parçaların %12'sinde boyut hatası (B), %8'inde yüzey hatası (Y), %3'ünde her ikisi var. Rastgele bir parça için:",parts:["(a) En az bir hata olma olasılığı?","(b) Tam olarak bir tür hata olma olasılığı?","(c) Hiç hata olmama olasılığı?"],secs:10}, d:"Soru ve üç şık; 10 saniyelik geri sayım.",
 b:["Zor örnek. Parçaların yüzde on ikisinde boyut hatası, yüzde sekizinde yüzey hatası, yüzde üçünde her ikisi var. Üç soru: en az bir hata, tam olarak bir tür hata, hiç hata yok. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: olasılıkları doğrudan toplamak",lines:["“En az bir hata = 0.12 + 0.08 = 0.20” ✗","B ve Y ayrık değil: %3'lük kesişim iki kez sayıldı.","Aynı hata (b)'de de görülür: “tam bir hata = 0.20” ✗ (ikisi olanlar dahil edildi)."]}, d:"Kırmızı başlıklı yanlış yol ve nedeni.",
 b:["Yaygın yanlış: yüzde on iki artı yüzde sekiz, yüzde yirmi demek.","Ama boyut hatası ile yüzey hatası ayrık değil; yüzde üçlük kesişim iki kez sayılmış oldu.","Aynı hata b şıkkında da görülür: ikisi birden olan parçaları tam bir hataya dahil etmek."]},
{t:"Zor örnek: çözüm", v:{type:"steps",h:"Doğru çözüm",lines:["Verilenler: P(B) = 0.12,  P(Y) = 0.08,  P(B ∩ Y) = 0.03","(a) P(B ∪ Y) = 0.12 + 0.08 − 0.03 = **0.17**","(b) Sadece B: 0.12 − 0.03 = 0.09;  sadece Y: 0.08 − 0.03 = 0.05  →  **0.14**","    Kontrol: 0.17 − 0.03 = 0.14 ✓","(c) P(hiçbiri) = 1 − 0.17 = **0.83**","Dört bölge: 0.09 + 0.05 + 0.03 + 0.83 = 1 ✓"]}, d:"Çözüm adımları sırayla; her şıkkın sonucu kalın; en altta sağlama.",
 b:["Doğru çözüm. Verilenleri yaz: P B sıfır nokta on iki, P Y sıfır nokta sıfır sekiz, kesişim sıfır nokta sıfır üç.","a: toplama kuralı. On iki artı sekiz eksi üç, yüzde on yedi.","b: sadece boyut hatası dokuz, sadece yüzey hatası beş; toplam yüzde on dört.","Kontrol: en az bir hatadan ikisi birden olanları çıkar, on yedi eksi üç, on dört.","c: hiç hata yok, bir eksi sıfır nokta on yedi, yüzde seksen üç.","Dört bölgenin toplamı bir. Her zaman bu sağlamayı yap."]},

{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"52 kartı listeleyemezsin",items:["5 kartlık bir elde kaç farklı el var? Listelemek imkânsız: **2.598.960**.","Kalite kontrolde 50 parçalık partiden 5 parça seçersin: kaç farklı seçim?","P(A) = |A| / |S| için hem payı hem paydayı **saymak** gerekir.","Sayma yöntemleri, listelemeden “kaç yol var?” sorusunu cevaplar."]}, d:"Dört madde sırayla.",
 b:["Elli iki kartlık desteden beş kart çekiyorsun. Kaç farklı el var? İki milyon beş yüz doksan sekiz bin dokuz yüz altmış. Bunu listeleyemezsin.","Kalite kontrolde elli parçalık partiden beş parça seçersin: kaç farklı seçim?","Olasılık için hem istenen sonuçları hem toplam sonuçları saymak gerekir.","Sayma yöntemleri, listelemeden kaç yol var sorusunu cevaplar."]},
{h:"Kavram 1 · Çarpma kuralı", t:"Tanım ve görsel", v:{type:"slots",h:"3 gömlek × 2 pantolon: kaç kombin?",vals:["3","2"],labels:["gömlek","pantolon"],total:"6",totalLabel:"Çarpma kuralı (multiplication rule): a · b yol"}, d:"İki kutu: ilkine 3, ikincisine 2 yazılır; aralarına çarpı; altta = 6.",
 b:["Çarpma kuralı, multiplication rule. Bir iş iki adımda yapılıyorsa ve birinci adımda a, ikinci adımda b seçenek varsa, toplam a çarpı b yol vardır.","Üç gömlek, iki pantolon: her gömlek için iki pantolon seçeneği.","Toplam altı kombin. Üç veya daha çok adım için de aynı: seçenek sayılarını çarp."]},
{h:"Kavram 2 · Permütasyon", t:"Sıralı seçim", v:{type:"slots",h:"5 adaydan 1., 2. ve 3.'yü seç (sıra önemli)",vals:["5","4","3"],labels:["1. sıra","2. sıra","3. sıra"],total:"60",totalLabel:"P(5,3) = 5!/(5−3)! = 120/2 = 60"}, d:"Üç kutuya sırayla 5, 4, 3 yazılır; çarpım 60; altta P(5,3) formülü.",
 b:["Permütasyon, permutation: sıranın önemli olduğu seçim. Beş adaydan birinci, ikinci ve üçüncüyü seçiyoruz.","Birinci sıra için beş seçenek. Biri seçilince ikinci sıra için dört kalır.","Üçüncü sıra için üç. Çarp: altmış.","Genel formül: n'den k tanesini sıralı seçmek, n faktöriyel bölü n eksi k faktöriyel. Beş faktöriyel yüz yirmi, bölü iki faktöriyel, altmış."]},
{t:"Faktöriyel", v:{type:"formula",h:"Faktöriyel (factorial)",lines:[["n! = n · (n−1) · (n−2) · … · 2 · 1","n nesneyi sıraya dizmenin yol sayısı"],["5! = 120,   4! = 24,   3! = 6,   0! = 1","0! = 1 tanım gereği (hiçbir şeyi dizmenin tek yolu var)"],["P(n,k) = n! / (n−k)! = n·(n−1)·…·(n−k+1)","k tane çarpan"]]}, d:"Üç formül kartı; 4 saniye sabit.", hold:4,
 b:["Faktöriyel: n faktöriyel, n'den bire kadar sayıların çarpımı. n nesneyi sıraya dizmenin yol sayısı.","Küçük değerleri ezbere bil: beş faktöriyel yüz yirmi, dört faktöriyel yirmi dört. Ve sıfır faktöriyel bir; tanım gereği.","Permütasyon formülü aslında n'den aşağı doğru k tane çarpandır."]},
{h:"Kavram 3 · Kombinasyon", t:"Sırasız seçim: fikir", v:{type:"list",h:"{A, B, C, D, E} içinden 3 kişilik komite",items:["ABC","ACB","BAC","BCA","CAB","CBA"],steps:[{hl:[0,1,2,3,4,5],col:"warm",label:"Permütasyonda bu 6 dizilim ayrı sayılır (3! = 6)"},{hl:[0],col:"good",label:"Komitede hepsi aynı grup: {A, B, C}  →  1 sayılır"}]}, d:"Altı dizilim kutucuğu; önce hepsi sarı (permütasyon), sonra tek kutucuk yeşil (kombinasyon).",
 b:["Kombinasyon, combination: sıranın önemsiz olduğu seçim. Beş kişiden üç kişilik komite kuruyoruz.","Permütasyonda ABC, ACB, BAC ve diğerleri, altı ayrı dizilim sayılırdı. Üç kişi üç faktöriyel, altı şekilde dizilir.","Ama komitede hepsi aynı gruptur. Demek ki her grubu altı kez saymışız; bölmemiz gerekir."]},
{t:"Kombinasyon: türetme", v:{type:"steps",h:"C(n,k) = P(n,k) / k!",lines:["Sıralı seçim sayısı: P(n,k) = n!/(n−k)!","Her k'lı grup k! farklı sırayla sayıldı","Bölersek: C(n,k) = n! / (k!·(n−k)!)","Örnek: C(5,3) = 120 / (6·2) = **10**","Simetri: C(n,k) = C(n,n−k)  →  C(5,3) = C(5,2) = 10"]}, d:"Türetme adımları sırayla.",
 b:["Türetelim. Sıralı seçim sayısı P n k.","Her grup k faktöriyel farklı sırayla sayıldı.","Bölersek kombinasyon formülü çıkar: n faktöriyel bölü k faktöriyel çarpı n eksi k faktöriyel. Okunuşu: n'in k'lısı, n choose k.","Örnek: beşin üçlüsü, yüz yirmi bölü on iki, on.","Simetri özelliği: üç kişiyi seçmek, iki kişiyi dışarıda bırakmakla aynıdır."]},
{t:"Karar tablosu", v:{type:"table",h:"Hangi aracı kullanmalıyım?",head:["Soru","Sıra önemli mi?","Araç"],rows:[["Şifre, sıralama, yarış sonucu, koltuk dizilimi","Evet","Permütasyon P(n,k) veya n!"],["Komite, el, örnek, seçilen parçalar","Hayır","Kombinasyon C(n,k)"],["Ard arda bağımsız kararlar (her adımda seçenek)","Adımlar var","Çarpma kuralı"],["“Tekrar var” (aynı rakam iki kez olabilir)","Evet","nᵏ"]],note:"Test: “Ali–Ayşe” ile “Ayşe–Ali” farklı mı? Farklıysa permütasyon, aynıysa kombinasyon."}, d:"Dört satırlı karar tablosu; altta test cümlesi.",
 b:["Karar tablosu. Şifre, sıralama, yarış sonucu: sıra önemli, permütasyon.","Komite, el, seçilen parçalar: sıra önemsiz, kombinasyon.","Ard arda kararlar: çarpma kuralı.","Tekrar varsa, mesela bir şifrede aynı rakam iki kez kullanılabiliyorsa, n üzeri k.","Pratik test: Ali Ayşe ile Ayşe Ali farklı mı? Farklıysa permütasyon, aynıysa kombinasyon."]},
{h:"Kavram 4 · Sayma ile olasılık", t:"Pay ve payda aynı mantıkla", v:{type:"steps",h:"10 parçanın 3'ü kusurlu; 2 parça seçiliyor. P(ikisi de kusurlu)?",lines:["Payda: 10 parçadan 2 seçmek, sıra önemsiz → C(10,2) = 45","Pay: 3 kusurludan 2 seçmek → C(3,2) = 3","P = 3 / 45 = **1/15 ≈ 0.067**","Aynı sonuç sıralı sayımla: (3·2)/(10·9) = 6/90 = 1/15 ✓"]}, d:"Dört adım; pay-payda tutarlılığı vurgulanır.",
 b:["Sayma ile olasılık. On parçanın üçü kusurlu, iki parça seçiyoruz.","Payda: on parçadan ikisini sırasız seçmek, kırk beş yol.","Pay: üç kusurludan ikisini seçmek, üç yol.","Olasılık üç bölü kırk beş, on beşte bir.","Sıralı sayarsan da olur: üç çarpı iki bölü on çarpı dokuz, yine on beşte bir. Önemli olan pay ve paydada aynı mantığı kullanmak."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["Komite sorusunda permütasyon kullanmak (k! kat fazla sayma)","Paydada kombinasyon, payda permütasyon (tutarsız sayma)","“En az 1 kusurlu” için 3·C(9,1) gibi çift sayan ifadeler","0! = 0 sanmak"]},r:{h:"Doğru",items:["“Sıra önemli mi?” testini her seferinde yap","Pay ve payda aynı türde sayılır (ikisi de sıralı ya da ikisi de sırasız)","“En az 1” = 1 − P(hiç) : tümleyen ile say","0! = 1, C(n,0) = C(n,n) = 1"]},verdict:"Kural: önce payda, sonra pay; ikisi de aynı sayma türüyle."}, d:"Yanlış/doğru sütunları ve kural.",
 b:["Sık hatalar. Komite sorusunda permütasyon kullanmak; sonucu k faktöriyel kat şişirir.","Paydada kombinasyon, payda permütasyon kullanmak; tutarsız sayma, yanlış olasılık.","En az bir kusurlu derken bir kusurluyu seçip kalanı serbest bırakmak; aynı seçimi birden çok kez sayar. Doğrusu tümleyen: bir eksi hiç kusurlu olmaması.","Ve sıfır faktöriyel bir'dir, sıfır değil."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Sayma",items:["Çarpma kuralı: adımların seçenek sayılarını çarp.","Permütasyon (sıra önemli): P(n,k) = n!/(n−k)!.","Kombinasyon (sıra önemsiz): C(n,k) = n!/(k!(n−k)!) = P(n,k)/k!.","C(n,k) = C(n,n−k);  C(n,0) = 1;  0! = 1.","Olasılık = (istenen sayım)/(toplam sayım), ikisi de aynı türde."]}, d:"Özet kartı; 5 saniye.", hold:5,
 b:["Özet. Çarpma kuralı: seçenek sayılarını çarp.","Sıra önemliyse permütasyon.","Sıra önemsizse kombinasyon; permütasyonu k faktöriyele böl.","Simetri ve özel değerler: n'in sıfırlısı bir, sıfır faktöriyel bir.","Olasılık için pay ve paydayı aynı türde say."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"4 haneli şifre: rakamlar 0–9",lines:["Tekrar serbest: her hane 10 seçenek → 10·10·10·10 = **10.000**","Rakamlar farklı olmalı: 10·9·8·7 = P(10,4) = **5.040**","Farklı rakamlı şifre seçme olasılığı: 5040 / 10000 = **0.504**","Yorum: rastgele 4 haneli şifrelerin yarısında rakam tekrarı vardır."]}, d:"Dört adım; sonuçlar kalın.",
 b:["Basit örnek: dört haneli şifre. Her hane sıfırdan dokuza.","Tekrar serbestse her hane için on seçenek; on üzeri dört, on bin.","Rakamlar farklı olmalıysa on çarpı dokuz çarpı sekiz çarpı yedi, beş bin kırk. Bu bir permütasyon.","Rastgele bir şifrenin farklı rakamlı olma olasılığı sıfır nokta beş yüz dört.","Yani rastgele şifrelerin yaklaşık yarısında tekrar eden rakam vardır."]},
{t:"Zor örnek: soru", v:{type:"think",q:"8 mühendis (3 endüstri, 5 makine) arasından rastgele 4 kişilik bir proje ekibi seçiliyor.",parts:["(a) Ekipte tam 2 endüstri mühendisi olma olasılığı?","(b) Ekipte en az 1 endüstri mühendisi olma olasılığı?"],secs:10}, d:"Soru ve iki şık; 10 saniyelik geri sayım.",
 b:["Zor örnek. Üçü endüstri, beşi makine olmak üzere sekiz mühendisten dört kişilik ekip seçiliyor. a: tam iki endüstri mühendisi olma olasılığı. b: en az bir endüstri mühendisi olma olasılığı. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: “en az 1” için çift sayma",lines:["“Önce 1 endüstri seç (3 yol), kalan 3 kişiyi 7'den seç C(7,3)=35 → 105 ekip” ✗","105 > C(8,4) = 70 → olasılık 1.5 çıkar: **imkânsız**","Sebep: 2 endüstri mühendisi içeren ekipler iki kez, 3 içerenler üç kez sayıldı."]}, d:"Kırmızı yanlış yol; olasılığın 1'i aşması vurgulanır.",
 b:["Yaygın yanlış: önce bir endüstri mühendisi seç, üç yol; kalan üç kişiyi yediden seç, otuz beş yol; yüz beş ekip.","Ama toplam ekip sayısı sekizin dörtlüsü, yetmiş. Yüz beş bölü yetmiş bir nokta beş; olasılık biri aşıyor, imkânsız.","Sebep çift sayma: iki endüstri mühendisi içeren ekipler iki kez, üç içerenler üç kez sayıldı."]},
{t:"Zor örnek: çözüm", v:{type:"steps",h:"Doğru çözüm",lines:["Payda: C(8,4) = 70 ekip, hepsi eşit olasılıklı","(a) 3 endüstriden 2: C(3,2) = 3;  5 makineden 2: C(5,2) = 10","    P(tam 2 E) = 3·10 / 70 = 30/70 = **3/7 ≈ 0.429**","(b) Tümleyen: hiç endüstri yok = 4 kişi de makineden: C(5,4) = 5","    P(en az 1 E) = 1 − 5/70 = 65/70 = **13/14 ≈ 0.929**","Kontrol (b): tam1 + tam2 + tam3 = 3·10 + 30 + 1·5 = 65 ✓  (C(3,1)C(5,3) + C(3,2)C(5,2) + C(3,3)C(5,1))"]}, d:"Çözüm adımları; her şıkkın sonucu kalın; son satır doğrudan sayımla sağlama.",
 b:["Doğru çözüm. Payda: sekizden dört kişi, yetmiş ekip; hepsi eşit olasılıklı.","a: üç endüstri mühendisinden ikisini seç, üç yol; beş makine mühendisinden ikisini seç, on yol. Çarpma kuralıyla otuz ekip.","Olasılık otuz bölü yetmiş, yedide üç, yaklaşık sıfır nokta kırk üç.","b: tümleyen yolu. Hiç endüstri mühendisi olmaması, dört kişinin de makineden gelmesi: beşin dörtlüsü, beş ekip.","En az bir: bir eksi beş bölü yetmiş, on dörtte on üç, yaklaşık sıfır nokta dokuz üç.","Sağlama: tam bir, tam iki ve tam üç endüstri mühendisli ekipleri ayrı ayrı sayıp toplarsan otuz artı otuz artı beş, altmış beş. Aynı sonuç."]},
{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["Önce sor: sıra önemli mi? Tekrar var mı?","Permütasyon = sıralı; kombinasyon = permütasyon / k!.","Olasılıkta pay ve payda aynı sayma türünde olmalı.","“En az bir” → tümleyenle say; çift sayma tuzağına düşme.","Olasılık > 1 çıkarsa bir sayma hatası var."]}, d:"Sonuç kartı; 4 saniye.", hold:4,
 b:["Tekrar. İlk soru hep aynı: sıra önemli mi, tekrar var mı?","Permütasyon sıralı seçim, kombinasyon onun k faktöriyele bölünmüş hali.","Pay ve payda aynı türde sayılır.","En az bir sorularında tümleyeni kullan, çift saymadan kaçın.","Ve olasılık biri aşıyorsa sayımda hata var demektir."]},
{h:"Kapanış", t:"Sonraki adım", v:{type:"text",h:"Sıradaki video: Koşullu olasılık",items:["Yeni bilgi geldiğinde olasılık nasıl güncellenir? P(A|B) tanımı ve çarpma kuralı.","Tekrar: 52 karttan 5 kart; tam 2 as olma olasılığını hem kombinasyonla hem sıralı sayımla bul.","Ders notu şablonunu doldur."]}, d:"Kapanış maddeleri.",
 b:["Sıradaki videoda yeni bilgi geldiğinde olasılığın nasıl güncellendiğini, koşullu olasılığı öğreneceğiz.","Tekrar için: elli iki karttan beş kart çekildiğinde tam iki as olma olasılığını hem kombinasyonla hem sıralı sayımla bul; aynı sonucu görmelisin.","Ders notu şablonunu doldur. Görüşmek üzere."]}
],
not:["Çarpma kuralı: 1. adımda a, 2. adımda b seçenek varsa toplam {a · b} yol.",

V.s4 = {
k:{konu:"Koşullu olasılık ve çarpma kuralı", on:"Aksiyomlar, toplama kuralı, sayma (2–3. videolar)."},
h:["P(A|B) tanımını yazıp “indirgenmiş örnek uzayı” olarak yorumlayabilmek",
   "Çarpma kuralı ile ard arda (geri koymadan) çekilişlerin olasılığını hesaplayabilmek",
   "Çapraz tablodan (contingency table) koşullu olasılık okuyabilmek",
   "P(A|B) ile P(B|A)'yı karıştırmamak",
   "Toplam olasılık fikrini ağaç diyagramında görebilmek (bir sonraki videoya köprü)"],
sc:[
{h:"Giriş", t:"Açılış", v:{type:"title",h:"Koşullu olasılık",sub:"Yeni bilgi gelince olasılık nasıl güncellenir?",tags:["Conditional probability","P(A|B)","Multiplication rule","Reduced sample space"]}, d:"Başlık ve etiketler.",
 b:["Bu videoda olasılığın en güçlü fikirlerinden birini öğreniyoruz: koşullu olasılık. Bir şey öğrendiğimizde, diğer şeylerin olasılığı değişir.","Tanımı, görsel yorumunu, çarpma kuralını ve en sık karıştırılan noktayı adım adım göreceğiz."]},
{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"Bilgi, olasılığı günceller",items:["Parça kusurlu çıktı. Hangi makineden geldiği sorusunun cevabı artık farklı.","Test pozitif çıktı. Hasta olma olasılığı artık yüzde kaç?","İlk çekilen top kırmızıydı. İkincinin kırmızı olma şansı değişti mi?","Koşullu olasılık, “B olduğunu bildiğimize göre A ne kadar olası?” sorusunu kesin bir formüle bağlar."]}, d:"Dört madde sırayla.",
 b:["Günlük mühendislik soruları: parça kusurlu çıktı, hangi makineden gelmiş olabilir? Test pozitif çıktı, gerçekten hasta mı?","İlk çekilen top kırmızıydı; ikincinin kırmızı olma şansı değişti mi? Evet, değişti.","Koşullu olasılık bu tip soruları, B olduğunu bildiğimize göre A ne kadar olası, kesin bir formüle bağlar."]},
{h:"Kavram 1 · Tanım", t:"P(A|B)", v:{type:"formula",h:"Koşullu olasılık (conditional probability)",lines:[["P(A | B) = P(A ∩ B) / P(B),    P(B) > 0","“B verildiğinde A'nın olasılığı”: B'nin içinde A'nın payı"],["Okunuş: “A given B”","Çubuk | “verildiğinde / bilindiğine göre” demektir"],["P(B | B) = 1,   P(Bᶜ | B) = 0","B kesinleşmiştir; B'nin dışı artık imkânsız"]]}, d:"Üç formül kartı; 5 saniye sabit.", hold:5,
 b:["Tanım: B verildiğinde A'nın koşullu olasılığı, A kesişim B'nin olasılığı bölü B'nin olasılığıdır. B'nin olasılığı sıfırdan büyük olmalı.","İngilizcesi A given B. Çubuk işareti, verildiğinde, bilindiğine göre demektir.","Tanımdan iki sonuç: B verildiğinde B'nin olasılığı bir; B'nin dışı artık imkânsız, sıfır."]},
{t:"Görsel: örnek uzayı küçülür", v:{type:"list",h:"Zar atıldı; “çift geldi” dendi",items:["1","2","3","4","5","6"],steps:[{hl:[],label:"Bilgi yokken: P(6) = 1/6"},{hl:[1,3,5],col:"warm",label:"B = çift geldi → mümkün olanlar {2, 4, 6}"},{hl:[5],col:"good",label:"P(6 | çift) = 1/3   (indirgenmiş örnek uzayı)"}]}, d:"Altı sonuç kutucuğu; önce hepsi; sonra çiftler sarı; sonra sadece 6 yeşil.",
 b:["Görsel yorum. Zar atıldı, altı sonucun her biri altıda bir.","Birisi çift geldi dedi. Artık tek sayılar imkânsız; mümkün olanlar iki, dört, altı. Örnek uzayı küçüldü; buna indirgenmiş örnek uzayı, reduced sample space, denir.","Bu üç sonuç içinde altının payı üçte bir. Formülle de aynı: P altı kesişim çift, altıda bir; bölü P çift, bir bölü iki; eşittir üçte bir."]},
{t:"Venn ile: neden P(B)'ye bölüyoruz?", v:{type:"venn",a:"A",b:"B",steps:[{mode:"b",label:"B verildi: artık dünya B'den ibaret"},{mode:"inter",label:"A'nın B içindeki kısmı: A ∩ B"},{mode:"inter",label:"P(A|B) = alan(A ∩ B) / alan(B)  → B'ye göre yeniden ölçekle"}]}, d:"Venn: önce B boyanır; sonra kesişim; etiket formülü açıklar.",
 b:["Venn diyagramıyla düşünelim. B verildiğinde dünyamız B dairesine küçülür.","Bu dünyada A'nın gerçekleşmesi demek A kesişim B bölgesine düşmek demek.","Olasılıklar yeni dünyada toplam bir etmeli; bu yüzden B'ye böleriz. Bölme bir ölçekleme, normalizasyon işlemidir."]},
{h:"Kavram 2 · Çarpma kuralı", t:"Tanımı tersine çevir", v:{type:"formula",h:"Çarpma kuralı (multiplication rule)",lines:[["P(A ∩ B) = P(A | B) · P(B) = P(B | A) · P(A)","Tanımı P(A ∩ B) için çöz; iki yönden de yazılabilir"],["P(A ∩ B ∩ C) = P(A) · P(B | A) · P(C | A ∩ B)","Genel çarpma kuralı: her adım öncekilere koşullu"],["Kullanım: ard arda, geri koymadan çekilişler","“İlk … ve sonra …” cümleleri"]]}, d:"Üç formül kartı; 4 saniye sabit.", hold:4,
 b:["Tanımı kesişim için çözersek çarpma kuralı çıkar: A kesişim B'nin olasılığı, A verildiğinde B çarpı A, ya da B verildiğinde A çarpı B.","Üç olay için genelleme: her adım kendinden öncekilere koşullu olarak çarpılır.","Nerede kullanılır? Ard arda, geri koymadan çekilişlerde; ilk şu ve sonra bu cümlelerinde."]},
{t:"Görsel: kutudan top çekme", v:{type:"urn",balls:"RRRRRBBB",steps:[{drawn:[],label:"5 kırmızı, 3 mavi; 2 top geri koymadan"},{drawn:[0],label:"P(1. kırmızı) = 5/8"},{drawn:[0,1],label:"P(2. kırmızı | 1. kırmızı) = 4/7"},{drawn:[0,1],label:"P(ikisi kırmızı) = 5/8 · 4/7 = 20/56 ≈ 0.357"}]}, d:"Kutuda 8 top; çekilen toplar sağa dizilir; her adımda olasılık etiketi değişir.",

{h:"Kavram 3 · Tablodan koşullu olasılık", t:"Çapraz tablo", v:{type:"table",h:"200 parça: makine × kalite",head:["","Kusurlu (K)","Sağlam (Kᶜ)","Toplam"],rows:[["M1","6","114","120"],["M2","10","70","80"],["Toplam","16","184","200"]],all:true,note:"P(K | M2) = 10/80 = 0.125    P(M2 | K) = 10/16 = 0.625    P(K) = 16/200 = 0.08"}, d:"Çapraz tablo bir kerede belirir; altta üç koşullu/koşulsuz olasılık.",

{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["P(A|B) ile P(B|A)'yı aynı sanmak","P(A|B) = P(A ∩ B) yazmak (bölmeyi unutmak)","Geri koymadan çekilişte 2. çekilişi 1.'den bağımsız saymak","“A ve B” ile “A verildiğinde B”yi karıştırmak"]},r:{h:"Doğru",items:["P(K|M2)=0.125 ama P(M2|K)=0.625: koşul hangi tarafta, dikkat","Koşul kümesine böl: payda P(B)","Her çekilişte sayıları güncelle: 5/8 sonra 4/7","“ve” → kesişim (çarpma kuralı);  “verildiğinde” → koşullu"]},verdict:"Her soruda sor: Hangi olay biliniyor (koşul), hangisi soruluyor?"}, d:"Yanlış/doğru karşılaştırması ve kural.",
 b:["En büyük hata: koşulun yönünü karıştırmak. M2 verildiğinde kusurlu, sıfır nokta on iki beş; kusurlu verildiğinde M2, sıfır nokta altı iki beş. Çok farklı sayılar.","İkinci hata: bölmeyi unutup kesişimi koşullu olasılık sanmak.","Üçüncüsü: geri koymadan çekilişte sayıları güncellememek.","Ve dil tuzağı: ve kelimesi kesişim demektir; verildiğinde kelimesi koşul. Her soruda hangi olayın bilindiğini, hangisinin sorulduğunu yaz."]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Koşullu olasılık",items:["P(A|B) = P(A ∩ B)/P(B): B'nin içinde A'nın payı.","Yorum: örnek uzayı B'ye küçülür, olasılıklar yeniden ölçeklenir.","Çarpma kuralı: P(A ∩ B) = P(A|B)·P(B) = P(B|A)·P(A).","Geri koymadan çekiliş: her adımda sayıları güncelle, çarp.","Tabloda: koşul satır/sütunu seçer; P(A|B) ≠ P(B|A)."]}, d:"Özet kartı; 5 saniye.", hold:5,
 b:["Özet. Koşullu olasılık, kesişim bölü koşul.","Yorumu: örnek uzayı koşula küçülür, olasılıklar yeniden ölçeklenir.","Çarpma kuralı tanımın tersine çevrilmiş hali.","Geri koymadan çekilişte her adımda sayıları güncelle ve çarp.","Tabloda koşul, hangi satır veya sütuna bakacağını söyler; yönü karıştırma."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"P(A ∩ B) = 0.12,  P(B) = 0.4,  P(A) = 0.2",lines:["P(A | B) = P(A ∩ B) / P(B) = 0.12 / 0.4 = **0.3**","P(B | A) = P(A ∩ B) / P(A) = 0.12 / 0.2 = **0.6**","Yorum: B bilinince A'nın olasılığı 0.2'den 0.3'e yükseldi (A ve B birbirini destekliyor)","Kontrol: P(A|B)·P(B) = 0.3·0.4 = 0.12 = P(A ∩ B) ✓"]}, d:"Dört adım; iki koşullu olasılık ve sağlama.",
 b:["Basit örnek. Kesişim sıfır nokta on iki, B sıfır nokta dört, A sıfır nokta iki.","B verildiğinde A: on iki bölü kırk, sıfır nokta üç.","A verildiğinde B: on iki bölü yirmi, sıfır nokta altı. Aynı kesişim, farklı paydalar, farklı cevaplar.","Yorum: B'yi öğrenince A'nın olasılığı sıfır nokta ikiden sıfır nokta üçe çıktı.","Sağlama: çarpma kuralıyla kesişimi geri elde ediyoruz."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir kutuda 4 sağlam, 2 kusurlu lamba var. Geri koymadan ard arda 3 lamba çekiliyor.",parts:["(a) Üçünün de sağlam olma olasılığı?","(b) İkinci lambanın kusurlu olma olasılığı?"],secs:10}, d:"Soru ve iki şık; 10 saniyelik geri sayım.",
 b:["Zor örnek. Kutuda dört sağlam, iki kusurlu lamba; geri koymadan ard arda üç lamba çekiliyor. a: üçünün de sağlam olma olasılığı. b: ikinci lambanın kusurlu olma olasılığı. Dikkat, b şıkkında birinci lambanın ne çıktığı söylenmiyor. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: (b) için “bir lamba çekildi, 5 kaldı”",lines:["“2. lamba kusurlu = 2/5” ✗  → 1. lambanın sağlam olduğu varsayıldı","“2. lamba kusurlu = 1/5” ✗  → 1. lambanın kusurlu olduğu varsayıldı","1. lambanın sonucu bilinmiyor: iki durumu **ağırlıklı toplamak** gerekir."]}, d:"Kırmızı yanlış yol; iki yaygın yanlış cevap.",
 b:["Yaygın yanlış: bir lamba çekildi, beş kaldı, kusurlu iki tane, iki bölü beş. Bu, ilk lambanın sağlam çıktığını varsayar.","Ya da bir bölü beş; bu da ilkinin kusurlu çıktığını varsayar.","Ama ilk lambanın sonucu bilinmiyor. İki durumu olasılıklarıyla ağırlıklandırıp toplamak gerekir."]},
{t:"Zor örnek: çözüm (a)", v:{type:"steps",h:"(a) Çarpma kuralı",lines:["P(S₁) = 4/6","P(S₂ | S₁) = 3/5   (3 sağlam, 5 lamba kaldı)","P(S₃ | S₁ ∩ S₂) = 2/4","P(S₁ ∩ S₂ ∩ S₃) = 4/6 · 3/5 · 2/4 = 24/120 = **1/5 = 0.2**","Kontrol (kombinasyon): C(4,3)/C(6,3) = 4/20 = 1/5 ✓"]}, d:"Beş adım; genel çarpma kuralı ve kombinasyon sağlaması.",

{t:"Zor örnek: çözüm (b)", v:{type:"tree",root:"1. lamba",b:[{l:"S₁",p:"4/6",c:[{l:"K₂",p:"2/5",r:"8/30"},{l:"S₂",p:"3/5",r:"12/30"}]},{l:"K₁",p:"2/6",c:[{l:"K₂",p:"1/5",r:"2/30"},{l:"S₂",p:"4/5",r:"8/30"}]}],steps:[{hl:[[0,0],[1,0]],label:"P(K₂) = 8/30 + 2/30 = 10/30 = 1/3"},{hl:[[0,0],[1,0]],label:"Aynı P(K₁) = 2/6 = 1/3: sırayı bilmemek olasılığı değiştirmez"}]}, d:"Ağaç: kök → S₁/K₁ → K₂/S₂; uç olasılıklar; K₂ ile biten iki yol vurgulanır ve toplanır.",

{h:"Kavram 1 · Parçalanış", t:"Tanım", v:{type:"formula",h:"Parçalanış (partition)",lines:[["B₁, B₂, …, Bₙ:  Bᵢ ∩ Bⱼ = ∅  (i ≠ j)","Olaylar ikişer ikişer ayrık"],["B₁ ∪ B₂ ∪ … ∪ Bₙ = S","Birlikte örnek uzayını kaplarlar"],["Örnek: {M1, M2}  veya  {B, Bᶜ}","Her sonuç tam olarak bir parçaya düşer"]]}, d:"Üç kart; 4 saniye sabit.", hold:4,
 b:["Önce bir tanım: parçalanış, partition. Örnek uzayını birbiriyle çakışmayan parçalara bölmek.","Parçalar ayrık olmalı ve birlikte S'yi kaplamalı. Her sonuç tam olarak bir parçaya düşer.","En basit parçalanış B ve B'nin tümleyeni. Fabrika örneğinde makine bir ve makine iki."]},
{h:"Kavram 2 · Toplam olasılık", t:"Türetme", v:{type:"steps",h:"Toplam olasılık kuralı (law of total probability)",lines:["A'yı parçalara böl: A = (A ∩ B₁) ∪ (A ∩ B₂) ∪ … ∪ (A ∩ Bₙ)","Parçalar ayrık → Aksiyom 3: P(A) = Σ P(A ∩ Bᵢ)","Çarpma kuralı: P(A ∩ Bᵢ) = P(A | Bᵢ) · P(Bᵢ)","**P(A) = Σ P(A | Bᵢ) · P(Bᵢ)**","İki parça için: P(A) = P(A|B)P(B) + P(A|Bᶜ)P(Bᶜ)"]}, d:"Türetme adımları; formül kalın.",

{t:"Görsel: ağaç diyagramı", v:{type:"tree",root:"Parça",b:[{l:"M1",p:"0.60",c:[{l:"K",p:"0.02",r:"0.012"},{l:"Kᶜ",p:"0.98",r:"0.588"}]},{l:"M2",p:"0.40",c:[{l:"K",p:"0.05",r:"0.020"},{l:"Kᶜ",p:"0.95",r:"0.380"}]}],steps:[{hl:[[0,0],[1,0]],label:"P(K) = 0.012 + 0.020 = 0.032"}]}, d:"Ağaç: kök → M1 (0.6) / M2 (0.4) → K / Kᶜ dalları; uç çarpımlar; K ile biten iki yol vurgulanıp toplanır.",

{h:"Kavram 3 · Bayes teoremi", t:"Türetme", v:{type:"steps",h:"Bayes teoremi (Bayes' theorem)",lines:["Hedef: P(Bⱼ | A)  (sonuç A görüldü, sebep Bⱼ mi?)","Tanım: P(Bⱼ | A) = P(A ∩ Bⱼ) / P(A)","Pay: çarpma kuralı → P(A | Bⱼ) · P(Bⱼ)","Payda: toplam olasılık → Σ P(A | Bᵢ) · P(Bᵢ)","**P(Bⱼ | A) = P(A | Bⱼ) P(Bⱼ) / Σᵢ P(A | Bᵢ) P(Bᵢ)**"]}, d:"Türetme adımları; sonuç kalın.",

{t:"Görsel: ağaçta Bayes", v:{type:"tree",root:"Parça",b:[{l:"M1",p:"0.60",c:[{l:"K",p:"0.02",r:"0.012"},{l:"Kᶜ",p:"0.98",r:"0.588"}]},{l:"M2",p:"0.40",c:[{l:"K",p:"0.05",r:"0.020"},{l:"Kᶜ",p:"0.95",r:"0.380"}]}],steps:[{hl:[[1,0]],label:"Aranan yol: M2 ve K = 0.020"},{hl:[[0,0],[1,0]],label:"P(M2 | K) = 0.020 / (0.012 + 0.020) = 0.625"}]}, d:"Aynı ağaç; önce M2→K yolu, sonra K ile biten tüm yollar vurgulanır; oran hesaplanır.",

{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["P(sebep | sonuç) yerine P(sonuç | sebep) vermek (“test %95 doğru, o zaman hasta %95”)","Taban oranını (prior) yok saymak","Paydada sadece aranan yolu yazmak","Parçalanışı eksik yazmak (yollar toplamı 1 değil)"]},r:{h:"Doğru",items:["Bayes: aranan yol / tüm yollar","Nadir sebep + yanlış pozitif → sonsal şaşırtıcı derecede küçük olabilir","Payda = toplam olasılık = tüm yolların toplamı","Dalların olasılıkları her düğümde 1'e tamamlanmalı"]},verdict:"Ağaç çiz: dalları çarp, uçları topla, aranan yolu toplama böl."}, d:"Yanlış/doğru karşılaştırması.",

{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"M1: %60 üretim, %2 kusur.  M2: %40 üretim, %5 kusur.",lines:["Verilenler: P(M1)=0.6, P(M2)=0.4, P(K|M1)=0.02, P(K|M2)=0.05","Toplam olasılık: P(K) = 0.6·0.02 + 0.4·0.05 = 0.012 + 0.020 = **0.032**","Bayes: P(M1|K) = 0.012 / 0.032 = **0.375**","P(M2|K) = 0.020 / 0.032 = **0.625**;  kontrol: 0.375 + 0.625 = 1 ✓","Sağlam parça için: P(M2|Kᶜ) = 0.380 / 0.968 ≈ **0.393** (önsel 0.40'tan az düştü)"]}, d:"Beş adım; sonuçlar kalın.",
 b:["Basit örnek, aynı fabrika. Verilenleri yaz.","Toplam olasılık: kusurlu oranı sıfır nokta sıfır otuz iki.","Bayes ile M1 verildiğinde kusurlu, sıfır nokta üç yüz yetmiş beş.","M2 için sıfır nokta altı yüz yirmi beş; ikisi bire tamamlanıyor.","Bir de sağlam parça için bak: M2 verildiğinde sağlam otuz sekiz bölü doksan altı buçuk, yaklaşık sıfır nokta otuz dokuz. Sağlam gözlemi M2 aleyhine zayıf bir kanıt; önsel çok az değişti."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir hastalığın toplumda görülme sıklığı %1. Test, hastaları %95 olasılıkla pozitif gösteriyor; sağlıklı kişilerde ise %10 olasılıkla (yanlış) pozitif veriyor.",parts:["(a) Rastgele bir kişinin testinin pozitif çıkma olasılığı?","(b) Testi pozitif çıkan bir kişinin gerçekten hasta olma olasılığı?"],secs:10}, d:"Soru ve iki şık; 10 saniyelik geri sayım.",
 b:["Zor örnek. Hastalık toplumda yüzde bir görülüyor. Test hastaları yüzde doksan beş olasılıkla yakalıyor; sağlıklılarda yüzde on yanlış pozitif veriyor. a: rastgele bir kişinin testinin pozitif çıkma olasılığı. b: testi pozitif çıkan kişinin gerçekten hasta olma olasılığı. On saniye düşün; sezgine güvenme."]},

{t:"Zor örnek: çözüm", v:{type:"tree",root:"Kişi",b:[{l:"Hasta",p:"0.01",c:[{l:"+",p:"0.95",r:"0.0095"},{l:"−",p:"0.05",r:"0.0005"}]},{l:"Sağlıklı",p:"0.99",c:[{l:"+",p:"0.10",r:"0.0990"},{l:"−",p:"0.90",r:"0.8910"}]}],steps:[{hl:[[0,0],[1,0]],label:"(a) P(+) = 0.0095 + 0.0990 = 0.1085"},{hl:[[0,0]],label:"(b) P(Hasta | +) = 0.0095 / 0.1085 ≈ 0.0876  (≈ %8.8)"}]}, d:"Ağaç: Hasta (0.01)/Sağlıklı (0.99) → +/−; uç çarpımlar; önce + yolları toplanır, sonra hasta∧+ yolu toplama bölünür.",

h:["Bağımsızlığı P(A∩B)=P(A)P(B) ve P(A|B)=P(A) ile tanımlayıp iki olayın bağımsız olup olmadığını test edebilmek",

sc:[
{h:"Giriş", t:"Açılış", v:{type:"title",h:"Bağımsızlık",sub:"Bilgi gelir ama olasılık değişmezse",tags:["Independence","P(A∩B)=P(A)P(B)","Series / parallel systems","Reliability"]}, d:"Başlık ve etiketler.",
 b:["Geçen videoda bilgi geldiğinde olasılığın değiştiğini gördük. Bu videoda özel bir durumu inceliyoruz: bilginin olasılığı hiç değiştirmediği durum. Buna bağımsızlık diyoruz.","Tanımdan sonra bağımsızlığın en önemli mühendislik uygulamasına geçeceğiz: seri ve paralel sistemlerin güvenilirliği."]},
{h:"Neden önemli?", t:"Hangi soruna cevap veriyor?", v:{type:"text",h:"Bağımsızlık hesabı çok basitleştirir",items:["Bir sistemde 10 bileşen varsa, hepsinin aynı anda çalışma olasılığı nasıl bulunur?","Bağımsızlık varsa cevap sadece **çarpma**: p₁·p₂·…·p₁₀.","Tekrarlı deneyler (zar, para, üretim hattı) bağımsızlık üzerine kurulur; ileride binom ve Poisson buradan doğar.","Ama bağımsızlık bir **varsayımdır**; doğru olup olmadığını sorgulamak gerekir."]}, d:"Dört madde sırayla.",
 b:["On bileşenli bir sistemde hepsinin aynı anda çalışma olasılığını nasıl buluruz?","Bileşenler bağımsızsa cevap sadece çarpmadır.","Tekrarlı deneylerin tamamı bağımsızlık üzerine kuruludur; ileride göreceğin binom ve Poisson dağılımları buradan doğar.","Ama bağımsızlık bir varsayımdır. Aynı güç kaynağına bağlı iki bileşen bağımsız olmayabilir; sorgulamak gerekir."]},
{h:"Kavram 1 · Tanım", t:"Bağımsızlık", v:{type:"formula",h:"Bağımsızlık (independence)",lines:[["A ve B bağımsız  ⟺  P(A ∩ B) = P(A) · P(B)","Tanım: kesişim, çarpıma eşit"],["Eşdeğer:  P(A | B) = P(A)   (P(B) > 0)","B'yi öğrenmek A'nın olasılığını değiştirmez"],["Eşdeğer:  P(B | A) = P(B)","Simetrik: A'yı öğrenmek de B'yi değiştirmez"]]}, d:"Üç kart; 5 saniye sabit.", hold:5,
 b:["Tanım: A ve B bağımsızdır ancak ve ancak kesişimin olasılığı olasılıkların çarpımına eşitse.","Bu, koşullu olasılık tanımıyla şuna eşdeğer: B verildiğinde A'nın olasılığı A'nın olasılığına eşit. B'yi öğrenmek A hakkında hiçbir şey söylemiyor.","Ve simetrik: A'yı öğrenmek de B'yi değiştirmez. Bağımsızlık karşılıklıdır."]},
{t:"Görsel: iki zarda bağımsızlık testi", v:{type:"grid",rows:6,cols:6,rlabel:"1. zar",clabel:"2. zar",steps:[{rule:"r:6",col:"acc",label:"A = “1. zar 6”",sub:"P(A) = 6/36 = 1/6"},{rule:"c:even",col:"warm",label:"B = “2. zar çift”",sub:"P(B) = 18/36 = 1/2"},{rule:"r:6&c:even",col:"good",label:"A ∩ B: 3 hücre → 3/36 = 1/12",sub:"P(A)·P(B) = 1/6 · 1/2 = 1/12  ✓  bağımsız"}]}, d:"Izgara: son satır mavi (A), çift sütunlar sarı (B), kesişim yeşil 3 hücre; etiketler çarpım testini gösterir.",
 b:["Test edelim. A, birinci zarın altı gelmesi: bir satır, olasılık altıda bir.","B, ikinci zarın çift gelmesi: üç sütun, olasılık bir bölü iki.","Kesişim üç hücre, otuz altıda üç, on ikide bir. Çarpım da altıda bir çarpı bir bölü iki, on ikide bir. Eşit; bağımsızlar. Sezgi de uyuyor: zarlar birbirini görmez."]},
{t:"Bağımlı bir çift", v:{type:"steps",h:"A = “toplam 8”, B = “1. zar 3”: bağımsız mı?",lines:["P(A) = 5/36,  P(B) = 6/36 = 1/6","A ∩ B = {(3,5)} → P(A ∩ B) = 1/36","P(A)·P(B) = 5/36 · 1/6 = 5/216 ≈ 0.023 ≠ 1/36 ≈ 0.028","**Bağımlı.** Koşullu bakış: P(A | B) = (1/36)/(1/6) = 1/6 ≠ 5/36","İlginç: “toplam 7” ile “1. zar 3” ise bağımsızdır: (1/36) = (6/36)(6/36) ✓"]}, d:"Beş adım; sayısal test; son satır şaşırtıcı karşı örnek.",
 b:["Şimdi bağımlı bir çift. A toplamın sekiz olması, B birinci zarın üç olması.","Kesişim tek hücre: üç beş. Olasılık otuz altıda bir.","Çarpım beş bölü iki yüz on altı; eşit değil.","Demek ki bağımlı. Koşullu bakışla da görülür: birinci zar üçse toplamın sekiz olma olasılığı altıda bir, genel olasılık otuz altıda beş.","İlginç bir not: toplam yedi ile birinci zar üç bağımsızdır, çünkü birinci zar ne olursa olsun toplamı yedi yapan tam bir ikinci zar değeri vardır. Bağımsızlık sezgiyle değil hesapla belirlenir."]},
{h:"Kavram 2 · Ayrık ≠ bağımsız", t:"En sık karıştırılan ikili", v:{type:"compare",bad:"l",l:{h:"Ayrık (mutually exclusive)",items:["A ∩ B = ∅","P(A ∩ B) = 0","Biri olursa diğeri **kesinlikle** olmaz","P(A | B) = 0 ≠ P(A)  → güçlü **bağımlılık**"]},r:{h:"Bağımsız (independent)",items:["P(A ∩ B) = P(A)·P(B)","Genelde kesişim boş değildir","Biri olunca diğerinin olasılığı **değişmez**","P(A | B) = P(A)"]},verdict:"P(A) > 0 ve P(B) > 0 ise ayrık olaylar asla bağımsız olamaz."}, d:"İki sütun: ayrık (kırmızı) ve bağımsız (yeşil); altta kural.",
 b:["En sık karıştırılan ikili: ayrık ve bağımsız. Ayrık olaylar birlikte gerçekleşemez; kesişim boş, olasılığı sıfır.","Bu, biri olursa diğeri kesin olmaz demek. Yani B'yi öğrenmek A'nın olasılığını sıfıra düşürür: güçlü bağımlılık.","Bağımsız olaylarda ise biri olunca diğerinin olasılığı hiç değişmez; kesişim genelde boş değildir.","Kural: olasılıkları sıfırdan büyük iki ayrık olay asla bağımsız olamaz. Ayrık, bağımsızlığın tam tersidir."]},
{h:"Kavram 3 · Tümleyenler ve çoklu bağımsızlık", t:"İspat ve genelleme", v:{type:"steps",h:"A, B bağımsızsa A ve Bᶜ de bağımsızdır",lines:["P(A ∩ Bᶜ) = P(A) − P(A ∩ B)   (A'yı iki ayrık parçaya böl)","= P(A) − P(A)P(B)   (bağımsızlık)","= P(A)(1 − P(B)) = P(A)·P(Bᶜ)  ✓","Benzer şekilde Aᶜ ve B, Aᶜ ve Bᶜ de bağımsızdır","Çoklu bağımsızlık (mutual): A, B, C için **tüm** alt kümelerde çarpım kuralı: P(A∩B∩C) = P(A)P(B)P(C) ve ikili olanlar"]}, d:"İspat adımları ve çoklu bağımsızlık notu.",
 b:["Kısa bir ispat. A kesişim B tümleyen, A'dan A kesişim B'yi çıkarmaktır.","Bağımsızlıkla kesişimi çarpım olarak yaz.","P A parantez bir eksi P B; bu da P A çarpı P B tümleyen. Demek ki A ve B tümleyen de bağımsız.","Aynı şekilde diğer tümleyen çiftleri de bağımsızdır. Pratikte: çalışıyor ve arızalı olayları arasında serbestçe geçiş yapabilirsin.","Üç veya daha fazla olay için karşılıklı bağımsızlık, mutual independence, her alt küme için çarpım kuralının sağlanmasını gerektirir; sadece üçlü çarpım yetmez."]},
{h:"Kavram 4 · Sistem güvenilirliği", t:"Seri sistem", v:{type:"system",blocks:[{c:[{l:"A",p:"0.9"}]},{c:[{l:"B",p:"0.9"}]}],steps:["Seri: hepsi çalışmalı → R = P(A ∩ B)","Bağımsız → R = p_A · p_B = 0.9 · 0.9 = 0.81"]}, d:"İki kutu art arda (seri); altta formül satırları.",
 b:["Mühendislik uygulaması: güvenilirlik, reliability. Bileşenler seri bağlıysa sistemin çalışması için hepsinin çalışması gerekir.","Bağımsızlık varsayımıyla bu bir çarpımdır: sıfır nokta dokuz çarpı sıfır nokta dokuz, sıfır nokta seksen bir. Seri sistem her zaman en zayıf bileşenden daha az güvenilirdir."]},
{t:"Paralel sistem", v:{type:"system",blocks:[{c:[{l:"A",p:"0.9"},{l:"B",p:"0.9"}]}],steps:["Paralel: en az biri çalışmalı → R = 1 − P(hepsi arızalı)","Bağımsız → R = 1 − (1−p_A)(1−p_B) = 1 − 0.1·0.1 = 0.99"]}, d:"İki kutu üst üste (paralel); altta formül satırları.",
 b:["Paralel bağlantıda en az bir bileşenin çalışması yeter. Buna yedekleme, redundancy, denir.","Tümleyenle düşün: sistem ancak hepsi arızalanırsa durur. Arızalar da bağımsız, o yüzden çarp: bir eksi sıfır nokta bir çarpı sıfır nokta bir, sıfır nokta doksan dokuz. Yedekleme güvenilirliği artırır."]},
{t:"Formül kartı", v:{type:"formula",h:"Güvenilirlik formülleri (bağımsız bileşenler)",lines:[["Seri:   R = p₁ · p₂ · … · pₙ","hepsi çalışmalı; R ≤ min pᵢ"],["Paralel:   R = 1 − (1−p₁)(1−p₂)…(1−pₙ)","en az biri çalışmalı; R ≥ max pᵢ"],["Karma sistem:  paralel blokları tek bir bileşene indirge, sonra seri çarp","blok blok çöz"]]}, d:"Üç kart; 4 saniye sabit.", hold:4,
 b:["Formül kartı. Seri: olasılıkları çarp; sonuç en zayıf bileşenden küçüktür.","Paralel: arızaları çarp, birden çıkar; sonuç en iyi bileşenden büyüktür.","Karma sistemlerde paralel blokları önce tek bileşene indirge, sonra seri çarp."]},
{h:"Sık yapılan hatalar", t:"Bu hatalara düşme", v:{type:"compare",bad:"l",l:{h:"Yanlış",items:["“Ayrık, o halde bağımsız”","Paralelde olasılıkları toplamak: 0.9 + 0.9 = 1.8","Bağımsızlığı kontrol etmeden çarpmak","Seri sistemi 1 − ∏(1−p) ile hesaplamak"]},r:{h:"Doğru",items:["Ayrık → bağımlı (P(A|B)=0)","Paralel: 1 − ∏(1−pᵢ); olasılık ≤ 1","Bağımsızlık = çarpım kuralı testi ya da problemin verdiği varsayım","Seri: ∏ pᵢ;  paralel: 1 − ∏(1−pᵢ)"]},verdict:"Önce sistemin “hepsi mi, en az biri mi?” sorusuna cevap ver."}, d:"Yanlış/doğru karşılaştırması.",
 b:["Hatalar. Ayrık o halde bağımsız demek; tam tersi.","Paralel sistemde olasılıkları toplamak: bir nokta sekiz gibi imkânsız bir sayı çıkar.","Problem bağımsızlık vermeden çarpmak.","Ve seri ile paralel formüllerini karıştırmak. Her sistemde önce sor: hepsi mi çalışmalı, en az biri mi?"]},
{h:"Ara özet", t:"Özet kartı", v:{type:"cards",h:"Özet kartı · Bağımsızlık",items:["Bağımsız ⟺ P(A∩B) = P(A)P(B) ⟺ P(A|B) = P(A).","Ayrık ≠ bağımsız; pozitif olasılıklı ayrık olaylar bağımlıdır.","A, B bağımsızsa tümleyenleri de bağımsızdır.","Seri: ∏pᵢ (hepsi).  Paralel: 1 − ∏(1−pᵢ) (en az biri).","Karma sistem: paralel bloğu indirge, seri çarp."]}, d:"Özet kartı; 5 saniye.", hold:5,
 b:["Özet. Bağımsızlık, çarpım kuralı ya da koşullu olasılığın değişmemesi.","Ayrık, bağımsızın tersidir.","Tümleyenler de bağımsızdır.","Seri çarp; paralel arızaları çarp, birden çıkar.","Karma sistemleri blok blok çöz."]},
{h:"Örnekler", t:"Basit örnek", v:{type:"steps",h:"İki bağımsız bileşen, her biri 0.9 olasılıkla çalışıyor",lines:["Seri: R = 0.9 · 0.9 = **0.81**","Paralel: R = 1 − (0.1)(0.1) = 1 − 0.01 = **0.99**","Üç bileşen paralel: 1 − (0.1)³ = **0.999**","Yorum: seri bağlantı güvenilirliği düşürür, paralel (yedekleme) artırır"]}, d:"Dört adım.",
 b:["Basit örnek. İki bağımsız bileşen, her biri sıfır nokta dokuz.","Seri: sıfır nokta seksen bir.","Paralel: bir eksi sıfır nokta sıfır bir, sıfır nokta doksan dokuz.","Üçüncü bir yedek eklersek sıfır nokta dokuz yüz doksan dokuz.","Yorum: seri bağlantı güvenilirliği düşürür, yedekleme artırır."]},
{t:"Zor örnek: soru", v:{type:"think",q:"Bir sistem: A (0.9) seri → {B (0.8) ve C (0.7) paralel} → D (0.95) seri. Bileşenler bağımsız.",parts:["(a) Sistemin çalışma olasılığı (güvenilirliği)?","(b) Sistem çalışıyorsa B'nin çalışıyor olma olasılığı?"],secs:10}, d:"Soru ve iki şık; geri sayım.",
 b:["Zor örnek. A seri, sonra B ve C paralel bir blok, sonra D seri. Olasılıklar sıfır nokta dokuz, sıfır nokta sekiz, sıfır nokta yedi, sıfır nokta doksan beş. a: sistemin güvenilirliği. b: sistem çalışıyorsa B'nin çalışıyor olma olasılığı. On saniye düşün."]},
{t:"Zor örnek: yaygın yanlış yol", v:{type:"steps",wrong:true,h:"Yanlış yol: paralel bloğu toplamak",lines:["“B veya C: 0.8 + 0.7 = 1.5” ✗ → olasılık 1'i aştı","“B veya C: en iyisi 0.8” ✗ → yedeğin katkısı yok sayıldı","Doğrusu: 1 − P(ikisi de arızalı) = 1 − (0.2)(0.3)"]}, d:"Kırmızı yanlış yol.",
 b:["Yaygın yanlış: paralel blokta sıfır nokta sekiz artı sıfır nokta yedi; bir nokta beş, imkânsız.","Ya da sadece en iyi bileşeni almak, sıfır nokta sekiz; yedeğin katkısı yok sayılır.","Doğrusu tümleyen: bir eksi ikisinin de arızalanma olasılığı."]},
{t:"Zor örnek: çözüm", v:{type:"system",blocks:[{c:[{l:"A",p:"0.9"}]},{c:[{l:"B",p:"0.8"},{l:"C",p:"0.7"}]},{c:[{l:"D",p:"0.95"}]}],steps:["Paralel blok: 1 − (0.2)(0.3) = 0.94","(a) R = 0.9 · 0.94 · 0.95 = 0.8037","(b) P(B | S) = P(B ∩ S)/P(S);  B çalışırsa blok çalışır","P(B ∩ S) = 0.9 · 0.8 · 0.95 = 0.684  →  P(B|S) = 0.684/0.8037 ≈ 0.851"]}, d:"Şema: A seri, B/C paralel, D seri; altta dört hesap satırı.",
 b:["Çözüm. Önce paralel bloğu tek bileşene indirge: bir eksi sıfır nokta iki çarpı sıfır nokta üç, sıfır nokta doksan dört.","a: seri çarpım: sıfır nokta dokuz çarpı sıfır nokta doksan dört çarpı sıfır nokta doksan beş, yaklaşık sıfır nokta sekiz yüz dört.","b: koşullu olasılık. B verildiğinde sistem olasılığı değil, sistem verildiğinde B. Tanım: B ve sistem çalışıyor bölü sistem çalışıyor. B çalışıyorsa paralel blok kesin çalışır.","Pay: sıfır nokta dokuz çarpı sıfır nokta sekiz çarpı sıfır nokta doksan beş, sıfır nokta altı yüz seksen dört. Böl: yaklaşık sıfır nokta seksen beş. Sistemin çalıştığını bilmek B'nin olasılığını sıfır nokta sekizden yükseltti; bağımsızlık ile koşullu olasılık aynı soruda birleşti."]},
{h:"Sonuç ve tekrar", t:"Ana fikirler", v:{type:"cards",h:"Sonuç ve tekrar",items:["Bağımsızlık bir hesap testidir: P(A∩B) = P(A)P(B)?","Ayrık olaylar bağımlıdır; karıştırma.","Seri: hepsi → çarp.  Paralel: en az biri → arızaları çarp, 1'den çıkar.","Karma sistemleri blok blok indirge.","Sistem bilgisi verildiğinde bileşen olasılığı koşullu olasılıkla bulunur."]}, d:"Sonuç kartı; 4 saniye.", hold:4,
 b:["Tekrar. Bağımsızlık bir hesap testidir.","Ayrık olaylar bağımlıdır.","Seri çarp; paralel arızaları çarp ve birden çıkar.","Karma sistemleri blok blok indirge.","Sistem hakkında bilgi gelince bileşen olasılıkları koşullu olasılıkla güncellenir."]},
{h:"Kapanış", t:"Sonraki adım", v:{type:"text",h:"Sıradaki video: Kesikli rastgele değişkenler",items:["Sonuçlara sayı vereceğiz: rastgele değişken, PMF ve CDF.","Tekrar: 3 bileşenli seri sistemde R = 0.729 ise (eşit p) her bileşenin p'si kaç? (cevap 0.9)","Ders notu şablonunu doldur."]}, d:"Kapanış maddeleri.",

],
