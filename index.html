<title>END252E Olasılık Çalışma Masası</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: three panes on wide screens (topic rail | lesson with video/summary/script tabs | tutor), stacked on phones. Video stage keeps one dark "projector" look in both themes. */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#15232b; --muted:#566872; --line:#d3dde2;
  --accent:#0f7c84; --accent-soft:#d8eef0; --done:#b98a12; --done-soft:#f6ecd0;
  --future:#8a98a0; --danger:#b4443a; --good:#2f7d4f; --good-soft:#dcefe3;
  --stage:#0e1b21; --stage-fg:#e9f1f3; --stage-mut:#8fa7ae; --stage-acc:#5fd3da; --stage-warm:#f0c349; --stage-red:#ff7b6e; --stage-good:#6fdc9a; --stage-line:rgba(255,255,255,.16); --stage-pane:rgba(255,255,255,.06);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f171b; --surface:#16222a; --ink:#e3ecef; --muted:#93a6ae; --line:#2a3a42;
  --accent:#4fc2c9; --accent-soft:#173a3e; --done:#e2b647; --done-soft:#3a3118;
  --future:#6d7f87; --danger:#e57a6f; --good:#6cc493; --good-soft:#18352a; --stage:#0a1316; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171b; --surface:#16222a; --ink:#e3ecef; --muted:#93a6ae; --line:#2a3a42;
  --accent:#4fc2c9; --accent-soft:#173a3e; --done:#e2b647; --done-soft:#3a3118;
  --future:#6d7f87; --danger:#e57a6f; --good:#6cc493; --good-soft:#18352a; --stage:#0a1316; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible,.stage:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code,.f{font-family:var(--f-mono);font-size:.92em}

.app{display:grid;grid-template-columns:250px minmax(0,1fr) 380px;gap:20px;max-width:1500px;margin:0 auto;padding-block:20px;align-items:start}

.brand{grid-column:1/3;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.brand-left{display:flex;align-items:center;gap:12px;min-width:0}
.die{width:38px;height:38px;border-radius:9px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);padding:6px;gap:2px;flex:none}
.die i{width:6px;height:6px;border-radius:50%;background:var(--surface);place-self:center}
.die i.o{visibility:hidden}
.brand h1{font-size:1.45rem}
.brand small{display:block;color:var(--muted);font-size:.82rem;letter-spacing:.02em}
.where{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.where label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.where select{font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:4px 8px;max-width:240px}
.progress{width:120px;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.progress b{display:block;height:100%;background:var(--done)}

.rail{position:sticky;top:16px;display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.rail h2{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-family:var(--f-body);font-weight:600;margin:4px 8px 6px}
.t{display:flex;gap:10px;align-items:baseline;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;width:100%}
.t:hover{background:var(--surface)}
.t.on{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.t .n{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);width:20px;flex:none}
.t .nm{flex:1;min-width:0;font-size:.92rem}
.t .st{width:8px;height:8px;border-radius:50%;flex:none;align-self:center}
.t.done .st{background:var(--done)}
.t.fut .st{background:none;box-shadow:inset 0 0 0 1.5px var(--future)}
.t.fut .nm{color:var(--muted)}
.cut{display:flex;align-items:center;gap:8px;margin:8px 8px;font-size:.72rem;color:var(--done);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.cut::before,.cut::after{content:"";flex:1;height:1px;background:var(--done)}
.mobile-nav{display:none}

.lesson{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 32px;min-width:0}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.pill{font-size:.72rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px}
.pill.done{background:var(--done-soft);color:var(--done)}
.pill.fut{background:var(--bg);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.pill.en{background:var(--accent-soft);color:var(--accent);text-transform:none;letter-spacing:0}
.lesson h2{font-size:1.9rem;margin-bottom:14px}
.lesson h3{font-size:1.1rem;margin:26px 0 10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:0 0 18px;overflow-x:auto}
.tab{background:none;border:0;padding:8px 12px;font-weight:600;font-size:.88rem;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.prose{max-width:68ch}
.prose p{margin:0 0 12px}
.prose ul{margin:0 0 12px;padding-left:20px}
.prose li{margin-bottom:4px}
.formulas{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.formulas li{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;background:var(--bg);border-radius:9px;padding:10px 14px;border:1px solid var(--line)}
.formulas .f{font-size:1rem;overflow-x:auto;white-space:nowrap}
.formulas .w{font-size:.85rem;color:var(--muted)}
.example{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.example .q{padding:14px 16px}
.example details{border-top:1px solid var(--line)}
.example summary{padding:10px 16px;cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
.example .a{padding:0 16px 14px}
.quiz{display:grid;gap:14px}
.qz{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.qz p{margin:0 0 10px;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 14px}
.opt:hover{border-color:var(--accent)}
.opt.right{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--danger);color:var(--danger)}
.why{margin-top:10px;font-size:.9rem;color:var(--muted)}
.ask-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px;padding-top:20px;border-top:1px dashed var(--line)}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;font-size:.9rem}
.btn.ghost{background:none;color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.future-note{background:var(--bg);border-radius:10px;padding:16px;border:1px dashed var(--future);color:var(--muted)}

/* ---- Video player ---- */
.player{display:grid;gap:10px}
.stage:fullscreen{aspect-ratio:auto;border-radius:0}
.stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:var(--stage);color:var(--stage-fg);border-radius:12px;overflow:hidden;container-type:inline-size;font-size:2.1cqw;line-height:1.45;font-family:var(--f-body)}
.stage .sc-head{position:absolute;top:1.8cqw;left:3cqw;right:3cqw;display:flex;justify-content:space-between;gap:1cqw;font-size:1.45cqw;color:var(--stage-mut);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.stage .sc-head span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stage .v{position:absolute;inset:5.2cqw 3cqw 2.4cqw;display:flex;flex-direction:column;justify-content:center;min-height:0}
.stage .vsvg{width:100%;height:100%;display:block}
.stage [data-s]{opacity:0;transform:translateY(.8cqw);transition:opacity .45s ease,transform .45s ease}
.stage [data-s].on{opacity:1;transform:none}
.stage svg [data-s]{transform:none}
.stage [data-only]{visibility:hidden;transform:none}
.stage [data-only].on{visibility:visible}
.gbar .gb{transform:scaleY(0);transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.gbar.on .gb{transform:scaleY(1)}
.vstack{position:relative;flex:1;min-height:0}
.vstack>[data-only]{position:absolute;inset:0}
.v-title{display:flex;flex-direction:column;justify-content:center;height:100%;gap:1.6cqw}
.v-title .vt-k{font-size:1.6cqw;color:var(--stage-acc);letter-spacing:.14em;text-transform:uppercase;font-weight:600}
.v-title h2{font-family:var(--f-display);font-size:6cqw;line-height:1.05;color:var(--stage-fg);font-weight:700;margin:0}
.v-title p{font-size:2.5cqw;color:var(--stage-mut);margin:0;max-width:42ch}
.vt-tags{display:flex;gap:.8cqw;flex-wrap:wrap}
.vt-tags span{border:1px solid var(--stage-line);border-radius:999px;padding:.3cqw 1.2cqw;font-size:1.5cqw;color:var(--stage-mut)}
.v-text h3,.v-form h3,.v-steps h3,.v-table h3,.v-list h3{font-family:var(--f-display);font-size:3cqw;margin:0 0 1.6cqw;color:var(--stage-fg);line-height:1.15}
.v-text ul{list-style:none;margin:0;padding:0;display:grid;gap:1.3cqw}
.v-text li{display:flex;gap:1.2cqw;align-items:flex-start;font-size:2.25cqw;line-height:1.4}
.v-text li::before{content:"";width:1cqw;height:1cqw;border-radius:50%;background:var(--stage-acc);flex:none;margin-top:1.05cqw}
.v-form{display:grid;gap:1.3cqw}
.fl{background:var(--stage-pane);border:1px solid var(--stage-line);border-radius:1cqw;padding:1.3cqw 2cqw}
.ff{font-family:var(--f-mono);font-size:2.9cqw;color:var(--stage-warm);white-space:nowrap;overflow-x:auto;line-height:1.3}
.fw{font-size:1.85cqw;color:var(--stage-mut);margin-top:.4cqw}
.v-cards{border:2px solid var(--stage-warm);border-radius:1.4cqw;padding:2cqw 2.6cqw;background:rgba(240,195,73,.07)}
.v-cards .vc-h{font-size:1.6cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-warm);font-weight:700;margin-bottom:1.2cqw}
.v-cards ol{margin:0;padding-left:2.4cqw;display:grid;gap:1cqw;font-size:2.15cqw}
.v-steps ol{list-style:none;margin:0;padding:0;display:grid;gap:1cqw}
.v-steps li{display:flex;gap:1.4cqw;align-items:flex-start;font-size:2.15cqw;line-height:1.4}
.v-steps .n{flex:none;width:3cqw;height:3cqw;border-radius:50%;background:var(--stage-acc);color:var(--stage);font-weight:700;font-size:1.7cqw;display:grid;place-items:center;margin-top:.15cqw}
.v-steps.wrong .n{background:var(--stage-red)}
.v-steps.wrong h3{color:var(--stage-red)}
.stage code{font-family:var(--f-mono);color:var(--stage-warm);font-size:.95em;background:none}
.v-cmp .cols{display:grid;grid-template-columns:1fr 1fr;gap:2cqw}
.v-cmp .col{background:var(--stage-pane);border:1px solid var(--stage-line);border-radius:1.2cqw;padding:1.6cqw 2cqw;min-width:0}
.v-cmp .col.bad{border-color:var(--stage-red)}
.v-cmp .col.bad h4{color:var(--stage-red)}
.v-cmp h4{margin:0 0 1cqw;font-family:var(--f-display);font-size:2.4cqw;color:var(--stage-good)}
.v-cmp ul{margin:0;padding-left:2cqw;font-size:1.9cqw;display:grid;gap:.6cqw}
.v-cmp .verdict{margin-top:1.6cqw;font-size:2.1cqw;color:var(--stage-warm);font-weight:600}
.v-table .tw{overflow-x:auto}
.v-table table{border-collapse:collapse;width:100%;font-size:2cqw}
.v-table th,.v-table td{border:1px solid var(--stage-line);padding:.8cqw 1.2cqw;text-align:left;vertical-align:top}
.v-table th{color:var(--stage-acc);font-weight:600;background:var(--stage-pane)}
.v-table .rh{color:var(--stage-warm);font-weight:600}
.v-table .note{margin:1.2cqw 0 0;color:var(--stage-mut);font-size:1.9cqw}
.v-list .chips{display:flex;flex-wrap:wrap;gap:1cqw}
.v-list .ch{font-family:var(--f-mono);font-size:2.4cqw;padding:.8cqw 1.6cqw;border-radius:.8cqw;background:var(--stage-pane);border:1px solid var(--stage-line)}
.v-list .ch.hl{background:var(--stage-acc);color:var(--stage);border-color:var(--stage-acc)}
.v-list .ch.hl.warm{background:var(--stage-warm)}
.v-list .ch.hl.red{background:var(--stage-red)}
.v-list .ch.hl.good{background:var(--stage-good)}
.v-list .lbl{margin:1.6cqw 0 0;font-size:2.2cqw;color:var(--stage-warm);font-weight:600}
.fo{font-family:'Inter',system-ui,sans-serif;color:#e9f1f3;font-size:25px;line-height:1.35}
.fo-h{font-weight:700;font-size:29px;margin-bottom:10px}
.fo-s{color:#8fa7ae;font-size:23px}
.v-think{display:flex;flex-direction:column;gap:1.4cqw;height:100%;justify-content:center;padding-right:11cqw}
.th-k{font-size:1.6cqw;letter-spacing:.12em;text-transform:uppercase;color:var(--stage-warm);font-weight:700}
.th-q{font-size:2.5cqw;line-height:1.4}
.th-p{margin:0;padding-left:0;list-style:none;font-size:2.2cqw;display:grid;gap:.5cqw}
.th-cd{position:absolute;right:0;bottom:0;width:9cqw;height:9cqw;display:grid;place-items:center}
.th-cd svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.th-cd .bgc{fill:none;stroke:var(--stage-line);stroke-width:6}
.th-cd .fgc{fill:none;stroke:var(--stage-warm);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.th-n{font-family:var(--f-display);font-size:3.4cqw;font-weight:700;position:relative}
.v-end{display:flex;flex-direction:column;align-items:flex-start;gap:1.4cqw;height:100%;justify-content:center}
.v-end h2{font-family:var(--f-display);font-size:4.5cqw;margin:0}
.v-end p{margin:0;color:var(--stage-mut);font-size:2.1cqw}
.v-end .row{display:flex;gap:1cqw;flex-wrap:wrap}
.v-end button{font-size:1.9cqw;padding:.8cqw 1.8cqw;border-radius:.8cqw;border:1px solid var(--stage-acc);background:var(--stage-acc);color:var(--stage);font-weight:600}
.v-end button.g{background:none;color:var(--stage-acc)}
.cap{min-height:4.6em;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.95rem;display:grid;gap:4px}
.cap p{margin:0;transition:opacity .3s}
.cap p.next{opacity:.38}
.cap p.past{opacity:.72}
.cap p.now{font-weight:500}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ctrl .ib{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.9rem;min-width:38px}
.ctrl .ib.main{background:var(--accent);color:var(--surface);border-color:var(--accent);font-weight:700;min-width:92px}
.ctrl .ib.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.ctrl .sp{flex:1}
.ctrl select{font:inherit;font-size:.85rem;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 6px}
.scinfo{font-size:.82rem;color:var(--muted)}
.pbar{display:flex;gap:2px;height:8px}
.pbar .seg{flex:1;background:var(--line);border-radius:2px;cursor:pointer;border:0;padding:0;min-width:3px}
.pbar .seg.done{background:var(--accent)}
.pbar .seg.cur{background:var(--done)}
.pbar .seg.secstart{margin-left:5px}
.vnote{font-size:.8rem;color:var(--muted);min-height:1.2em}

/* ---- Script view ---- */
.script{display:grid;gap:22px;max-width:78ch}
.script h3{font-size:1.15rem;margin:0 0 8px}
.kunye{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.92rem;margin:0}
.kunye dt{color:var(--muted);font-weight:600}
.kunye dd{margin:0}
.scene{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;font-size:.92rem}
.scene .sh{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline}
.scene .sh b{font-family:var(--f-display);font-size:1rem}
.scene .sh .dur{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.scene .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:2px}
.scene ul{margin:0;padding-left:18px}
.scene p{margin:0 0 4px}
.scene .os{display:flex;flex-wrap:wrap;gap:4px}
.scene .os span{font-family:var(--f-mono);font-size:.78rem;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 7px;max-width:100%;overflow-wrap:anywhere}
.sec-h{font-family:var(--f-display);font-size:1rem;color:var(--muted);margin:10px 0 0;padding-top:10px;border-top:1px dashed var(--line)}
.notes-t{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.notes-t li{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:.92rem}
.blank{display:inline-block;min-width:90px;border-bottom:2px solid var(--accent);text-align:center;color:var(--accent);font-weight:600;padding:0 6px}
.blank.hide{color:transparent}
.script .hed{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}

/* ---- Tutor ---- */
.tutor{grid-column:3;grid-row:1/span 2;align-self:start;position:sticky;top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;height:calc(100vh - 32px);min-height:480px;min-width:0}
.tutor header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.tutor header h2{font-size:1.05rem}
.tutor header p{margin:0;font-size:.78rem;color:var(--muted)}
.icon-btn{background:none;border:1px solid var(--line);border-radius:7px;padding:4px 9px;font-size:.78rem;color:var(--muted);white-space:nowrap}
.log{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;border-radius:12px;padding:9px 13px;font-size:.92rem;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--surface);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.a p{margin:0 0 8px}.msg.a p:last-child{margin:0}
.msg.a ul,.msg.a ol{margin:0 0 8px;padding-left:20px}
.msg.a code{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:1px 4px}
.msg.a h4{font-family:var(--f-display);margin:6px 0 4px;font-size:.98rem}
.msg.sys{align-self:center;background:none;color:var(--muted);font-size:.8rem;text-align:center;padding:2px}
.thinking{color:var(--muted);font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chip{background:var(--accent-soft);color:var(--accent);border:0;border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:500}
.compose{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
.compose textarea{flex:1;min-width:0;resize:none;font:inherit;font-size:.92rem;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-height:140px}

<script>
/* f: [formül, kısa not, Türkçe okunuşu]   quiz: d = kolay | orta | zor */
const T = [
{ id:"s1", en:"Sample space & events", title:"Örnek uzayı ve olaylar",
  body:`<p>Bir deney yaptığını düşün: zar atmak, para atmak, üretim hattından bir parça çekmek. <b>Örnek uzayı (S)</b>, bu deneyin <b>olabilecek bütün sonuçlarının</b> listesidir.</p>
  <p><b>Olay (event)</b>, bu sonuçlardan bir kısmını seçmektir. Örneğin zar için S = {1,2,3,4,5,6}; “çift gelmesi” olayı A = {2,4,6}.</p>
  <ul><li><b>Birleşim A∪B</b>: A <i>veya</i> B (en az biri) olur.</li><li><b>Kesişim A∩B</b>: A <i>ve</i> B birlikte olur.</li><li><b>Tümleyen Aᶜ</b>: A olmaz.</li><li><b>Ayrık (mutually exclusive)</b>: A∩B = ∅, yani ikisi aynı anda olamaz.</li></ul>`,
  f:[["A ∪ B,  A ∩ B,  Aᶜ","veya, ve, değil","A veya B (en az biri olur); A ve B (ikisi birden olur); A olmaz (A'nın dışı)."],
     ["(A ∪ B)ᶜ = Aᶜ ∩ Bᶜ","De Morgan 1","“A veya B” olmaması, A'nın olmaması VE B'nin olmaması demektir."],
     ["(A ∩ B)ᶜ = Aᶜ ∪ Bᶜ","De Morgan 2","“A ve B birlikte” olmaması, A'nın olmaması VEYA B'nin olmaması demektir."]],
  ex:{q:"İki kez para atılıyor. Örnek uzayını yaz. A = “en az bir Yazı” olayı nedir?",a:"S = {YY, YT, TY, TT} (Y: yazı, T: tura). A = {YY, YT, TY}. Aᶜ = {TT}, yani “hiç yazı gelmemesi”."},
  quiz:[{d:"kolay",q:"Zar atılıyor. A = çift sayı, B = {1,2}. A ∩ B nedir?",o:["{2}","{1,2,4,6}","{4,6}","∅"],c:0,w:"Hem çift hem {1,2} içinde olan tek sayı 2."},
        {d:"kolay",q:"İki kez para atılıyor. Örnek uzayında kaç sonuç vardır?",o:["2","3","4","8"],c:2,w:"Her atış için 2 seçenek: 2·2 = 4 → {YY, YT, TY, TT}."},
        {d:"orta",q:"A ve B ayrık (mutually exclusive) olaylar ise hangisi kesinlikle doğrudur?",o:["A ∩ B = ∅","A ∪ B = S","A = Bᶜ","P(A) = P(B)"],c:0,w:"Ayrık olayların ortak sonucu yoktur; kesişim boş kümedir. Diğerleri genel olarak doğru değildir."},
        {d:"zor",q:"İki zar atılıyor. A = “toplam 9”, B = “en az bir zar 5”. A ∩ B kaç elemanlıdır?",o:["1","2","3","4"],c:1,w:"A = {(3,6),(4,5),(5,4),(6,3)}. İçinde 5 olanlar: (4,5) ve (5,4) → 2 eleman. Zarlar ayırt edilebilir, (4,5) ≠ (5,4)."}]},
{ id:"s2", en:"Axioms of probability", title:"Olasılık aksiyomları",
  body:`<p>Olasılık, bir olaya 0 ile 1 arasında bir sayı vermektir. Bunun üç temel kuralı (aksiyom) vardır:</p>
  <ul><li>Her olay için P(A) ≥ 0.</li><li>P(S) = 1 (bir şey mutlaka olur).</li><li>Ayrık olaylarda olasılıklar toplanır: P(A∪B) = P(A) + P(B).</li></ul>
  <p>Bütün diğer kurallar bunlardan çıkar. En çok kullanacağın ikisi: tümleyen kuralı ve toplama kuralı. Sonuçlar <b>eşit olasılıklı</b> ise olasılık sadece “istenen / toplam” sayımıdır.</p>`,
  f:[["P(Aᶜ) = 1 − P(A)","tümleyen kuralı","A'nın olmama olasılığı = 1 eksi A'nın olma olasılığı."],
     ["P(A ∪ B) = P(A) + P(B) − P(A ∩ B)","toplama kuralı","A veya B'nin olasılığı = A'nın olasılığı + B'nin olasılığı − ikisinin birlikte olma olasılığı (ortak kısım iki kez sayılmasın diye çıkarılır)."],
     ["P(A) = |A| / |S|","eşit olasılıklı sonuçlar","Olasılık = istenen sonuç sayısı bölü toplam sonuç sayısı. Sadece bütün sonuçlar eşit olasılıklıysa geçerli."]],
  ex:{q:"P(A)=0.5, P(B)=0.4, P(A∩B)=0.2. P(A∪B) ve P(ikisi de olmaz) nedir?",a:"P(A∪B) = 0.5 + 0.4 − 0.2 = 0.7. İkisi de olmaz = (A∪B)ᶜ, yani 1 − 0.7 = 0.3."},
  quiz:[{d:"kolay",q:"P(A) = 0.3 ise P(Aᶜ) kaçtır?",o:["0.3","0.7","1.3","0"],c:1,w:"Tümleyen kuralı: 1 − 0.3 = 0.7."},
        {d:"kolay",q:"A ve B ayrık, P(A)=0.2, P(B)=0.5. P(A∪B)?",o:["0.1","0.6","0.7","0.5"],c:2,w:"Ayrıksa kesişim 0: 0.2 + 0.5 = 0.7."},
        {d:"orta",q:"P(A)=0.6, P(B)=0.5, P(A∪B)=0.8. P(A∩B) kaçtır?",o:["0.1","0.3","0.2","0.4"],c:1,w:"Toplama kuralını ters çevir: P(A∩B) = 0.6 + 0.5 − 0.8 = 0.3."},
        {d:"zor",q:"P(A)=0.5, P(B)=0.4, P(A∩B)=0.15. “Tam olarak biri” gerçekleşme olasılığı?",o:["0.75","0.6","0.45","0.9"],c:1,w:"Tam olarak biri = P(A) + P(B) − 2·P(A∩B) = 0.5 + 0.4 − 0.30 = 0.6. (Birleşim 0.75'ten kesişim 0.15 çıkarılır.)"}]},
{ id:"s3", en:"Counting: permutations & combinations", title:"Sayma yöntemleri",
  body:`<p>Eşit olasılıklı durumlarda “kaç farklı yol var?” sorusunu cevaplamak gerekir.</p>
  <ul><li><b>Çarpma kuralı</b>: 1. adımda a, 2. adımda b seçenek varsa toplam a·b yol.</li><li><b>Permütasyon</b>: <i>sıra önemli</i> (ilk, ikinci, üçüncü…).</li><li><b>Kombinasyon</b>: <i>sıra önemsiz</i> (bir grup, komite, el).</li></ul>
  <p>Kendine sor: “Ali-Ayşe ile Ayşe-Ali farklı mı?” Farklıysa permütasyon, aynıysa kombinasyon.</p>`,
  f:[["n! = n·(n−1)·…·1","faktöriyel","n faktöriyel: n nesneyi sıraya dizmenin yol sayısı (n'den 1'e kadar çarp). 0! = 1."],
     ["P(n,k) = n! / (n−k)!","permütasyon","n nesneden k tanesini SIRALI seçmenin yol sayısı (1., 2., … diye sıra var)."],
     ["C(n,k) = n! / (k!·(n−k)!)","kombinasyon","n nesneden k tanesini SIRASIZ seçmenin yol sayısı (“n'in k'lısı”); permütasyonu k! ile böl."]],
  ex:{q:"10 parçanın 3’ü kusurlu. Rastgele 2 parça seçiliyor. İkisinin de kusurlu olma olasılığı?",a:"Toplam seçim: C(10,2) = 45. İkisi kusurlu: C(3,2) = 3. Olasılık = 3/45 = <b>1/15 ≈ 0.067</b>."},
  quiz:[{d:"kolay",q:"4 farklı kitap rafa kaç farklı şekilde dizilir?",o:["4","16","24","12"],c:2,w:"4! = 24."},
        {d:"kolay",q:"10 kişiden 3 kişilik komite kaç şekilde seçilir?",o:["720","120","30","1000"],c:1,w:"Sıra önemsiz: C(10,3) = 120."},
        {d:"orta",q:"6 kişi arasından bir başkan ve bir başkan yardımcısı kaç farklı şekilde seçilir?",o:["15","30","36","720"],c:1,w:"Görevler farklı → sıra önemli: P(6,2) = 6·5 = 30."},
        {d:"zor",q:"12 parçanın 4'ü kusurlu. Geri koymadan 3 parça seçiliyor. Tam 1 kusurlu olma olasılığı?",o:["0.509","0.333","0.255","0.127"],c:0,w:"C(4,1)·C(8,2) / C(12,3) = 4·28/220 = 112/220 ≈ 0.509."}]},
{ id:"s4", en:"Conditional probability", title:"Koşullu olasılık",
  body:`<p><b>P(A|B)</b>: “B’nin olduğunu biliyorken A’nın olasılığı”. Yeni bilgi gelince örnek uzayı küçülür; artık sadece B’nin içine bakarız.</p>
  <p>Örnek: Zar atıldı ve “çift geldi” dendi. Artık sadece {2,4,6} mümkün. 6 gelme olasılığı 1/6 değil, <b>1/3</b>.</p>`,
  f:[["P(A | B) = P(A ∩ B) / P(B)","P(B) > 0","B'nin olduğu bilinirken A'nın olasılığı = ikisinin birlikte olma olasılığı bölü B'nin olasılığı (dünya B'ye küçüldü)."],
     ["P(A ∩ B) = P(A | B) · P(B)","çarpma kuralı","A ve B'nin birlikte olma olasılığı = önce B'nin olasılığı, çarpı B olmuşken A'nın olasılığı. Ard arda çekilişlerde kullanılır."]],
  ex:{q:"Bir kutuda 5 kırmızı, 3 mavi top var. Geri koymadan 2 top çekiliyor. İkisinin de kırmızı olma olasılığı?",a:"P(1. kırmızı) = 5/8. 1. kırmızıysa kalan 4 kırmızı, 7 top: P(2. kırmızı | 1. kırmızı) = 4/7. Çarpma kuralı: 5/8 · 4/7 = <b>20/56 ≈ 0.357</b>."},
  quiz:[{d:"kolay",q:"P(A∩B) = 0.12, P(B) = 0.4. P(A|B)?",o:["0.048","0.3","0.52","0.12"],c:1,w:"0.12 / 0.4 = 0.3."},
        {d:"kolay",q:"Zar atıldı ve “çift geldi” dendi. 6 gelmiş olma olasılığı?",o:["1/6","1/3","1/2","2/3"],c:1,w:"İndirgenmiş örnek uzayı {2,4,6}; üçte biri 6."},
        {d:"orta",q:"5 kırmızı 3 mavi top; geri koymadan 2 top. İkisinin de mavi olma olasılığı?",o:["3/28","9/64","3/8","1/4"],c:0,w:"Çarpma kuralı: (3/8)·(2/7) = 6/56 = 3/28."},
        {d:"zor",q:"M1: 120 parça (6 kusurlu), M2: 80 parça (10 kusurlu). Rastgele parça SAĞLAM çıktı. M1'den gelmiş olma olasılığı?",o:["0.620","0.95","0.375","0.6"],c:0,w:"Sağlam sütunu: 114 + 70 = 184; P(M1 | sağlam) = 114/184 ≈ 0.620."}]},
{ id:"s5", en:"Total probability & Bayes' theorem", title:"Toplam olasılık ve Bayes",
  body:`<p>Sonuç birkaç farklı “yoldan” gelebiliyorsa (örneğin parça 1. makineden ya da 2. makineden), <b>toplam olasılık</b> her yolun katkısını toplar.</p>
  <p><b>Bayes</b> ise tersini sorar: “Parça kusurlu çıktı. Hangi makineden gelmiş olma ihtimali ne?” Yani sonucu görüp sebebi tahmin ederiz.</p>
  <p>İpucu: Bu tip sorularda bir <b>ağaç diyagramı</b> çiz. Dallar çarpılır, uçlar toplanır.</p>`,
  f:[["P(A) = Σ P(A | Bᵢ) · P(Bᵢ)","toplam olasılık (B₁, B₂, … parçalanış)","A'nın olasılığı = her yol (Bᵢ) için: o yolun olasılığı çarpı o yoldan A'ya gitme olasılığı; sonra hepsini topla."],
     ["P(Bⱼ | A) = P(A | Bⱼ)·P(Bⱼ) / P(A)","Bayes teoremi","A görüldükten sonra sebebin Bⱼ olma olasılığı = Bⱼ yolundan A'ya gitme olasılığı bölü A'ya giden bütün yolların toplamı."]],
  ex:{q:"M1 üretimin %60’ını yapıyor, %2’si kusurlu. M2 %40’ını yapıyor, %5’i kusurlu. Rastgele parça kusurluysa M2’den gelmiş olma olasılığı?",a:"P(K) = 0.6·0.02 + 0.4·0.05 = 0.012 + 0.020 = 0.032.<br>P(M2|K) = 0.020 / 0.032 = <b>0.625</b>. Daha az üretmesine rağmen kusurluların çoğu M2’den geliyor."},
  quiz:[{d:"kolay",q:"Yukarıdaki örnekte P(M1 | kusurlu) kaçtır?",o:["0.6","0.012","0.375","0.02"],c:2,w:"0.012 / 0.032 = 0.375 (ya da 1 − 0.625)."},
        {d:"kolay",q:"P(B)=0.3, P(A|B)=0.8, P(A|Bᶜ)=0.2. P(A) kaçtır?",o:["0.38","0.5","0.24","1.0"],c:0,w:"Toplam olasılık: 0.8·0.3 + 0.2·0.7 = 0.24 + 0.14 = 0.38."},
        {d:"orta",q:"Hastalık sıklığı %10; test hastayı 0.95 ile yakalıyor, sağlıklıda 0.10 yanlış pozitif. Pozitif çıkan kişinin hasta olma olasılığı?",o:["0.51","0.95","0.10","0.19"],c:0,w:"P(+) = 0.1·0.95 + 0.9·0.10 = 0.185; P(H|+) = 0.095/0.185 ≈ 0.51."},
        {d:"zor",q:"Üç makine üretimin %50, %30, %20'sini yapıyor; kusur oranları %1, %2, %4. Kusurlu bir parçanın 3. makineden gelme olasılığı?",o:["0.421","0.263","0.316","0.2"],c:0,w:"P(K) = 0.005 + 0.006 + 0.008 = 0.019; P(M3|K) = 0.008/0.019 ≈ 0.421."}]},
{ id:"s6", en:"Independence", title:"Bağımsızlık",
  body:`<p>A ve B <b>bağımsız</b> ise birinin olması diğerinin olasılığını hiç değiştirmez. P(A|B) = P(A).</p>
  <p>Dikkat: <b>Ayrık ≠ bağımsız</b>. Ayrık olaylar birbirini engeller (biri olursa diğeri kesin olmaz), bu yüzden tam tersine çok bağımlıdır.</p>
  <p>Mühendislikte sık kullanım: <b>seri sistem</b> (hepsi çalışmalı) ve <b>paralel sistem</b> (en az biri çalışmalı) güvenilirliği.</p>`,
  f:[["P(A ∩ B) = P(A) · P(B)","bağımsızlığın tanımı","A ve B bağımsızsa ikisinin birlikte olma olasılığı = olasılıklarının çarpımı. Eşdeğeri: B'yi öğrenmek A'nın olasılığını değiştirmez."],
     ["Seri: R = p₁ · p₂ · … · pₙ","hepsi çalışmalı","Seri sistemin güvenilirliği = bileşenlerin çalışma olasılıklarının çarpımı (hepsi çalışmak zorunda)."],
     ["Paralel: R = 1 − (1−p₁)(1−p₂)…(1−pₙ)","en az biri çalışmalı","Paralel sistemin güvenilirliği = 1 eksi hepsinin birden arızalanma olasılığı (arıza olasılıklarını çarp, 1'den çıkar)."]],
  ex:{q:"İki bağımsız bileşen, her biri 0.9 olasılıkla çalışıyor. Seri ve paralel bağlanınca sistem güvenilirliği?",a:"Seri: 0.9 · 0.9 = <b>0.81</b>. Paralel: 1 − 0.1 · 0.1 = <b>0.99</b>."},
  quiz:[{d:"kolay",q:"A ve B bağımsız, P(A)=0.5, P(B)=0.4. P(A∩B)?",o:["0.9","0.2","0.1","0"],c:1,w:"0.5 · 0.4 = 0.2."},
        {d:"kolay",q:"P(A)=0.3, P(B)=0.5 ve A, B ayrık. Bağımsız mıdır?",o:["Evet","Hayır"],c:1,w:"P(A∩B)=0 ama P(A)P(B)=0.15. Eşit değil → bağımsız değil. Ayrık olaylar bağımlıdır."},
        {d:"orta",q:"Üç bağımsız bileşen paralel; her biri 0.8 ile çalışıyor. Sistem güvenilirliği?",o:["0.992","0.512","0.8","0.96"],c:0,w:"Sistem ancak üçü de arızalanırsa durur: 1 − 0.2³ = 0.992."},
        {d:"zor",q:"A (0.9) seri; ardından B (0.8) ve C (0.8) paralel blok. Bileşenler bağımsız. Sistem güvenilirliği?",o:["0.864","0.576","0.72","0.96"],c:0,w:"Paralel blok: 1 − 0.2·0.2 = 0.96; seri: 0.9 · 0.96 = 0.864."}]},
{ id:"s7", en:"Discrete random variables, PMF, CDF", title:"Kesikli rastgele değişkenler",
  body:`<p><b>Rastgele değişken (X)</b>, deneyin sonucuna bir sayı veren kuraldır. Örnek: 2 para atışında X = “yazı sayısı”.</p>
  <p><b>Kesikli (discrete)</b>: X’in alabileceği değerler sayılabilir (0, 1, 2, …).</p>
  <ul><li><b>PMF p(x)</b>: X’in tam olarak x olma olasılığı. Hepsi toplanınca 1 eder.</li><li><b>CDF F(x)</b>: X’in x veya daha küçük olma olasılığı. Merdiven gibi artar.</li></ul>`,
  f:[["p(x) = P(X = x),   Σ p(x) = 1","olasılık kütle fonksiyonu (PMF)","p(x): X'in tam olarak x değerini alma olasılığı. Bütün değerlerin olasılıkları toplanınca 1 eder; hiçbiri negatif olamaz."],
     ["F(x) = P(X ≤ x) = Σ_{t ≤ x} p(t)","birikimli dağılım fonksiyonu (CDF)","F(x): X'in x veya daha küçük olma olasılığı; x'e kadar olan p değerlerini topla. Kesiklide merdiven şeklindedir."],
     ["P(a < X ≤ b) = F(b) − F(a)","aralık olasılığı","X'in a ile b arasında (b dahil, a hariç) olma olasılığı = b'ye kadar biriken eksi a'ya kadar biriken olasılık."]],
  ex:{q:"2 para atılıyor, X = yazı sayısı. PMF’yi ve F(1)’i bul.",a:"p(0)=1/4 (TT), p(1)=1/2 (YT, TY), p(2)=1/4 (YY). F(1) = p(0)+p(1) = <b>3/4</b>."},
  quiz:[{d:"kolay",q:"p(0)=0.2, p(1)=0.5, p(2)=c. c kaç olmalı?",o:["0.5","0.3","0.2","1"],c:1,w:"Toplam 1 olmalı: 1 − 0.7 = 0.3."},
        {d:"kolay",q:"2 para, X = yazı sayısı. F(1) = P(X ≤ 1) kaçtır?",o:["1/4","1/2","3/4","1"],c:2,w:"F(1) = p(0) + p(1) = 1/4 + 1/2 = 3/4."},
        {d:"orta",q:"p(1)=0.2, p(2)=0.3, p(3)=0.5. P(X ≥ 2) kaçtır?",o:["0.8","0.5","0.3","0.2"],c:0,w:"p(2) + p(3) = 0.8; ya da 1 − F(1) = 1 − 0.2."},
        {d:"zor",q:"4 sağlam 2 kusurlu parça; geri koymadan 2 parça çekiliyor. X = kusurlu sayısı. P(X = 1)?",o:["8/15","1/3","1/15","2/5"],c:0,w:"C(2,1)·C(4,1) / C(6,2) = 8/15 ≈ 0.533. Bağımsız gibi çarpmak (2/6·4/6·2) yanlış olur."}]},
{ id:"s8", en:"Expected value & variance", title:"Beklenen değer ve varyans",
  body:`<p><b>Beklenen değer E[X]</b>: Deneyi çok kez tekrarlasan ortalama ne çıkar? Her değer, olasılığıyla ağırlıklandırılıp toplanır.</p>
  <p><b>Varyans Var(X)</b>: Değerler ortalamadan ne kadar <i>dağınık</i>? <b>Standart sapma σ</b> = √Var, aynı birimde dağınıklık.</p>
  <p>Kolay hesap için: önce E[X], sonra E[X²], sonra Var = E[X²] − (E[X])².</p>`,
  f:[["E[X] = Σ x · p(x)","beklenen değer (ortalama)","Her değeri olasılığıyla çarp ve topla: ağırlıklı ortalama. Uzun vadede gözlenen ortalama budur."],
     ["Var(X) = E[X²] − (E[X])²","varyans (pratik formül)","Varyans = karelerin beklenen değeri eksi beklenen değerin karesi. Standart sapma = varyansın karekökü."],
     ["E[aX + b] = a·E[X] + b","doğrusallık","X'i a ile çarpıp b eklersen ortalama da a ile çarpılır, b eklenir."],
     ["Var(aX + b) = a² · Var(X)","dönüşümde varyans","Sabit ekleme (b) dağınıklığı değiştirmez; a ile çarpma varyansı a² ile çarpar (standart sapmayı |a| ile)."]],
  ex:{q:"2 para atışı, X = yazı sayısı. E[X] ve Var(X)?",a:"E[X] = 0·¼ + 1·½ + 2·¼ = 1.<br>E[X²] = 0·¼ + 1·½ + 4·¼ = 1.5.<br>Var(X) = 1.5 − 1² = <b>0.5</b>."},
  quiz:[{d:"kolay",q:"E[X]=3, Var(X)=4 ve Y = 2X + 1. E[Y] ve Var(Y)?",o:["7 ve 16","7 ve 9","6 ve 8","7 ve 8"],c:0,w:"E[Y] = 2·3+1 = 7. Var(Y) = 2²·4 = 16."},
        {d:"kolay",q:"X, 0 ve 2 değerlerini 0.5'er olasılıkla alıyor. E[X] kaçtır?",o:["0","1","2","0.5"],c:1,w:"0·0.5 + 2·0.5 = 1."},
        {d:"orta",q:"Aynı X için (0 ve 2, 0.5'er) Var(X) kaçtır?",o:["1","2","0.5","0.25"],c:0,w:"E[X²] = 0·0.5 + 4·0.5 = 2; Var = 2 − 1² = 1."},
        {d:"zor",q:"X: −10 (0.2), 0 (0.5), 20 (0.3). Var(X) kaçtır?",o:["124","140","16","108"],c:0,w:"E[X] = −2 + 0 + 6 = 4; E[X²] = 20 + 0 + 120 = 140; Var = 140 − 16 = 124."}]},
{ id:"s9", en:"Bernoulli & Binomial distribution", title:"Bernoulli ve Binom dağılımı",
  body:`<p><b>Bernoulli</b>: tek bir deneme, sonuç ya başarı (1) ya başarısızlık (0). P(başarı) = p.</p>
  <p><b>Binom</b>: Aynı Bernoulli denemesini <b>n kez, bağımsız</b> yap. X = başarı sayısı.</p>
  <p>Ne zaman binom? Sabit sayıda deneme (n), her denemede aynı p, denemeler bağımsız, ve “kaç başarı?” soruluyor.</p>`,
  f:[["P(X = k) = C(n,k) · pᵏ · (1−p)ⁿ⁻ᵏ","k = 0, 1, …, n","n denemede tam k başarı olasılığı = (k başarının yerleşebileceği dizilim sayısı) × (k başarının olasılığı) × (n−k başarısızlığın olasılığı)."],
     ["E[X] = n·p","ortalama başarı sayısı","Beklenen başarı sayısı = deneme sayısı çarpı her denemedeki başarı olasılığı."],
     ["Var(X) = n·p·(1−p)","varyans","Varyans = deneme sayısı × başarı olasılığı × başarısızlık olasılığı."]],
  ex:{q:"Parçaların %10’u kusurlu. 5 parça seçiliyor. Tam 1 kusurlu olma olasılığı?",a:"n=5, p=0.1, k=1: C(5,1)·0.1¹·0.9⁴ = 5 · 0.1 · 0.6561 = <b>0.328</b>."},
  quiz:[{d:"kolay",q:"n=20, p=0.3 olan binomun beklenen değeri?",o:["0.3","6","4.2","20"],c:1,w:"np = 20 · 0.3 = 6."},
        {d:"kolay",q:"Adil para 4 kez atılıyor. Tam 2 yazı olasılığı?",o:["0.375","0.25","0.5","0.0625"],c:0,w:"C(4,2)·(0.5)⁴ = 6/16 = 0.375."},
        {d:"orta",q:"Parçaların %10'u kusurlu; 5 parça bağımsız seçiliyor. En az 1 kusurlu olasılığı?",o:["0.41","0.59","0.33","0.5"],c:0,w:"1 − P(0) = 1 − 0.9⁵ = 1 − 0.590 = 0.41."},
        {d:"zor",q:"X ~ Binom(10, 0.2). P(X ≤ 1) kaçtır?",o:["0.376","0.268","0.107","0.624"],c:0,w:"0.8¹⁰ + 10·0.2·0.8⁹ = 0.107 + 0.268 = 0.376."}]},
{ id:"s10", en:"Geometric distribution", title:"Geometrik dağılım",
  body:`<p>Binomda deneme sayısı sabitti. <b>Geometrikte</b> ise “ilk başarıya kadar kaç deneme?” sorusunu sorarız.</p>
  <p>Örnek: Satış elemanı her aramada %20 ihtimalle satış yapıyor. İlk satış kaçıncı aramada?</p>
  <p>Özel bir özelliği var: <b>hafızasızlık (memoryless)</b>. 5 kez başarısız olmuş olman, sonraki denemelerin şansını değiştirmez.</p>`,
  f:[["P(X = k) = (1−p)ᵏ⁻¹ · p","k = 1, 2, 3, …","İlk başarının tam k. denemede olma olasılığı = ilk k−1 denemenin başarısız olması × k. denemenin başarılı olması."],
     ["E[X] = 1/p","ortalama deneme sayısı","İlk başarıya kadar beklenen deneme sayısı = 1 bölü başarı olasılığı (p = 0.2 ise ortalama 5 deneme)."],
     ["Var(X) = (1−p)/p²","varyans","Varyans = başarısızlık olasılığı bölü başarı olasılığının karesi."],
     ["P(X > k) = (1−p)ᵏ","ilk k deneme başarısız","İlk başarının k. denemeden sonra gelme olasılığı = ilk k denemenin hepsinin başarısız olma olasılığı."]],
  ex:{q:"p = 0.2. İlk başarının tam 3. denemede olma olasılığı?",a:"İlk iki başarısız, üçüncü başarılı: 0.8 · 0.8 · 0.2 = <b>0.128</b>."},
  quiz:[{d:"kolay",q:"p = 0.25 ise ilk başarı için ortalama kaç deneme gerekir?",o:["0.25","4","3","12"],c:1,w:"1/p = 4."},
        {d:"kolay",q:"p = 0.2. İlk başarının 3. denemede olma olasılığı?",o:["0.128","0.2","0.16","0.512"],c:0,w:"0.8² · 0.2 = 0.128."},
        {d:"orta",q:"p = 0.3. İlk başarı için 3'ten fazla deneme gerekme olasılığı?",o:["0.343","0.657","0.147","0.3"],c:0,w:"P(X > 3) = 0.7³ = 0.343: ilk üç deneme de başarısız."},
        {d:"zor",q:"p = 0.1. İlk 4 deneme başarısız geçti. Sonraki 2 denemede de başarı olmama olasılığı?",o:["0.81","0.531","0.9","0.19"],c:0,w:"Hafızasızlık: P(X > 6 | X > 4) = P(X > 2) = 0.9² = 0.81."}]},
{ id:"s11", en:"Poisson distribution", title:"Poisson dağılımı",
  body:`<p><b>Poisson</b>, belli bir zaman/alan aralığında bir olayın <b>kaç kez</b> olduğunu sayar: bir saatte gelen çağrı, bir sayfadaki yazım hatası, bir günde gelen müşteri.</p>
  <p>Tek parametresi <b>λ (lambda)</b>: o aralıktaki ortalama sayı. Aralık değişirse λ da orantılı değişir (saatte 3 ise 2 saatte 6).</p>
  <p>Ayrıca n büyük, p küçükse binom yerine Poisson kullanılabilir (λ = np).</p>`,
  f:[["P(X = k) = e^(−λ) · λᵏ / k!","k = 0, 1, 2, …","Aralıkta tam k olay olma olasılığı. λ = o aralıktaki ortalama olay sayısı (hız × aralık uzunluğu). P(X = 0) = e^(−λ)."],
     ["E[X] = Var(X) = λ","ortalama ve varyans eşit","Poisson'da ortalama da varyans da λ'dır."],
     ["Binom ≈ Poisson(λ = n·p)","n büyük, p küçükken","Deneme sayısı büyük, başarı olasılığı küçükse binom yerine λ = n·p alınarak Poisson kullanılabilir."]],
  ex:{q:"Bir çağrı merkezine saatte ortalama 3 çağrı geliyor. Bir saatte hiç çağrı gelmeme olasılığı?",a:"λ=3, k=0: e^(−3) · 3⁰ / 0! = e^(−3) ≈ <b>0.0498</b>."},
  quiz:[{d:"kolay",q:"λ = 2 ise P(X = 1) yaklaşık kaçtır?",o:["0.135","0.271","0.5","0.2"],c:1,w:"e^(−2) · 2 / 1! ≈ 0.135 · 2 ≈ 0.271."},
        {d:"kolay",q:"Saatte ortalama 3 çağrı. 2 saatlik aralık için λ kaçtır?",o:["6","3","1.5","9"],c:0,w:"λ = hız × uzunluk = 3 · 2 = 6."},
        {d:"orta",q:"λ = 3. En az 1 olay olma olasılığı?",o:["0.950","0.050","0.149","0.199"],c:0,w:"1 − P(0) = 1 − e^(−3) ≈ 1 − 0.0498 = 0.950."},
        {d:"zor",q:"Kumaşta m² başına ortalama 0.4 hata. 5 m²'lik parçada en fazla 1 hata olma olasılığı?",o:["0.406","0.271","0.135","0.594"],c:0,w:"λ = 0.4·5 = 2; P(X ≤ 1) = e^(−2)(1 + 2) = 0.1353·3 ≈ 0.406."}]}
];

const LS = {
  get(k,d){try{const v=localStorage.getItem("end252e."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("end252e."+k,JSON.stringify(v))}catch(e){}}
};
let cut = Math.min(LS.get("cut", 10), T.length-1);
let cur = 0;
let tab = LS.get("tab", "video"); if(tab!=="video"&&tab!=="ozet") tab="video";
let mode = "topic";           // "topic" | "test"
let notes = LS.get("notes", "");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const covered = () => T.slice(0, cut + 1);
const ahead = () => T.slice(cut + 1);
const DIFF = {kolay:["Kolay","done"],orta:["Orta","en"],zor:["Zor","fut"]};

function renderCut(){
  $("#cutSel").innerHTML = T.map((t,i)=>`<option value="${i}" ${i===cut?"selected":""}>${i+1}. ${esc(t.title)}</option>`).join("");
  $("#progBar").style.width = ((cut+1)/T.length*100)+"%";
}
function renderRail(){
  let h = `<button class="t ${mode==="test"?"on":""}" data-i="test" type="button" style="margin-bottom:6px;border:1px dashed var(--accent)"><span class="n">✎</span><span class="nm" style="color:var(--accent);font-weight:600">Kendini test et (İngilizce)</span></button>`;
  h += `<h2>Konular</h2>`;
  T.forEach((t,i)=>{
    h += `<button class="t ${i<=cut?"done":"fut"} ${mode==="topic"&&i===cur?"on":""}" data-i="${i}" type="button"><span class="n">${String(i+1).padStart(2,"0")}</span><span class="nm">${esc(t.title)}</span><span class="st" title="${i<=cut?"İşlendi":"Henüz işlenmedi"}"></span></button>`;
    if(i===cut && i<T.length-1) h += `<div class="cut">Buradayız</div>`;
  });
  $("#rail").innerHTML = h;
  $("#mSel").innerHTML = `<option value="test" ${mode==="test"?"selected":""}>✎ Kendini test et (İngilizce)</option>` + T.map((t,i)=>`<option value="${i}" ${mode==="topic"&&i===cur?"selected":""}>${i+1}. ${esc(t.title)}${i>cut?" (henüz işlenmedi)":""}</option>`).join("");
}
function renderLesson(){
  if(mode==="test"){ renderTest(); return; }
  const t = T[cur], done = cur <= cut, vd = V[t.id];
  let h = `<div class="meta"><span class="pill ${done?"done":"fut"}">${done?"İşlendi":"Henüz işlenmedi"}</span><span class="pill en">${esc(t.en)}</span></div><h2>${esc(t.title)}</h2>`;
  h += `<div class="tabs" role="tablist">${[["video","▶ Video"],["ozet","Konu özeti"]].map(([k,l])=>`<button class="tab ${tab===k?"on":""}" data-tab="${k}" type="button" role="tab">${l}</button>`).join("")}</div>`;
  if(!done) h += `<div class="future-note" style="margin-bottom:16px">Bu konu listende henüz işlenmedi olarak görünüyor. Videoyu ve özeti yine de izleyebilirsin; asistan bu konuda sadece kısa ön bilgi verir.</div>`;
  if(tab==="video"){
    h += vd ? `<div class="player" id="vplayer">
      <div style="position:relative"><button class="vclose" id="vClose" type="button">✕ Küçült</button><div class="stage" id="stage" tabindex="0" aria-label="Video sahnesi"></div></div>
      <div class="pbar" id="pbar" aria-label="Sahneler"></div>
      <div class="ctrl">
        <button class="ib" id="vPrev" type="button" title="Önceki sahne">⏮</button>
        <button class="ib main" id="vPlay" type="button">▶ Oynat</button>
        <button class="ib" id="vNext" type="button" title="Sonraki sahne">⏭</button>
        <span class="scinfo" id="scInfo"></span>
        <span class="sp"></span>
        <button class="ib" id="vVoice" type="button" title="Sesli anlatım">🔊 Sesli</button>
        <select id="vRate" aria-label="Hız"><option value="0.85">0.85×</option><option value="1" selected>1×</option><option value="1.2">1.2×</option></select>
        <button class="ib" id="vFull" type="button" title="Büyüt / küçült">⛶</button>
      </div>
      <div class="cap" id="cap"></div>
      <div class="vnote" id="vnote"></div>
    </div>` : `<div class="future-note">Bu konunun videosu hazırlanıyor.</div>`;
  } else if(tab==="ozet"){
    h += `<div class="prose">${t.body}</div>`;
    h += `<h3>Formüller</h3><ul class="formulas">${t.f.map(([f,w,tr])=>`<li><span class="f">${esc(f)}</span>${w?`<span class="w">${esc(w)}</span>`:""}${tr?`<span class="tr">Türkçesi: ${esc(tr)}</span>`:""}</li>`).join("")}</ul>`;
    h += `<h3>Çözümlü örnek</h3><div class="example"><div class="q">${t.ex.q}</div><details><summary>Çözümü göster</summary><div class="a">${t.ex.a}</div></details></div>`;

function md(s){
  const lines = esc(s).split("\n"); let out="", list=null;
  const inline = x => x.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<i>$2</i>");

  let para=[];
  const flush=()=>{ if(para.length){ out+=`<p>${inline(para.join("<br>"))}</p>`; para=[]; } };
  for(const raw of lines){
    const l = raw.trimEnd();
    let m;
    if(!l.trim()){ flush(); close(); continue; }
    if((m=l.match(/^#{1,4}\s+(.*)/))){ flush(); close(); out+=`<h4>${inline(m[1])}</h4>`; continue; }
    if((m=l.match(/^\s*[-*•]\s+(.*)/))){ flush(); if(list!=="ul"){close(); out+="<ul>"; list="ul";} out+=`<li>${inline(m[1])}</li>`; continue; }
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){ flush(); if(list!=="ol"){close(); out+="<ol>"; list="ol";} out+=`<li>${inline(m[1])}</li>`; continue; }
    close(); para.push(l);
  }
  flush(); close(); return out;
}

async function send(text){
  text = (text||"").trim();
  if(!text || busy) return;
  if(!sample){ addSys("Asistan bu görünümde kullanılamıyor. Sayfayı claude.ai içinde açınca çalışır."); return; }
  busy = true; $("#sendBtn").disabled = true;
  if(!turns.length) log.innerHTML = "";
  turns.push({role:"user", content:text}); bubble("user", text);
  const d = bubble("assistant",""); d.innerHTML = `<span class="thinking">Düşünüyor…</span>`;
  ctl = new AbortController();
  const history = turns.slice(-14);
  if(history[0].role!=="user") history.shift();
  try{
    const r = await sample([{role:"user", content:rules()}, ...history], {
      cache:false, signal:ctl.signal,
      onText:({text})=>{ d.innerHTML = md(text); log.scrollTop = log.scrollHeight; }
    });
    d.innerHTML = md(r.text);
    turns.push({role:"assistant", content:r.text});
    if(r.truncated) addSys("Cevap uzun olduğu için kesildi. “Devam et” yazabilirsin.");
  }catch(e){
    const keep = e && e.text;
    if(keep){ d.innerHTML = md(keep); turns.push({role:"assistant", content:keep}); }
    else { d.remove(); turns.pop(); if(log.lastElementChild && log.lastElementChild.classList.contains("u")) log.lastElementChild.remove(); $("#input").value = text; }
    const code = e && e.code;
    const msg = {not_granted:"Asistan için izin verilmedi. Sayfanın izin menüsünden açabilirsin.",
      sampling_disabled:"Bu hesapta yapay zeka kullanılamıyor.",
      rate_limited:"Çok sık soru gönderildi ya da kullanım sınırına ulaşıldı. Biraz bekleyip tekrar dene.",
      session_expired:"Oturum süresi doldu, claude.ai’ye tekrar giriş yap.",
      refused:"Bu soruya cevap verilemedi, farklı şekilde sormayı dene.",
      prompt_too_large:"Notlar çok uzun. “Ders notları” kısmını kısaltıp tekrar dene.",
      cancelled:null}[code];
    if(msg!==null) addSys(msg || "Bağlantı sorunu oldu. Tekrar göndermeyi dene.");
    if(code==="not_granted"||code==="sampling_disabled") disableTutor(msg);
  }finally{
    busy=false; $("#sendBtn").disabled=false; LS.set("turns", turns.slice(-40));
  }
}

const P = { tid:null, i:0, step:-1, playing:false, gen:0, voice:true, rate:1, tts:null, cd:null, waiters:new Set(), sc:null, lineCb:false };
const est = t => Math.max(2.2, t.length/13.5);
const wait = ms => new Promise(res=>{ const id=setTimeout(()=>{P.waiters.delete(res); res();}, ms); res._id=id; P.waiters.add(res); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const pl=document.getElementById("vplayer"); if(pl&&pl.classList.contains("full")){ pl.classList.remove("full"); document.body.style.overflow=""; const f=document.getElementById("vFull"); if(f) f.textContent="⛶"; } } });
function stopAll(){ document.body.style.overflow=""; P.gen++; P.playing=false; if(P.tts){ try{ P.tts.stop(); }catch(e){} } if(P.cd){ clearInterval(P.cd); P.cd=null; } P.waiters.forEach(r=>{ clearTimeout(r._id); r(); }); P.waiters.clear(); updateControls(); }
function secOf(spec,i){ let s=""; for(let k=0;k<=i;k++) if(spec.sc[k].h) s=spec.sc[k].h; return s; }
function defaultHold(sc){ return ({cards:4.5,formula:4,compare:3.5,table:3,title:1.5,think:0.3})[sc.v.type] ?? 2.6; }
function openVideo(tid){ stopAll(); P.tid=tid; P.i=0; P.step=-1; renderPbar(); loadScene(0); bindPlayer(); }
function loadScene(i){ const spec=V[P.tid]; P.i=i; P.step=-1; const sc=spec.sc[i]; P.sc=sc;
  const stage=$("#stage"); if(!stage) return;
  stage.innerHTML=`<div class="sc-head"><span>${esc(secOf(spec,i))}</span><span>${i+1}/${spec.sc.length} · ${esc(sc.t)}</span></div><div class="v">${(R[sc.v.type]||R.text)(sc.v)}</div>`;
  setStep(-1); renderCap(sc,-1); updateControls(); }
function setStep(n){ const st=$("#stage"); if(!st) return; const groups=new Map();
  st.querySelectorAll("[data-s]").forEach(el=>{ const k=+el.dataset.s; if(el.hasAttribute("data-only")){ const key=el.parentNode; if(!groups.has(key)) groups.set(key,[]); groups.get(key).push([k,el]); } else el.classList.toggle("on", k<=n); });
  groups.forEach(list=>{ const max=Math.max(...list.map(x=>x[0])); list.forEach(([k,el])=>el.classList.toggle("on", n>=99 ? k===max : k===n)); }); }
function reveal(k){ P.step=k; setStep(k); renderCap(P.sc,k); }
function renderCap(sc,k){ const c=$("#cap"); if(!c) return; const b=sc.b||[]; c.innerHTML=b.map((t,i)=>`<p class="${i<k?"past":i===k?"now":"next"}">${esc(t)}</p>`).join("")||"<p class='next'>—</p>"; }
function renderPbar(){ const spec=V[P.tid]; const pb=$("#pbar"); if(!pb) return; pb.innerHTML=spec.sc.map((s,i)=>`<button class="seg${s.h&&i?" secstart":""}" data-i="${i}" type="button" title="${esc((i+1)+". "+s.t)}"></button>`).join(""); }
function updateControls(){ const spec=V[P.tid]; if(!spec) return; const pb=$("#pbar"); if(pb) pb.querySelectorAll(".seg").forEach(el=>{ const i=+el.dataset.i; el.classList.toggle("done",i<P.i); el.classList.toggle("cur",i===P.i); });
  const pl=$("#vPlay"); if(pl) pl.textContent = P.playing ? "⏸ Duraklat" : (P.i===0&&P.step<0 ? "▶ Oynat" : "▶ Devam");
  const si=$("#scInfo"); if(si) si.textContent=`Sahne ${P.i+1}/${spec.sc.length}${P.tts?"":" · sessiz mod"}`;
  const vb=$("#vVoice"); if(vb){ vb.hidden=!P.tts; vb.classList.toggle("on",P.voice); vb.textContent=P.voice?"🔊 Sesli":"🔇 Sessiz"; } }
function note(t){ const n=$("#vnote"); if(n) n.textContent=t; }
async function play(){ if(P.playing) return; const spec=V[P.tid]; if(!spec) return; P.playing=true; const gen=++P.gen; updateControls(); note("");
  while(P.playing && gen===P.gen){
    const sc=spec.sc[P.i]; const ok=await runScene(sc,gen); if(!ok) return;
    if(P.i<spec.sc.length-1){ loadScene(P.i+1); } else { P.playing=false; showEnd(); updateControls(); return; }
  } }
async function runScene(sc,gen){ const beats=sc.b||[]; let from=P.step+1;
  if(from<beats.length){
    if(P.voice && P.tts){
      const lines=beats.slice(from).map((t,k)=>({text:t,id:String(from+k),language:"tr"}));
      try{ await P.tts.speak(lines,{rate:P.rate,voice:"rounded"}); }
      catch(e){ if(gen!==P.gen) return false; const code=e&&e.code; if(code==="not_granted"){ P.voice=false; note("Sesli anlatım kapalı; sessiz modda devam ediliyor."); } else if(code!=="viewer_stopped"&&code!=="cancelled"){ note("Ses şu an kullanılamıyor ("+(code||"hata")+"); sessiz modda devam ediliyor."); P.voice=false; } updateControls(); if(!(await runTimed(beats,gen,Math.max(0,P.step+1)))) return false; }
    } else if(!(await runTimed(beats,gen,from))) return false;
  }
  if(gen!==P.gen) return false;
  setStep(99); renderCap(sc,99); P.step=beats.length;
  if(sc.v.type==="think"){ if(!(await countdown(sc.v.secs||10,gen))) return false; }
  await wait((sc.hold??defaultHold(sc))*1000); return gen===P.gen; }
async function runTimed(beats,gen,from){ for(let k=from;k<beats.length;k++){ if(gen!==P.gen) return false; reveal(k); await wait(est(beats[k])/P.rate*1000); } return gen===P.gen; }
function countdown(secs,gen){ return new Promise(res=>{ let left=secs; const n=$("#stage .th-n"), c=$("#stage .fgc"); const circ=2*Math.PI*44; if(c){ c.style.strokeDasharray=circ; c.style.strokeDashoffset=0; }
  const tick=()=>{ if(gen!==P.gen){ clearInterval(P.cd); P.cd=null; return res(false); } if(n) n.textContent=left; if(c) c.style.strokeDashoffset=circ*(1-left/secs); if(left<=0){ clearInterval(P.cd); P.cd=null; return res(true); } left--; };
  tick(); P.cd=setInterval(tick,1000); }); }
function pause(){ const wasBeats = P.step < (P.sc?.b||[]).length; stopAll(); if(wasBeats) P.step=Math.max(-1,P.step-1); updateControls(); }
function showEnd(){ const spec=V[P.tid]; const st=$("#stage"); if(!st) return; const next=T[cur+1]; st.innerHTML=`<div class="v">${R.end({title:T[cur].title,next:next?next.title:null})}</div>`; renderCap({b:[]},99); P.step=99; }
function bindPlayer(){ const pl=$("#vplayer"); if(!pl||pl.dataset.bound) return; pl.dataset.bound="1";
  $("#vPlay").addEventListener("click",()=>{ if(P.playing) pause(); else { if(P.step===99||!$("#stage .v")) loadScene(0); play(); } });
  $("#vPrev").addEventListener("click",()=>{ const wasP=P.playing; stopAll(); loadScene(Math.max(0,P.i-1)); if(wasP) play(); });
  $("#vNext").addEventListener("click",()=>{ const spec=V[P.tid]; const wasP=P.playing; stopAll(); if(P.i<spec.sc.length-1){ loadScene(P.i+1); if(wasP) play(); } else { showEnd(); updateControls(); } });
  $("#pbar").addEventListener("click",e=>{ const s=e.target.closest(".seg"); if(!s) return; const wasP=P.playing; stopAll(); loadScene(+s.dataset.i); if(wasP) play(); });
  $("#vVoice").addEventListener("click",()=>{ P.voice=!P.voice; LS.set("voice",P.voice); if(!P.voice && P.tts){ try{P.tts.stop();}catch(e){} } updateControls(); if(P.playing){ const st=P.step; stopAll(); P.step=st; play(); } });
  const toggleFull=()=>{ const pl=$("#vplayer"); if(!pl) return; const on=!pl.classList.contains("full"); pl.classList.toggle("full",on); document.body.style.overflow=on?"hidden":""; $("#vFull").textContent=on?"⤡":"⛶"; };
  $("#vFull").addEventListener("click",toggleFull); $("#vClose").addEventListener("click",toggleFull);
  $("#vRate").addEventListener("change",e=>{ P.rate=+e.target.value; if(P.tts){ try{ P.tts.setRate(P.rate); }catch(err){} } });
  $("#stage").addEventListener("click",e=>{ const b=e.target.closest("[data-end]"); if(!b) return; const a=b.dataset.end; if(a==="replay"){ loadScene(0); play(); } else if(a==="script"){ tab="senaryo"; LS.set("tab",tab); renderLesson(); } else if(a==="next"){ go(cur+1); } });
  $("#stage").addEventListener("keydown",e=>{ if(e.key===" "){ e.preventDefault(); $("#vPlay").click(); } else if(e.key==="ArrowRight"){ $("#vNext").click(); } else if(e.key==="ArrowLeft"){ $("#vPrev").click(); } });
  P.voice = LS.get("voice", true); $("#vRate").value=String(P.rate); updateControls(); }

/* ---------- Script / lecture-note view ---------- */
const TYPE_TR = {title:"Başlık kartı",text:"Madde kartı",formula:"Formül kartları",cards:"Özet kartı",steps:"Adım adım çözüm",compare:"Karşılaştırma tablosu (yanlış / doğru)",table:"Tablo",list:"Sonuç listesi (kutucuklar)",venn:"Venn diyagramı",grid:"6×6 sonuç ızgarası (iki zar)",bar:"Çubuk grafik",stair:"Merdiven grafik (CDF)",tree:"Ağaç diyagramı",urn:"Kutu ve toplar",slots:"Sayma kutuları (çarpma kuralı)",system:"Sistem güvenilirlik şeması",trials:"Deneme dizisi",curve:"Yoğunluk eğrisi ve alan",think:"Soru kartı + geri sayım",events:"Zaman çizelgesi",scatter:"Saçılım grafiği"};
function sceneSec(sc){ const b=sc.b||[]; return b.reduce((a,t)=>a+est(t),0)+(sc.hold??defaultHold(sc))+(sc.v.type==="think"?(sc.v.secs||10):0); }
function strings(v){ const out=[]; const skip=new Set(["type","mode","rule","fn","col","layout","cell","kind","balls","seq","k","xr","dom","coef","p","ticks","hl","cells","drawn","times","pts","trend","x","y","frames","F","ymax","dec","marker","shade","marks","secs","bad","all","col","rlabel","clabel","xlabel","ylabel","t0","t1","op"]);
  (function walk(o,key){ if(typeof o==="string"){ if(o.trim()) out.push(o); } else if(Array.isArray(o)) o.forEach(x=>walk(x,key)); else if(o&&typeof o==="object") Object.entries(o).forEach(([k,x])=>{ if(!skip.has(k)) walk(x,k); }); })(v);
  return [...new Set(out)].slice(0,16); }
function animNotes(sc){ const v=sc.v, n=(sc.b||[]).length; const g=(i,what)=>`Seslendirme ${i+1} ile: ${what}`; const list=[];
  const add=(arr,fmtf)=>arr.forEach((x,i)=>list.push(g(i,fmtf(x,i))));
  switch(v.type){
    case "title": list.push(g(0,"başlık belirir"), g(1,"alt başlık ve etiketler belirir")); break;
    case "text": add(v.items,(x,i)=>`${i+1}. madde soldan kayarak belirir`); break;
    case "formula": add(v.lines,(l)=>`“${l[0]}” kartı belirir, altında açıklaması`); break;
    case "cards": add(v.items,(x,i)=>`özet maddesi ${i+1} belirir`); break;
    case "steps": add(v.lines,(x,i)=>`çözüm adımı ${i+1} belirir`); break;
    case "compare": list.push(g(0,"sol sütun belirir"),g(1,"sağ sütun belirir"),g(2,"alt kural cümlesi belirir")); break;
    case "table": add(v.rows,(r,i)=>`tablo satırı ${i+1} (${r[0]}) belirir`); break;
    case "list": (v.steps||[{label:v.label}]).forEach((s,i)=>list.push(g(i,i===0&&!v.steps?"kutucuklar belirir":`${(s.hl||[]).length?"vurgulanan kutucuklar değişir, ":""}etiket: “${s.label||""}”`))); break;
    case "venn": add(v.steps,(s)=>`boyalı bölge: ${s.mode} — “${s.label}”`); break;
    case "grid": add(v.steps,(s)=>`vurgulanan hücreler: ${s.rule||"liste"} — “${s.label}”`); break;
    case "bar": if(v.frames) add(v.frames,(f,i)=>`grafik ${i+1}. duruma geçer${v.flabels?" ("+v.flabels[i]+")":""}`); else add(v.y,(y,i)=>`“${v.x[i]}” çubuğu aşağıdan yukarı büyür (${y})`); break;
    case "stair": add(v.x,(x,i)=>`x = ${x} noktasında sıçrama ve yatay basamak çizilir (F = ${v.F[i]})`); break;
    case "tree": list.push(g(0,"kök ve 1. seviye dallar"),g(1,"2. seviye dallar"),g(2,"uçlardaki çarpım sonuçları")); (v.steps||[]).forEach((s,i)=>list.push(g(3+i,`yol vurgulanır — “${s.label}”`))); break;
    case "urn": add(v.steps,(s)=>`${(s.drawn||[]).length} top çekilmiş görünür — “${s.label}”`); break;
    case "slots": add(v.vals,(x,i)=>`${i+1}. kutuya ${x} yazılır`); list.push(g(v.vals.length,`çarpım sonucu “${v.total}”`)); break;
    case "system": list.push(g(0,"blok şeması çizilir")); add(v.steps||[],(l,i)=>`formül satırı: ${l}`); break;
    case "trials": add([...v.seq],(c,i)=>`${i+1}. deneme kutusu (${c}) belirir`); (v.steps||[]).forEach((l,i)=>list.push(g(v.seq.length+i,`satır: ${l}`))); break;
    case "curve": add(v.steps,(s)=>`${s.shade?`[${s.shade[0]}, ${s.shade[1]}] aralığı boyanır`:"işaretler belirir"} — “${s.label||""}”`); break;
    case "think": list.push("Soru ve şıklar ekranda; seslendirme bitince 10 saniyelik geri sayım halkası çalışır."); break;
    case "events": list.push(g(0,"olay noktaları zaman çizgisine sırayla düşer")); add(v.steps||[],(l)=>`satır: ${l}`); break;
    case "scatter": list.push(g(0,"noktalar belirir"),g(1,"eğilim çizgisi")); add(v.steps||[],(l)=>`etiket: ${l}`); break;
  }
  return list.slice(0,Math.max(n,1)+2); }
function renderScript(spec,t){ const total=spec.sc.reduce((a,s)=>a+sceneSec(s),0); const mins=Math.round(total/60);
  let h=`<div class="hed"><h3 style="margin:0">Video senaryosu ve sahne planı</h3><span class="pill en">${mins} dk</span></div>`;

  h+=`<section><h3>3. Sahne planı</h3><div style="display:grid;gap:10px">`;

    h+=`<div class="scene"><div class="sh"><b>Sahne ${i+1}</b><span>${esc(sc.t)}</span><span class="dur">~${secs} sn</span>${sc.v.type==="cards"?`<span class="pill done">Özet kartı</span>`:""}${sc.v.type==="think"?`<span class="pill done">10 sn düşünme</span>`:""}</div>
      <div><div class="lab">Ekranda görünecek görsel</div><p><b>${esc(TYPE_TR[sc.v.type]||sc.v.type)}.</b> ${esc(sc.d||"")}</p></div>
      <div><div class="lab">Animasyon hareketleri</div><ul>${animNotes(sc).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
      <div><div class="lab">Seslendirme metni</div>${(sc.b||[]).map(x=>`<p>${esc(x)}</p>`).join("")}</div>
      <div><div class="lab">Ekrandaki metin, formül ve etiketler</div><div class="os">${strings(sc.v).map(x=>`<span>${esc(x)}</span>`).join("")}</div></div></div>`; });
  h+=`</div></section>`;
  const cards=spec.sc.filter(s=>s.v.type==="cards");
  h+=`<section><h3>4. Ara özet kartları</h3><div style="display:grid;gap:10px">${cards.map((s,i)=>`<div class="scene"><div class="sh"><b>${esc(s.v.h||"Özet kartı")}</b><span class="dur">${esc(s.h||"")}</span></div><ul>${s.v.items.map(x=>`<li>${mi(x)}</li>`).join("")}</ul></div>`).join("")}</div></section>`;
  const sonuc=spec.sc.find(s=>s.h==="Sonuç ve tekrar"); if(sonuc) h+=`<section><h3>5. Sonuç ve tekrar</h3><ul style="margin:0;padding-left:20px">${sonuc.v.items.map(x=>`<li>${mi(x)}</li>`).join("")}</ul></section>`;
  const exs=spec.sc.filter(s=>s.h==="Örnekler"||/örnek/i.test(s.t));

{t:"s3",d:"easy",q:"In how many ways can 4 different books be arranged on a shelf?",o:["4","16","24","12"],c:2,e:"4! = 4 · 3 · 2 · 1 = 24, a permutation of all four objects."},
{t:"s3",d:"easy",q:"A committee of 3 people is to be selected from 10 people. How many different committees are possible?",o:["720","120","30","1000"],c:1,e:"Order does not matter, so use the combination C(10, 3) = 120."},
{t:"s3",d:"medium",q:"From 6 people, a president and a vice president are to be selected. In how many ways can this be done?",o:["15","30","36","720"],c:1,e:"Order matters because the two positions are different: P(6, 2) = 6 · 5 = 30."},
{t:"s3",d:"medium",q:"A 4-digit code uses the digits 0 to 9 and digits may be repeated. How many codes are possible?",o:["5040","10000","40","24"],c:1,e:"Multiplication rule: 10 · 10 · 10 · 10 = 10⁴ = 10000."},
{t:"s3",d:"hard",q:"A lot of 12 parts contains 4 defective parts. Three parts are selected at random without replacement. What is the probability that exactly one of them is defective?",o:["0.509","0.333","0.255","0.127"],c:0,e:"C(4, 1) · C(8, 2) / C(12, 3) = 4 · 28 / 220 = 112 / 220 ≈ 0.509."},
{t:"s3",d:"hard",q:"A team of 4 is selected at random from 3 industrial engineers and 5 mechanical engineers. What is the probability that the team contains at least one industrial engineer?",o:["13/14","3/7","1/14","1/2"],c:0,e:"Use the complement: P(no industrial engineer) = C(5, 4) / C(8, 4) = 5/70 = 1/14, so P(at least one) = 13/14."},

{t:"s4",d:"easy",q:"P(A ∩ B) = 0.12 and P(B) = 0.4. Find P(A | B).",o:["0.048","0.3","0.52","0.12"],c:1,e:"Definition of conditional probability: P(A | B) = P(A ∩ B) / P(B) = 0.12 / 0.4 = 0.3."},
{t:"s4",d:"easy",q:"A fair die is rolled and you are told that the result is even. What is the probability that it is a 6?",o:["1/6","1/3","1/2","2/3"],c:1,e:"The reduced sample space is {2, 4, 6}; one of the three equally likely outcomes is 6."},
{t:"s4",d:"medium",q:"A box contains 5 red and 3 blue balls. Two balls are drawn without replacement. What is the probability that both are blue?",o:["3/28","9/64","3/8","1/4"],c:0,e:"Multiplication rule: (3/8) · (2/7) = 6/56 = 3/28."},
{t:"s4",d:"medium",q:"Which statement is always true?",o:["P(A | B) = P(B | A)","P(A | B) = P(A ∩ B) / P(B) when P(B) > 0","P(A | B) = P(A) + P(B)","P(A | B) ≤ P(A)"],c:1,e:"This is the definition of conditional probability. In general P(A | B) and P(B | A) are different."},
{t:"s4",d:"hard",q:"Machine 1 produced 120 parts, 6 of them defective; machine 2 produced 80 parts, 10 of them defective. A part is selected at random and found to be non-defective. What is the probability that it came from machine 1?",o:["0.620","0.95","0.375","0.6"],c:0,e:"Condition on the non-defective column of the table: P(M1 | non-defective) = 114 / 184 ≈ 0.620."},
{t:"s4",d:"hard",q:"A box contains 4 good and 2 defective lamps. Three lamps are drawn without replacement. What is the probability that all three are good?",o:["1/5","8/27","1/3","2/5"],c:0,e:"General multiplication rule: (4/6) · (3/5) · (2/4) = 24/120 = 1/5. Equivalently C(4, 3) / C(6, 3) = 4/20."},

{t:"s5",d:"easy",q:"Machine 1 makes 60% of the parts with 2% defective; machine 2 makes 40% with 5% defective. What is the probability that a randomly selected part is defective?",o:["0.07","0.032","0.035","0.012"],c:1,e:"Law of total probability: 0.6 · 0.02 + 0.4 · 0.05 = 0.012 + 0.020 = 0.032."},
{t:"s5",d:"easy",q:"In the same setting, a part is found to be defective. What is the probability that it came from machine 1?",o:["0.6","0.012","0.375","0.02"],c:2,e:"Bayes' theorem: P(M1 | D) = 0.012 / 0.032 = 0.375."},
{t:"s5",d:"medium",q:"The events B₁, B₂, …, Bₙ form a partition of the sample space if",o:["they are mutually exclusive and their union is S","they are independent","they all have the same probability","each one is a subset of the next"],c:0,e:"A partition divides the sample space into disjoint pieces that together cover everything."},
{t:"s5",d:"medium",q:"P(B) = 0.3, P(A | B) = 0.8 and P(A | Bᶜ) = 0.2. Find P(A).",o:["0.38","0.5","0.24","1.0"],c:0,e:"Total probability: 0.8 · 0.3 + 0.2 · 0.7 = 0.24 + 0.14 = 0.38."},
{t:"s5",d:"hard",q:"A disease has a prevalence of 10%. The test detects the disease with probability 0.95 and gives a false positive with probability 0.10. If a person tests positive, what is the probability that the person actually has the disease?",o:["0.51","0.95","0.10","0.19"],c:0,e:"P(positive) = 0.1 · 0.95 + 0.9 · 0.10 = 0.185; P(disease | positive) = 0.095 / 0.185 ≈ 0.51."},
{t:"s5",d:"hard",q:"Three machines produce 50%, 30% and 20% of the output, with defective rates of 1%, 2% and 4%. A defective part is found. What is the probability that it was produced by the third machine?",o:["0.421","0.263","0.316","0.2"],c:0,e:"P(D) = 0.005 + 0.006 + 0.008 = 0.019; P(M3 | D) = 0.008 / 0.019 ≈ 0.421."},

{t:"s6",d:"easy",q:"A and B are independent with P(A) = 0.5 and P(B) = 0.4. Find P(A ∩ B).",o:["0.9","0.2","0.1","0"],c:1,e:"For independent events P(A ∩ B) = P(A) P(B) = 0.5 · 0.4 = 0.2."},
{t:"s6",d:"easy",q:"Two independent components, each working with probability 0.9, are connected in series. What is the reliability of the system?",o:["0.81","0.99","0.9","1.8"],c:0,e:"A series system works only if both components work: 0.9 · 0.9 = 0.81."},
{t:"s6",d:"medium",q:"P(A) = 0.3, P(B) = 0.5, and A and B are mutually exclusive. Are A and B independent?",o:["No, because P(A ∩ B) = 0 ≠ P(A) P(B)","Yes, because they cannot affect each other","Yes, because P(A) ≠ P(B)","It cannot be determined"],c:0,e:"Mutually exclusive events with positive probabilities are always dependent: if one occurs, the other cannot."},
{t:"s6",d:"medium",q:"Three independent components, each working with probability 0.8, are connected in parallel. What is the reliability of the system?",o:["0.992","0.512","0.8","0.96"],c:0,e:"The system fails only if all three components fail: 1 − 0.2³ = 0.992."},
{t:"s6",d:"hard",q:"Component A (0.9) is in series with a parallel block of B (0.8) and C (0.8). All components are independent. What is the reliability of the system?",o:["0.864","0.576","0.72","0.96"],c:0,e:"Parallel block: 1 − (0.2)(0.2) = 0.96; then the series product 0.9 · 0.96 = 0.864."},
{t:"s6",d:"hard",q:"If A and B are independent, which pair of events is also independent?",o:["A and Bᶜ","A and A ∩ B","A ∪ B and A","none of them"],c:0,e:"P(A ∩ Bᶜ) = P(A) − P(A) P(B) = P(A) P(Bᶜ), so A and Bᶜ are independent."},

{t:"s7",d:"easy",q:"A probability mass function has p(0) = 0.2, p(1) = 0.5 and p(2) = c. What is c?",o:["0.5","0.3","0.2","1"],c:1,e:"The probabilities of a pmf must sum to 1, so c = 1 − 0.7 = 0.3."},
{t:"s7",d:"easy",q:"A coin is tossed twice and X is the number of heads. Find F(1) = P(X ≤ 1).",o:["1/4","1/2","3/4","1"],c:2,e:"F(1) = p(0) + p(1) = 1/4 + 1/2 = 3/4."},
{t:"s7",d:"medium",q:"The pmf of X is p(1) = 0.2, p(2) = 0.3 and p(3) = 0.5. Find P(X ≥ 2).",o:["0.8","0.5","0.3","0.2"],c:0,e:"P(X ≥ 2) = p(2) + p(3) = 0.8, or equivalently 1 − F(1) = 1 − 0.2."},
{t:"s7",d:"medium",q:"For a discrete random variable with integer values, P(X < 3) is equal to",o:["F(2)","F(3)","1 − F(3)","p(3)"],c:0,e:"For integer values, X < 3 means X ≤ 2, so P(X < 3) = F(2)."},
{t:"s7",d:"hard",q:"A box has 4 good and 2 defective parts. Two parts are drawn without replacement and X is the number of defective parts. Find P(X = 1).",o:["8/15","1/3","1/15","2/5"],c:0,e:"C(2, 1) · C(4, 1) / C(6, 2) = 8/15. The draws are not independent, so you cannot simply multiply 2/6 and 4/6."},
{t:"s7",d:"hard",q:"Which of the following is NOT a property of a cumulative distribution function F(x)?",o:["F(x) can decrease as x increases","0 ≤ F(x) ≤ 1","F(x) approaches 1 as x goes to infinity","P(a < X ≤ b) = F(b) − F(a)"],c:0,e:"A cdf is non-decreasing: it never goes down as x increases."},

{t:"s8",d:"easy",q:"X takes the values 0 and 2, each with probability 0.5. Find E[X].",o:["0","1","2","0.5"],c:1,e:"E[X] = 0 · 0.5 + 2 · 0.5 = 1."},
{t:"s8",d:"easy",q:"E[X] = 3 and Var(X) = 4. For Y = 2X + 1, find E[Y] and Var(Y).",o:["7 and 16","7 and 9","6 and 8","7 and 8"],c:0,e:"E[Y] = 2 · 3 + 1 = 7 and Var(Y) = 2² · 4 = 16; the constant 1 does not change the variance."},
{t:"s8",d:"medium",q:"X takes the values 0 and 2, each with probability 0.5. Find Var(X).",o:["1","2","0.5","0.25"],c:0,e:"E[X²] = 0 · 0.5 + 4 · 0.5 = 2, so Var(X) = E[X²] − (E[X])² = 2 − 1 = 1."},
{t:"s8",d:"medium",q:"The standard deviation of X is 5. What is Var(3X)?",o:["15","45","225","75"],c:2,e:"Var(X) = 25 and Var(3X) = 3² · Var(X) = 9 · 25 = 225."},
{t:"s8",d:"hard",q:"X = −10 with probability 0.2, X = 0 with probability 0.5 and X = 20 with probability 0.3. Find Var(X).",o:["124","140","16","108"],c:0,e:"E[X] = −2 + 0 + 6 = 4; E[X²] = 20 + 0 + 120 = 140; Var(X) = 140 − 16 = 124."},
{t:"s8",d:"hard",q:"A venture gives a profit of 50 with probability 0.6, a profit of 10 with probability 0.3 or a loss of 80 with probability 0.1 (in thousand TL). Find the expected profit.",o:["25","30","35","21"],c:0,e:"E[X] = 0.6 · 50 + 0.3 · 10 + 0.1 · (−80) = 30 + 3 − 8 = 25 thousand TL."},

{t:"s9",d:"easy",q:"X has a binomial distribution with n = 20 and p = 0.3. Find E[X].",o:["0.3","6","4.2","20"],c:1,e:"The mean of a binomial random variable is np = 20 · 0.3 = 6."},
{t:"s9",d:"easy",q:"A fair coin is tossed 4 times. What is the probability of exactly 2 heads?",o:["0.375","0.25","0.5","0.0625"],c:0,e:"C(4, 2) · (0.5)² · (0.5)² = 6/16 = 0.375."},
{t:"s9",d:"medium",q:"10% of the parts are defective. Five parts are selected independently. What is the probability of at least one defective part?",o:["0.41","0.59","0.33","0.5"],c:0,e:"P(at least one) = 1 − P(X = 0) = 1 − 0.9⁵ = 1 − 0.590 = 0.41."},
{t:"s9",d:"medium",q:"Which condition is NOT required for a binomial experiment?",o:["The trials are sampled without replacement from a small lot","The number of trials is fixed","Each trial has only two outcomes","The probability of success is the same in each trial"],c:0,e:"Sampling without replacement from a small lot violates independence; a binomial experiment requires independent trials."},
{t:"s9",d:"hard",q:"X has a binomial distribution with n = 10 and p = 0.2. Find P(X ≤ 1).",o:["0.376","0.268","0.107","0.624"],c:0,e:"P(X = 0) + P(X = 1) = 0.8¹⁰ + 10 · 0.2 · 0.8⁹ = 0.107 + 0.268 = 0.376."},
{t:"s9",d:"hard",q:"A machine produces 5% defective parts. Boxes of 20 parts are accepted if they contain at most one defective part. What is the probability that a box is accepted?",o:["0.736","0.358","0.377","0.264"],c:0,e:"P(X ≤ 1) = 0.95²⁰ + 20 · 0.05 · 0.95¹⁹ ≈ 0.358 + 0.377 = 0.736."},

{t:"s10",d:"easy",q:"The probability of success in each trial is 0.25. What is the expected number of trials until the first success?",o:["0.25","4","3","12"],c:1,e:"For a geometric random variable E[X] = 1/p = 1/0.25 = 4."},
{t:"s10",d:"easy",q:"The probability of success in each trial is 0.2. What is the probability that the first success occurs on the third trial?",o:["0.128","0.2","0.16","0.512"],c:0,e:"(1 − p)² · p = 0.8² · 0.2 = 0.128: two failures and then a success."},
{t:"s10",d:"medium",q:"The probability of success in each trial is 0.3. What is the probability that more than 3 trials are needed to obtain the first success?",o:["0.343","0.657","0.147","0.3"],c:0,e:"P(X > 3) = (1 − p)³ = 0.7³ = 0.343: the first three trials all fail."},
{t:"s10",d:"medium",q:"The lack of memory property of the geometric distribution states that",o:["P(X > m + n | X > m) = P(X > n)","P(X > m + n) = P(X > m) + P(X > n)","E[X] = 1/p","P(X = k) decreases as k increases"],c:0,e:"Past failures do not change the distribution of the number of additional trials that are needed."},
{t:"s10",d:"hard",q:"A test device makes an error on each part with probability 0.1, independently. The first 4 parts were classified correctly. What is the probability that the next 2 parts are also classified correctly?",o:["0.81","0.531","0.9","0.19"],c:0,e:"By the lack of memory property, P(X > 6 | X > 4) = P(X > 2) = 0.9² = 0.81."},
{t:"s10",d:"hard",q:"X is a geometric random variable with p = 0.1. What is the variance of X?",o:["90","10","0.9","100"],c:0,e:"Var(X) = (1 − p) / p² = 0.9 / 0.01 = 90."},

{t:"s11",d:"easy",q:"Calls arrive according to a Poisson process at a rate of 3 per hour. What is λ for a period of 2 hours?",o:["6","3","1.5","9"],c:0,e:"λ = rate × length of the interval = 3 · 2 = 6."},
{t:"s11",d:"easy",q:"X has a Poisson distribution with λ = 2. Find P(X = 1).",o:["0.135","0.271","0.5","0.2"],c:1,e:"P(X = 1) = e⁻² · 2¹ / 1! = 0.1353 · 2 ≈ 0.271."},
{t:"s11",d:"medium",q:"The number of flaws in a cable follows a Poisson distribution with a mean of 3 flaws per 100 metres. What is the probability of at least one flaw in 100 metres?",o:["0.950","0.050","0.149","0.199"],c:0,e:"P(X ≥ 1) = 1 − P(X = 0) = 1 − e⁻³ ≈ 1 − 0.0498 = 0.950."},
{t:"s11",d:"medium",q:"For a Poisson random variable with parameter λ, which statement is true?",o:["E[X] = Var(X) = λ","E[X] = λ and Var(X) = λ²","E[X] = 1/λ","X takes values from 0 to λ"],c:0,e:"The mean and the variance of a Poisson distribution are both equal to λ."},
{t:"s11",d:"hard",q:"A fabric has on average 0.4 flaws per square metre. What is the probability that a piece of 5 square metres has at most one flaw?",o:["0.406","0.271","0.135","0.594"],c:0,e:"λ = 0.4 · 5 = 2, so P(X ≤ 1) = e⁻² (1 + 2) ≈ 0.406."},
{t:"s11",d:"hard",q:"There are 200 independent parts, each defective with probability 0.01. Using the Poisson approximation, what is the probability of exactly 2 defective parts?",o:["0.271","0.135","0.180","0.090"],c:0,e:"λ = np = 200 · 0.01 = 2, so P(X = 2) = e⁻² · 2² / 2! ≈ 0.271."}
];

/* Key terms per topic (English → Turkish), shown in the test setup */
const KEYTERMS = {
 s1:[["random experiment","rastgele deney"],["sample space","örnek uzayı"],["outcome","sonuç"],["event","olay"],["union","birleşim"],["intersection","kesişim"],["complement","tümleyen"],["mutually exclusive","ayrık"],["De Morgan's laws","De Morgan kuralları"]],
 s2:[["axiom","aksiyom"],["complement rule","tümleyen kuralı"],["addition rule","toplama kuralı"],["equally likely","eşit olasılıklı"],["exactly one","tam olarak biri"]],
 s3:[["multiplication rule","çarpma kuralı"],["permutation","permütasyon"],["combination","kombinasyon"],["factorial","faktöriyel"],["without replacement","geri koymadan"],["at random","rastgele"]],
 s4:[["conditional probability","koşullu olasılık"],["given","verildiğinde / bilindiğine göre"],["reduced sample space","indirgenmiş örnek uzayı"],["multiplication rule","çarpma kuralı"],["defective","kusurlu"],["non-defective","kusursuz / sağlam"]],
 s5:[["law of total probability","toplam olasılık kuralı"],["Bayes' theorem","Bayes teoremi"],["partition","parçalanış"],["prior","önsel"],["posterior","sonsal"],["false positive","yanlış pozitif"],["prevalence","yaygınlık / sıklık"]],
 s6:[["independent","bağımsız"],["dependent","bağımlı"],["reliability","güvenilirlik"],["series","seri"],["parallel","paralel"],["component","bileşen"]],
 s7:[["random variable","rastgele değişken"],["discrete","kesikli"],["probability mass function (pmf)","olasılık kütle fonksiyonu"],["cumulative distribution function (cdf)","birikimli dağılım fonksiyonu"],["non-decreasing","azalmayan"]],
 s8:[["expected value / mean","beklenen değer / ortalama"],["variance","varyans"],["standard deviation","standart sapma"],["profit","kâr"],["loss","zarar"]],
 s9:[["Bernoulli trial","Bernoulli denemesi"],["binomial distribution","binom dağılımı"],["success / failure","başarı / başarısızlık"],["trial","deneme"],["at least / at most","en az / en fazla"]],
 s10:[["geometric distribution","geometrik dağılım"],["first success","ilk başarı"],["lack of memory (memoryless)","hafızasızlık"],["additional","ek / ilave"]],
